<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11172a"><title>مملكة النمل | لَمّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#fff4df;--muted:#c5b9a8;--gold:#ffca72}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#ffca8b 0,#e99b68 38%,#a85f4b 100%);font-family:Cairo,Arial,sans-serif;color:var(--ink);padding:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}.page{max-width:900px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 12px}.back,.tool{background:#573e3c;border:2px solid #ffdcaa;border-radius:14px;padding:9px 14px;box-shadow:0 4px 0 #7b493d;font-weight:900;text-decoration:none}.level{text-align:center;text-shadow:0 3px 0 #a75d3f}.level small{display:block;font-size:11px;color:#fff1d5}.level strong{font-size:clamp(23px,5vw,34px)}.tools{display:flex;gap:8px}.board-shell{position:relative;background:linear-gradient(145deg,#fff0d8,#dfb998);border:5px solid #f6d7b8;border-radius:34px;padding:clamp(12px,3vw,26px);box-shadow:0 12px 30px #6f352c55,inset 0 0 0 2px #dba985}.board-inner{position:relative;background:#fff8eb;border-radius:14px;padding:8px;box-shadow:inset 0 2px 8px #a77b5d55}.board{width:100%;display:block;aspect-ratio:1.16/1;touch-action:manipulation}.ground{height:104px;position:relative;display:flex;align-items:center;justify-content:space-around}.burrow{width:92px;height:34px;border-radius:50%;background:radial-gradient(ellipse,#1b100d 0 45%,#59372a 62%,#d9a276 70%);box-shadow:0 8px 10px #85523b66;position:relative}.burrow:after{content:"";position:absolute;width:42px;height:10px;border-radius:50%;background:#21130f;left:25px;top:10px}.home-label{font-size:11px;color:#70483a;font-weight:900}.progress{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 8px;color:#fff8e9;font-weight:800}.bar{height:10px;background:#754a45;border:1px solid #f9c99c;border-radius:20px;overflow:hidden;flex:1}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe08d,#fff3c1);transition:width .3s}.hint{text-align:center;color:#fff1df;font-size:12px;margin:8px 0 12px}.colonies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;align-items:start}.colony-column{display:flex;flex-direction:column;gap:9px;min-width:0}.colony.waiting{opacity:.78;filter:saturate(.8);box-shadow:0 3px 0 #985e4d;position:relative}.lock-mark{position:absolute;top:4px;right:5px;font-size:15px;line-height:1;text-shadow:0 1px 3px #38251f;background:#241d2bbd;border:1px solid #ffffff55;border-radius:20px;padding:3px 5px}.colony-column .colony.waiting .cube-swatch{filter:brightness(.8)}.colony{min-width:0;min-height:68px;background:linear-gradient(145deg,#fff1df,#d6ad8b);border:3px solid #f9d7b3;border-radius:16px;padding:7px;box-shadow:0 5px 0 #985e4d;display:grid;place-items:center;transition:.15s}.cube-swatch{width:min(100%,38px);aspect-ratio:1;border-radius:9px;background:linear-gradient(145deg,var(--cube-light),var(--cube) 55%,var(--cube-dark));box-shadow:inset 3px 3px 5px #ffffff88,inset -4px -5px 7px #0003,0 3px 5px #52352b66;transform:rotate(-5deg);border:1px solid #ffffff88}.count{font-size:clamp(20px,4vw,30px);font-weight:900;color:#fff;text-shadow:2px 3px 0 #342b35}.colony{transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}.colony:active{transform:translateY(2px) scale(.97);filter:brightness(1.08)}.colony.active{transform:translateY(-4px) scale(1.04);border-color:#fff;box-shadow:0 8px 0 #985e4d,0 0 0 3px #fff8}.colony:disabled{opacity:.35;filter:grayscale(1)}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.action{padding:10px 16px;border-radius:12px;background:linear-gradient(145deg,#6041a0,#37265e);border:2px solid #c7a8ff;box-shadow:0 4px 0 #241a42;font-weight:900}.action.gold{background:linear-gradient(145deg,#ffce75,#c87937);border-color:#ffe8ae;color:#49291d;box-shadow:0 4px 0 #854c32}.message{text-align:center;min-height:26px;color:#fff4dc;font-weight:800}.win{display:none;text-align:center;padding:18px;border-radius:18px;background:#513b35;border:2px solid #ffdb9e;margin:12px 0}.win.show{display:block}.win h2{margin:0 0 5px}.win p{margin:0 0 12px;color:#f6ddc5}.ant{filter:drop-shadow(0 2px 1px #51342d66)}
@media(max-width:560px){body{padding:8px}.top{margin-bottom:10px}.board-shell{border-radius:24px;padding:10px}.ground{height:75px}.colonies{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.colony-column{gap:6px}.colony{min-height:64px;border-radius:12px;padding:6px 2px;display:flex;align-items:center;justify-content:space-evenly}.colony small{font-size:8px}.actions{margin:14px 0}.back,.tool{padding:7px 10px;font-size:11px}}
</style>
</head>
<body><main class="page">
<header class="top"><a class="back" href="../">← لَمّة</a><div class="level"><small>مملكة النمل · مرحلة</small><strong id="level">01</strong></div><div class="tools"><button class="tool" id="pause">Ⅱ</button><button class="tool" id="speed">1×</button></div></header>
<section class="board-shell"><div class="board-inner"><canvas id="board" class="board" width="696" height="600" aria-label="لوحة المربعات"></canvas></div><div class="ground"><div><div class="home-label">جحور المستعمرات</div></div><div class="burrow"></div><div class="home-label" id="collected">0 / 0</div></div></section>
<div class="progress"><span>تنظيف الرسمة</span><div class="bar"><i id="bar"></i></div><span id="percent">0%</span></div>
<p class="hint">اختار لون المستعمرة، والنمل هيلمّ المربعات المطابقة ويرجع بيها للجحر.</p>
<section class="colonies" id="colonies"></section>
<div class="actions"><button class="action gold" id="dispatch">🐜 ابعت النمل يجمع</button><button class="action" id="restart">↻ إعادة المرحلة</button></div>
<div class="message" id="message" aria-live="polite">اختار لون وابدأ جمع المربعات!</div>
<section class="win" id="win"><h2>🎉 الرسمة اتنضفت!</h2><p>كل المربعات رجعت للجحر. جاهز للمرحلة اللي بعدها؟</p><button class="action gold" id="next">المرحلة التالية ←</button></section>
</main>
<script>
(()=> {
const cv=document.getElementById('board'),c=cv.getContext('2d'),$=id=>document.getElementById(id);
const C=[['سماوي','#16c9e8','#0787b0'],['برتقالي','#ff9d18','#d56b05'],['أخضر','#37c86a','#14864b'],['وردي','#f34e75','#b92750'],['أبيض','#fff7e8','#c7bba7'],['بنفسجي','#55415f','#30253b']];
const COLS=22,ROWS=16,W=696/COLS,H=600/ROWS,BATCH=10;
let tiles=[],ants=[],groups=[],sparks=[],level=1,done=0,total=0,paused=false,speed=1,last=0,bad=0,failed=false,busy=false,activeGroup=null;
function colorFor(x,y){
 const nx=(x-10.5)/8.1,ny=(y-8)/6.5;
 const leaf=((x>=7&&x<=17&&y>=1&&y<=5&&((x-12)/5)**2+((y-3)/2.5)**2<1));
 const fruit=(nx*nx+ny*ny<.88);
 const outline=(nx*nx+ny*ny<1.05)&&!fruit;
 const rind=(nx*nx+ny*ny<.98&&nx*nx+ny*ny>.84);
 const red=(fruit&&y>11);
 const white=(fruit&&((x<5&&y>5&&y<11)||(y===5&&x>6&&x<15)));
 if(leaf)return 2;
 if(outline)return 5;
 if(rind||white)return 4;
 if(red)return 3;
 if(fruit)return 1;
 // subtle non-uniform level backgrounds, while keeping the outer frame removable
 return 0;
}
function shapeColor(x,y){
 const mode=(level-1)%5;
 if(mode===0)return colorFor(x,y);
 const nx=(x-10.5)/8.2,ny=(y-8)/6.5;
 if(mode===1){if(nx*nx+ny*ny<.88)return (y>11?3:1);if(nx*nx+ny*ny<1.05)return 5;if(y<5&&x>6&&x<17)return 2;return 0}
 if(mode===2){if(Math.abs(nx)+Math.abs(ny)<.92)return 1;if(Math.abs(nx)+Math.abs(ny)<1.08)return 5;if(y<5&&x>7&&x<15)return 2;return 0}
 if(mode===3){if(nx*nx/1.1+ny*ny/.72<.86)return 3;if(nx*nx/1.1+ny*ny/.72<1.04)return 5;if(y<5&&x>7&&x<15)return 2;return 0}
 if(Math.abs(nx)<.72&&Math.abs(ny)<.75)return 1;
 if(Math.abs(nx)<.9&&Math.abs(ny)<.92)return 5;
 return 0;
}
function neighbors(t){return [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>tiles.find(q=>q.x===t.x+dx&&q.y===t.y+dy)).filter(Boolean)}
function exposed(t){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const q=tiles.find(q=>q.x===t.x+dx&&q.y===t.y+dy);return !q||!q.alive})}
function build(){
 tiles=[];ants=[];sparks=[];done=0;bad=0;failed=false;paused=false;busy=false;
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)tiles.push({x,y,alive:true,color:shapeColor(x,y)});
 total=tiles.length;
 $('level').textContent=String(level).padStart(2,'0');
 $('win').classList.remove('show');
 $('win').querySelector('h2').textContent='🎉 الرسمة اتنضفت!';
 $('win').querySelector('p').textContent='كل مكعبات الرسمة اتجمعت. جاهز للمرحلة اللي بعدها؟';
 $('next').textContent='المرحلة التالية ←';$('next').onclick=()=>{level++;build()};
 $('message').textContent='اختار لون من المربعات تحت. النمل هيجمع مكعبات اللون ده من الأطراف.';
 makeGroups();renderControls();ui();draw();
}
function makeGroups(){
 groups=[[],[],[],[]];
 const pool=[];
 C.forEach((v,color)=>{
  let count=tiles.filter(t=>t.alive&&t.color===color).length;
  while(count>0){const amount=Math.min(BATCH,count);pool.push({color,count:amount});count-=amount}
 });
 for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
 pool.forEach((g,i)=>groups[i%groups.length].push(g));
}
function renderControls(){
 const root=$('colonies');root.innerHTML='';
 groups.forEach((column,colIndex)=>{
  const stack=document.createElement('div');stack.className='colony-column';
  column.forEach((group,index)=>{
   const v=C[group.color],b=document.createElement('button');b.className='colony';b.type='button';
   b.setAttribute('aria-label','عمود '+(colIndex+1)+'، مجموعة '+v[0]+' بها '+group.count+' نمل');
   b.innerHTML='<span class="cube-swatch" style="--cube:'+v[1]+';--cube-light:'+v[1]+';--cube-dark:'+v[2]+'"></span><strong class="count">'+group.count+'</strong>'+(index!==0?'<span class="lock-mark" aria-hidden="true">🔒</span>':'');
   b.disabled=index!==0;
   if(index!==0)b.classList.add('waiting');
   b.addEventListener('click',()=>{if(index===0)dispatch(group,b,colIndex)});
   stack.appendChild(b);
  });
  root.appendChild(stack);
 });
}
function ui(){const p=total?Math.floor(done/total*100):0;$('bar').style.width=p+'%';$('percent').textContent=p+'%';$('collected').textContent=done+' / '+total}
function round(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function ant(x,y,col,scale=1){
 c.save();c.translate(x,y);c.scale(scale,scale);c.fillStyle='#38251f';
 c.beginPath();c.arc(-5,0,4,0,7);c.arc(0,0,3,0,7);c.fill();
 c.fillStyle=col;c.beginPath();c.arc(7,-1,4,0,7);c.fill();
 c.strokeStyle='#38251f';c.lineWidth=1.5;
 for(let z=-1;z<=1;z++){c.beginPath();c.moveTo(-1,z);c.lineTo(-7,z*4-3);c.moveTo(2,z);c.lineTo(7,z*4+3);c.stroke()}
 c.restore();
}
function drawTile(t){
 const x=t.x*W+1,y=t.y*H+1,col=C[t.color],g=c.createLinearGradient(x,y,x+W,y+H);
 g.addColorStop(0,'#ffffff');g.addColorStop(.2,col[1]);g.addColorStop(1,col[2]);
 c.save();c.shadowColor='#24404a55';c.shadowBlur=2;c.shadowOffsetY=1;c.fillStyle=g;round(x,y,W-2,H-2,2);c.fill();
 c.shadowColor='transparent';c.strokeStyle='#ffffff55';c.lineWidth=.7;round(x+1,y+1,W-4,H-4,2);c.stroke();c.restore();
}
function sparkle(x,y){
 for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,v=18+Math.random()*38;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45+Math.random()*.25,max:.7,size:1.2+Math.random()*2})}
}
function drawSparks(dt){
 for(let i=sparks.length-1;i>=0;i--){
  const p=sparks[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=24*dt;
  if(p.life<=0){sparks.splice(i,1);continue}
  c.save();c.globalAlpha=Math.min(1,p.life/p.max)*.75;c.fillStyle='#fff6b0';c.shadowColor='#ffe18a';c.shadowBlur=7;
  c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill();c.restore();
 }
}
function draw(){
 c.clearRect(0,0,696,600);c.fillStyle='#fff1dc';c.fillRect(0,0,696,600);
 tiles.forEach(t=>{if(t.alive)drawTile(t)});
 ants.forEach(a=>{c.save();c.globalAlpha=.16;c.fillStyle=a.color;c.shadowColor=a.color;c.shadowBlur=12;c.beginPath();c.arc(a.x,a.y,9,0,Math.PI*2);c.fill();c.restore();ant(a.x,a.y,a.color,1)});
 if(paused){c.fillStyle='#201a29a8';c.fillRect(0,0,696,600);c.fillStyle='white';c.font='900 30px Cairo';c.textAlign='center';c.fillText(failed?'المرحلة مقفولة':'متوقف مؤقتًا',348,300)}
}
function dispatch(group,button,colIndex){
 if(paused||failed||busy||button.disabled)return;
 const color=group.color;
 const targets=tiles.filter(t=>t.alive&&t.color===color&&exposed(t)).slice(0,group.count);
 if(!targets.length){
  bad++;$('message').textContent='المجموعة دي مش مكشوفة من الأطراف. اختار لون تاني ('+bad+'/3).';
  if(bad>=3){failed=true;paused=true;$('win').classList.add('show');$('win').querySelector('h2').textContent='🔒 المرحلة اتقفلت';$('win').querySelector('p').textContent='٣ اختيارات غلط. أعد المرحلة وحاول تركز في الألوان المكشوفة.';$('next').textContent='إعادة المحاولة';$('next').onclick=build}
  draw();return;
 }
 busy=true;activeGroup=group;
 $('message').textContent='مجموعة '+group.count+' نمل بتجمع مكعبات اللون المختار...';
 const col=C[color][1],homeX=348,homeY=574;
 targets.forEach((t,i)=>ants.push({x:homeX+(i%5-2)*10,y:homeY,color:col,target:t,phase:0,tx:t.x*W+W/2,ty:t.y*H+H/2}));
 group.count-=targets.length;
 if(group.count===0)groups[colIndex].shift();
 renderControls();draw();
}
function tick(ts){
 const dt=Math.min(.04,(ts-last)/1000||0);last=ts;
 if(!paused)for(let i=ants.length-1;i>=0;i--){
  const a=ants[i],tx=a.phase===0?a.tx:348,ty=a.phase===0?a.ty:574,dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy),v=220*speed*dt;
  if(d<v+2){a.x=tx;a.y=ty;if(a.phase===0){sparkle(a.x,a.y);a.target.alive=false;done++;a.phase=1;ui()}else ants.splice(i,1)}
  else{a.x+=dx/d*v;a.y+=dy/d*v}
 }
 if(busy&&ants.length===0){busy=false;activeGroup=null;renderControls();if(done>=total){$('win').classList.add('show');$('message').textContent='عاش! خلصت الرسمة كلها.'}else $('message').textContent='النمل رجع بالمكعبات. اختار لون تاني.'}
 drawSparks(dt);draw();requestAnimationFrame(tick);
}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};
$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent=speed+'×'};
$('restart').onclick=build;
$('dispatch').onclick=()=>$('message').textContent='اختار مربع اللون اللي تحت عشان تبعت النمل.';
build();requestAnimationFrame(tick);
})();
</script></body></html>
