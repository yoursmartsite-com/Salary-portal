<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11172a"><title>مملكة النمل | لَمّة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#fff4df;--muted:#c5b9a8;--gold:#ffca72}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#ffca8b 0,#e99b68 38%,#a85f4b 100%);font-family:Cairo,Arial,sans-serif;color:var(--ink);padding:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer}.page{max-width:900px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 12px}.back,.tool{background:#573e3c;border:2px solid #ffdcaa;border-radius:14px;padding:9px 14px;box-shadow:0 4px 0 #7b493d;font-weight:900;text-decoration:none}.level{text-align:center;text-shadow:0 3px 0 #a75d3f}.level small{display:block;font-size:11px;color:#fff1d5}.level strong{font-size:clamp(23px,5vw,34px)}.tools{display:flex;gap:8px}.board-shell{position:relative;background:linear-gradient(145deg,#fff0d8,#dfb998);border:5px solid #f6d7b8;border-radius:34px;padding:clamp(12px,3vw,26px);box-shadow:0 12px 30px #6f352c55,inset 0 0 0 2px #dba985}.board-inner{position:relative;background:#fff8eb;border-radius:14px;padding:8px;box-shadow:inset 0 2px 8px #a77b5d55}.board{width:100%;display:block;aspect-ratio:1.16/1;touch-action:manipulation}.ground{height:104px;position:relative;display:flex;align-items:center;justify-content:space-around}.burrow{width:92px;height:34px;border-radius:50%;background:radial-gradient(ellipse,#1b100d 0 45%,#59372a 62%,#d9a276 70%);box-shadow:0 8px 10px #85523b66;position:relative}.burrow:after{content:"";position:absolute;width:42px;height:10px;border-radius:50%;background:#21130f;left:25px;top:10px}.home-label{font-size:11px;color:#70483a;font-weight:900}.progress{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 2px 8px;color:#fff8e9;font-weight:800}.bar{height:10px;background:#754a45;border:1px solid #f9c99c;border-radius:20px;overflow:hidden;flex:1}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe08d,#fff3c1);transition:width .3s}.hint{text-align:center;color:#fff1df;font-size:12px;margin:8px 0 12px}.colonies{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.colony{min-width:0;aspect-ratio:1;background:linear-gradient(145deg,#fff1df,#d6ad8b);border:3px solid #f9d7b3;border-radius:16px;padding:7px;box-shadow:0 5px 0 #985e4d;display:grid;place-items:center;transition:.15s}.cube-swatch{width:min(100%,48px);aspect-ratio:1;border-radius:9px;background:linear-gradient(145deg,var(--cube-light),var(--cube) 55%,var(--cube-dark));box-shadow:inset 3px 3px 5px #ffffff88,inset -4px -5px 7px #0003,0 3px 5px #52352b66;transform:rotate(-5deg);border:1px solid #ffffff88}.colony.active{transform:translateY(-4px) scale(1.04);border-color:#fff;box-shadow:0 8px 0 #985e4d,0 0 0 3px #fff8}.colony:disabled{opacity:.35;filter:grayscale(1)}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.action{padding:10px 16px;border-radius:12px;background:linear-gradient(145deg,#6041a0,#37265e);border:2px solid #c7a8ff;box-shadow:0 4px 0 #241a42;font-weight:900}.action.gold{background:linear-gradient(145deg,#ffce75,#c87937);border-color:#ffe8ae;color:#49291d;box-shadow:0 4px 0 #854c32}.message{text-align:center;min-height:26px;color:#fff4dc;font-weight:800}.win{display:none;text-align:center;padding:18px;border-radius:18px;background:#513b35;border:2px solid #ffdb9e;margin:12px 0}.win.show{display:block}.win h2{margin:0 0 5px}.win p{margin:0 0 12px;color:#f6ddc5}.ant{filter:drop-shadow(0 2px 1px #51342d66)}
@media(max-width:560px){body{padding:8px}.top{margin-bottom:10px}.board-shell{border-radius:24px;padding:10px}.ground{height:75px}.colonies{gap:5px}.colony{border-radius:12px;padding:7px 2px}.colony small{font-size:8px}.actions{margin:14px 0}.back,.tool{padding:7px 10px;font-size:11px}}
</style>
</head>
<body><main class="page">
<header class="top"><a class="back" href="../">← لَمّة</a><div class="level"><small>مملكة النمل · مرحلة</small><strong id="level">01</strong></div><div class="tools"><button class="tool" id="pause">Ⅱ</button><button class="tool" id="speed">1×</button></div></header>
<section class="board-shell"><div class="board-inner"><canvas id="board" class="board" width="696" height="600" aria-label="لوحة المربعات"></canvas></div><div class="ground"><div><div class="home-label">جحور المستعمرات</div></div><div class="burrow"></div><div class="home-label" id="collected">0 / 0</div></div></section>
<div class="progress"><span>تنظيف الرسمة</span><div class="bar"><i id="bar"></i></div><span id="percent">0%</span></div>
<p class="hint">اختار لون المستعمرة، والنمل هيلمّ المربعات المطابقة ويرجع بيها للجحر.</p>
<section class="colonies" id="colonies"></section>
<div class="actions"><button class="action gold" id="dispatch">🐜 ابعت النمل يجمع</button><button class="action" id="restart">↻ إعادة المرحلة</button></div>
<div class="message" id="message" aria-live="polite">اختار لون وابدأ جمع المربعات!</div>
<section class="win" id="win"><h2>🎉 الرسمة اتنضفت!</h2><p>كل المربعات رجعت للجحر. جاهز للمرحلة اللي بعدها؟</p><button class="action gold" id="next">المرحلة التالية ←</button></section>
</main>
<script>
(()=>{
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const colors=[{id:'cyan',name:'سماوي',hex:'#10c5dc',dark:'#087c9b',ant:'#08c5df'},{id:'orange',name:'برتقالي',hex:'#ff9d16',dark:'#c96b0c',ant:'#ff9d16'},{id:'green',name:'أخضر',hex:'#35c86d',dark:'#16884c',ant:'#39d77b'},{id:'pink',name:'وردي',hex:'#ef5575',dark:'#a92f58',ant:'#f45b83'},{id:'lime',name:'ليموني',hex:'#a7dc42',dark:'#638e27',ant:'#b8ed54'},{id:'white',name:'أبيض',hex:'#fff5df',dark:'#c8bda9',ant:'#fff0d8'}];
const COLS=24,ROWS=20,CW=29,CH=27,OX=0,OY=0;let cells=[],ants=[],level=1,paused=false,speed=1,selected='orange',done=0,total=0,last=0,raf=0,mistakes=0,failed=false;
function insideShape(x,y){let X=(x-11.5)/10.8,Y=(y-9.5)/8.8;switch((level-1)%5){case 0:return X*X+Y*Y<1.08;case 1:return Math.abs(X)<.92&&Math.abs(Y)<.88&&!(Math.abs(X)>.72&&Math.abs(Y)>.68);case 2:return (X*X/1.05+Y*Y/.72<1.05)||(Math.abs(X)<.18&&Y>.45&&Y<1.02);case 3:return (Math.abs(X)+Math.abs(Y)<1.18);default:return (Math.abs(X)<.9&&Math.abs(Y)<.8)||(Math.abs(X)<.35&&Y<-.72)}}\nfunction colorAt(x,y){let n=(x*17+y*31+level*13)%6;let palette=['cyan','orange','green','pink','lime','white'];if((x+y+level)%7===0)n=(n+2)%6;return palette[n]}
function assignLayers(){const map=new Map(cells.map(c=>[c.x+','+c.y,c]));const q=[];for(const c of cells){if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>!map.has((c.x+dx)+','+(c.y+dy)))){c.layer=0;q.push(c)}}for(let i=0;i<q.length;i++){const c=q[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=map.get((c.x+dx)+','+(c.y+dy));if(n&&n.layer>c.layer+1){n.layer=c.layer+1;q.push(n)}}}}\nfunction build(){cells=[];ants=[];done=0;mistakes=0;failed=false;$('next').onclick=()=>{level++;paused=false;build()};$('win').querySelector('h2').textContent='🎉 الرسمة اتنضفت!';$('win').querySelector('p').textContent='كل المربعات رجعت للجحر. جاهز للمرحلة اللي بعدها؟';$('next').textContent='المرحلة التالية ←';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(!insideShape(x,y))continue;let type=colorAt(x,y);cells.push({x,y,type,layer:999,alive:true,reserved:false,offset:Math.random()*.08})}assignLayers();total=cells.length;colors.forEach((c,i)=>{for(let j=0;j<3;j++)ants.push({color:c.id,x:COLS*CW*(.12+i*.15)+Math.random()*18,y:570+j*8,target:null,state:'idle',t:0,phase:Math.random()*6,homeX:COLS*CW*(.12+i*.15),homeY:ROWS*CH+30})});$('level').textContent=String(level).padStart(2,'0');$('win').classList.remove('show');$('message').textContent='اختار لون وابدأ جمع المربعات!';updateUI();draw()}
function outerLayer(){let left=cells.filter(c=>c.alive);return left.length?Math.min(...left.map(c=>c.layer)):Infinity}\nfunction updateUI(){$('bar').style.width=(done/total*100)+'%';$('percent').textContent=Math.floor(done/total*100)+'%';$('collected').textContent=done+' / '+total;document.querySelectorAll('.colony').forEach(b=>{b.classList.toggle('active',b.dataset.color===selected);b.disabled=failed})}
function drawCell(c){let x=c.x*CW,y=c.y*CH;ctx.save();ctx.translate(x,y);ctx.fillStyle='#56443f';round(-1,-1,CW-1,CH-1,4);ctx.fill();let col=colors.find(z=>z.id===c.type);let g=ctx.createLinearGradient(1,1,CW-3,CH-3);g.addColorStop(0,light(col.hex,22));g.addColorStop(.48,col.hex);g.addColorStop(1,col.dark);ctx.fillStyle=g;round(1,1,CW-4,CH-4,4);ctx.fill();ctx.fillStyle='#ffffff55';round(3,3,CW-9,4,2);ctx.fill();ctx.strokeStyle='#ffffff30';ctx.lineWidth=1;round(1.5,1.5,CW-4,CH-4,4);ctx.stroke();ctx.restore()}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function light(hex,p){let n=parseInt(hex.slice(1),16),r=Math.min(255,(n>>16)+Math.round(2.55*p)),g=Math.min(255,((n>>8)&255)+Math.round(2.55*p)),b=Math.min(255,(n&255)+Math.round(2.55*p));return 'rgb('+r+','+g+','+b+')'}
function drawAnt(a){ctx.save();ctx.translate(a.x,a.y+Math.sin(a.phase)*2);ctx.scale(.9,.9);ctx.strokeStyle='#332638';ctx.lineWidth=2;for(let i=0;i<3;i++){let yy=(i-1)*3;ctx.beginPath();ctx.moveTo(-3,yy);ctx.lineTo(-8,yy-5+Math.sin(a.phase+i)*2);ctx.lineTo(-10,yy+3);ctx.moveTo(2,yy);ctx.lineTo(7,yy-5+Math.cos(a.phase+i)*2);ctx.lineTo(9,yy+3);ctx.stroke()}ctx.strokeStyle='#332638';ctx.beginPath();ctx.moveTo(6,-2);ctx.quadraticCurveTo(12,-10,14,-5);ctx.moveTo(6,0);ctx.quadraticCurveTo(14,-7,17,-2);ctx.stroke();ctx.fillStyle='#332638';ctx.beginPath();ctx.ellipse(-5,0,5,4,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(1,0,4,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=a.color==='white'?'#e5c9a0':colors.find(c=>c.id===a.color).ant;ctx.beginPath();ctx.arc(8,-1,4.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff77';ctx.beginPath();ctx.arc(8,-2,2,3.4,5.7);ctx.stroke();if(a.state==='return'&&a.target){ctx.fillStyle=colors.find(c=>c.id===a.color).hex;ctx.fillRect(-2,-13,12,10);ctx.strokeStyle='#ffffff99';ctx.strokeRect(-2,-13,12,10)}ctx.restore()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);let bg=ctx.createLinearGradient(0,0,0,600);bg.addColorStop(0,'#e4f8f7');bg.addColorStop(1,'#b8e5e2');ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(0,12);cells.forEach(c=>{if(c.alive&&!c.reserved)drawCell(c)});ctx.restore();ants.forEach(drawAnt);if(paused){ctx.fillStyle='#201a29a8';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='white';ctx.font='900 34px Cairo';ctx.textAlign='center';ctx.fillText('متوقف مؤقتًا',canvas.width/2,canvas.height/2)}}
function nearest(color){let best=null,dist=Infinity,edge=outerLayer();for(const c of cells){if(!c.alive||c.reserved||c.type!==color||c.layer!==edge)continue;let d=Math.abs(c.x*CW+CW/2-COLS*CW*.5)+Math.abs(c.y*CH-ROWS*CH*.5);if(d<dist){best=c;dist=d}}return best}
function send(a){let c=nearest(a.color);if(!c)return false;c.reserved=true;a.target=c;a.state='out';a.t=0;return true}
function dispatch(){if(failed||paused)return;let waiting=ants.filter(a=>a.color===selected&&a.state==='idle');let count=0;for(const a of waiting)if(send(a))count++;if(count){$('message').textContent='ممتاز! النمل بيلمّ الطبقة الخارجية بس.';updateUI()}else{mistakes++;$('message').textContent='غلط! اللون ده مش موجود على الحافة الخارجية. المحاولات الخاطئة: '+mistakes+'/3';if(mistakes>=3){failed=true;paused=true;$('message').textContent='انتهت المرحلة! لازم تعيدها من الأول.';$('win').classList.add('show');$('win').querySelector('h2').textContent='🔒 المرحلة اتقفلت';$('win').querySelector('p').textContent='اختيارات غلط كتير. أعد المرحلة وحاول تخلّص الطبقة الخارجية الأول.';$('next').textContent='إعادة المحاولة';$('next').onclick=()=>{paused=false;$('pause').textContent='Ⅱ';$('next').onclick=()=>{level++;paused=false;build()};build()}}}}
function step(dt){if(paused)return;for(const a of ants){a.phase+=dt*9;if(a.state==='idle')continue;let tx,ty;if(a.state==='out'){tx=a.target.x*CW+CW/2;ty=a.target.y*CH+CH/2+12}else{tx=a.homeX;ty=a.homeY}let dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy),v=150*speed*dt;if(d<v+3){a.x=tx;a.y=ty;if(a.state==='out'){a.state='return';a.t=0}else{a.target.alive=false;a.target.reserved=false;a.state='idle';a.target=null;done++;updateUI();if(done>=total){paused=true;$('win').classList.add('show');$('win').querySelector('h2').textContent='🎉 الرسمة اتنضفت!';$('win').querySelector('p').textContent='كل المربعات رجعت للجحر. جاهز للمرحلة اللي بعدها؟';$('next').textContent='المرحلة التالية ←';$('next').onclick=()=>{level++;paused=false;build()};$('message').textContent='عاش! كل المربعات اتجمعت.'}}}else{a.x+=dx/d*v;a.y+=dy/d*v}}}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;step(dt);draw();raf=requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*canvas.width,y=(e.clientY-r.top)/r.height*canvas.height-12,cx=Math.floor(x/CW),cy=Math.floor(y/CH),cell=cells.find(c=>c.x===cx&&c.y===cy&&c.alive);if(cell){selected=cell.type;updateUI();dispatch()}});$('dispatch').onclick=dispatch;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';draw()};$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent=speed+'×'};$('restart').onclick=()=>{paused=false;$('pause').textContent='Ⅱ';build()};$('next').onclick=()=>{level++;paused=false;$('pause').textContent='Ⅱ';build()};
$('colonies').innerHTML=colors.map(c=>'<button class="colony" data-color="'+c.id+'" aria-label="اختيار مكعب '+c.name+'"><span class="cube-swatch" style="--cube:'+c.hex+';--cube-light:'+light(c.hex,28)+';--cube-dark:'+c.dark+'"></span></button>').join('');document.querySelectorAll('.colony').forEach(b=>b.onclick=()=>{selected=b.dataset.color;updateUI();dispatch()});
build();raf=requestAnimationFrame(loop);
})();
</script></body></html>
