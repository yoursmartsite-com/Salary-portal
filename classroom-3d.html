<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101a"><title>الفصل ثلاثي الأبعاد | لَمّة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#07101a;color:#f4f8ff;font-family:Cairo,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.top a{color:#d9edff;text-decoration:none;background:#152b40;padding:9px 13px;border-radius:10px;font-size:12px}.title{font-size:clamp(22px,4vw,34px);font-weight:900;margin:10px 0 4px}.sub{color:#9eb5c9;font-size:13px}.stage{height:min(68vh,620px);min-height:340px;background:radial-gradient(ellipse at 50% 30%,#1c4661,#091522 70%);border:1px solid #284b65;border-radius:18px;overflow:hidden;position:relative;margin-top:16px}canvas{display:block;width:100%;height:100%}#status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#d6eaff;pointer-events:none;font-size:14px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{border:1px solid #345a78;background:#15334c;color:white;padding:9px 13px;border-radius:9px;font:inherit;font-size:12px}.tip{color:#8da8bf;font-size:11px;margin-top:10px}@media(max-width:600px){.wrap{padding:11px}.stage{height:62vh;min-height:320px}}
</style></head><body><main class="wrap"><div class="top"><a href="/Salary-portal/kids-learning.html">← رجوع للتعليم</a><a href="/Salary-portal/">الرئيسية</a></div><div class="title">الفصل ثلاثي الأبعاد</div><div class="sub">استكشف شخصية لَمّة التعليمية واسحب لتحريك الكاميرا، واستخدم إصبعين للتقريب.</div><div class="stage" id="stage"><div id="status">جاري تجهيز الفصل والشخصية ثلاثية الأبعاد…</div></div><div class="controls"><button id="reset">إعادة ضبط الكاميرا</button><button id="spin">إيقاف الدوران</button></div><div class="tip">ملحوظة: أول تحميل للمجسم قد يستغرق بعض الوقت حسب سرعة الإنترنت.</div></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1a2b);
const camera=new THREE.PerspectiveCamera(42,stage.clientWidth/stage.clientHeight,.1,1000);camera.position.set(0,1.6,4.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9edff,0x26364b,2));const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(3,6,4);scene.add(key);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0x18334a,roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.minDistance=1.4;controls.maxDistance=9;controls.maxPolarAngle=Math.PI*.48;
let model=null,spinning=true;
function fit(obj){const box=new THREE.Box3().setFromObject(obj);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());obj.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;obj.scale.setScalar(2.3/max);obj.position.y+=1.05;controls.target.set(0,.95,0);camera.position.set(0,1.5,Math.max(3.4,max*2.1));controls.update()}
async function start(){try{const r=await fetch('/Salary-portal/assets/lamma3d/manifest.json',{cache:'no-store'});if(!r.ok)throw new Error('لسه ملفات الشخصية ثلاثية الأبعاد مش جاهزة على الموقع.');const manifest=await r.json();const files=manifest.models||[];if(!files.length)throw new Error('ملف ZIP موجود، لكن لم يتم العثور على ملف GLB أو GLTF داخله.');const file=files.find(x=>/\.glb$/i.test(x))||files[0];new GLTFLoader().load('/Salary-portal/assets/lamma3d/package/'+file, g=>{model=g.scene;scene.add(model);fit(model);status.remove()},undefined,e=>{console.error(e);status.textContent='تعذر تحميل المجسم. راجع ملفات النموذج داخل الحزمة.'})}catch(e){status.textContent=e.message;console.error(e)}}
document.getElementById('reset').onclick=()=>{camera.position.set(0,1.5,4.5);controls.target.set(0,1,0);controls.update()};
document.getElementById('spin').onclick=e=>{spinning=!spinning;e.currentTarget.textContent=spinning?'إيقاف الدوران':'تشغيل الدوران'};
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(stage);
function animate(){requestAnimationFrame(animate);if(model&&spinning)model.rotation.y+=.003;controls.update();renderer.render(scene,camera)}animate();start();
</script></body></html>
