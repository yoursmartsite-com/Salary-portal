ing:0;background:var(--bg)}.app{border:0;border-radius:0;min-height:100vh}.layout{display:block}aside{display:none}.content{padding:20px 14px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:120px}header{padding:14px 16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}.bottom a{font:700 11px Cairo;color:var(--muted);text-decoration:none;text-align:center}.bottom a.active{color:var(--dark)}.bottom b{display:block;font-size:19px}}@media(min-width:761px){.layout{min-height:790px}} </style><style id="ZR_SINGLE_PORTAL_GUARD">body{visibility:hidden}</style><style id="zr-colored-line-icons">.zr-icon-sprite{position:absolute;width:0;height:0;overflow:hidden}.zr-ico{width:19px;height:19px;display:inline-block;vertical-align:middle;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.icon .zr-ico{width:21px;height:21px}.ic-home{color:#d3a33b}.ic-heart{color:#d9799a}.ic-orders{color:#6c9fce}.ic-user{color:#9a83c9}.ic-bag{color:#4aa99b}.ic-search{color:#d3a33b}.ic-sparkle,.ic-star,.ic-perfume{color:#d3a33b}.ic-men{color:#6c9fce}.ic-women,.ic-heart{color:#d9799a}.ic-unisex{color:#6e9c82}.ic-bell{color:#d39a48}.ic-map{color:#6c9fce}.ic-logout{color:#c87968}.ic-plus,.ic-minus{color:#d3a33b}.nav button{display:flex;align-items:center;gap:9px}.tile b{display:flex;align-items:center;gap:8px}.side-link,.bottom a{display:flex;align-items:center;gap:10px}.side-link .zr-ico{width:19px;height:19px}.bottom a{flex-direction:column;gap:3px}.bottom a .zr-ico{width:22px;height:22px}.icon{display:grid;place-items:center}.fav{display:grid;place-items:center}.fav .zr-ico{width:19px;height:19px;color:#d9799a}.add{display:grid;place-items:center}.add .zr-ico{width:19px;height:19px;color:#e6c875}.cat{display:inline-flex;align-items:center;gap:7px}.cat .zr-ico{width:16px;height:16px;color:#c59b27}.search-row button{display:inline-flex;align-items:center;justify-content:center;gap:7px}.hero .deco{color:#d4af37}@media(max-width:760px){.bottom a{min-width:58px}.bottom a .zr-ico{width:21px;height:21px}}</style></head><body><svg class="zr-icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="zr-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol><symbol id="zr-heart" viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.7 4.7 0 0 1 12 6.1a4.7 4.7 0 0 1 8.8 2.6Z"/></symbol><symbol id="zr-orders" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H5V3z"/><path d="M14 3v5h5M8 12h8M8 16h8"/></symbol><symbol id="zr-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="zr-bag" viewBox="0 0 24 24"><path d="M4 8h16l-1 13H5L4 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></symbol><symbol id="zr-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol><symbol id="zr-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="zr-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="zr-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol><symbol id="zr-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></symbol><symbol id="zr-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol><symbol id="zr-sparkle" viewBox="0 0 24 24"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></symbol><symbol id="zr-men" viewBox="0 0 24 24"><circle cx="10" cy="14" r="6"/><path d="m14.5 9.5 6-6M15 3h6v6"/></symbol><symbol id="zr-women" viewBox="0 0 24 24"><path d="M12 3a6 6 0 1 0 0 12 6 6 0 0 0 0-12ZM12 15v7M8 19h8"/></symbol><symbol id="zr-unisex" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9h8M8 15h8M12 3v18"/></symbol><symbol id="zr-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></symbol><symbol id="zr-perfume" viewBox="0 0 24 24"><path d="M9 3h6v3H9zM10 6V3M14 6V3M8 8h8l2 3v9H6v-9z"/><path d="M9 13h6M9 16h6"/></symbol></svg><div class="app"><div class="topline"></div><header><div><div class="brand-title">زين ورهف</div><div class="brand-sub">ZEIN & RAHAF · PERFUMES</div></div><a class="icon" href="cart.html" aria-label="سلة التسوق"><svg class="zr-ico ic-bag" aria-hidden="true"><use href="#zr-bag"></use></svg></a></header><div class="layout"><aside><div class="side-title">القائمة الرئيسية</div><a class="side-link " href="index.html"><svg class="zr-ico ic-home" aria-hidden="true"><use href="#zr-home"></use></svg><span>الرئيسية</span></a><a class="side-link active" href="favorites.html"><svg class="zr-ico ic-heart" aria-hidden="true"><use href="#zr-heart"></use></svg><span>المفضلة</span></a><a class="side-link " href="orders.html"><svg class="zr-ico ic-orders" aria-hidden="true"><use href="#zr-orders"></use></svg><span>طلباتي</span></a><a class="side-link" href="account.html"><svg class="zr-ico ic-user" aria-hidden="true"><use href="#zr-user"></use></svg><span>حسابي</span></a><div class="side-note">زين ورهف<br>اختيارات استثنائية.. تليق بك.</div></aside><main class="content"><h1 class="page-title">المفضلة</h1><p class="page-sub">كل العطور اللي اخترتها وحفظتها.</p><div class="grid" id="items"></div></main></div><nav class="bottom"><a class="" href="index.html"><svg class="zr-ico ic-home" aria-hidden="true"><use href="#zr-home"></use></svg>الرئيسية</a><a class="active" href="favorites.html"><svg class="zr-ico ic-heart" aria-hidden="true"><use href="#zr-heart"></use></svg>المفضلة</a><a class="" href="orders.html"><svg class="zr-ico ic-orders" aria-hidden="true"><use href="#zr-orders"></use></svg>طلباتي</a><a href="account.html"><svg class="zr-ico ic-user" aria-hidden="true"><use href="#zr-user"></use></svg>حسابي</a></nav></div><script type="module">
import {auth,db,onAuthStateChanged,ref,get,set} from "./firebase.js";
const data=[{id:1,name:"عود ملكي",type:"رجالي",notes:"عود • عنبر • أخشاب",prices:[350,620,890],tag:"الأكثر مبيعًا",art:"dark"},{id:2,name:"روز جولد",type:"حريمي",notes:"ورد • فانيليا • مسك",prices:[320,580,840],tag:"نسائي",art:""},{id:3,name:"إمبير",type:"رجالي",notes:"برغموت • جلد • باتشولي",prices:[390,690,990],tag:"فاخر",art:"silver"},{id:4,name:"وايت مسك",type:"يونيسكس",notes:"مسك أبيض • زهور • قطن",prices:[280,510,750],tag:"ناعم",art:""},{id:5,name:"ليذر نايت",type:"رجالي",notes:"جلد • توابل • خشب الصندل",prices:[360,650,930],tag:"مميز",art:"dark"},{id:6,name:"بلوم",type:"حريمي",notes:"ياسمين • فواكه • فانيليا",prices:[300,550,800],tag:"جديد",art:"silver"}];
const money=n=>n.toLocaleString("ar-EG")+" ج.م",el=document.getElementById("items");let favorites=JSON.parse(localStorage.getItem("zr_fav")||"[]"),uid=null;
function render(){const list=data.filter(p=>favorites.includes(p.id));el.innerHTML=list.map(p=>'<article class="product"><button class="fav" data-remove="'+p.id+'">'+'<svg class="zr-ico ic-heart" aria-hidden="true"><use href="#zr-heart"></use></svg>'+'</button><div class="art"><div class="bottle '+p.art+'"></div></div><div class="kind">'+p.tag+'</div><div class="name">'+p.name+'</div><div class="notes">'+p.notes+'</div><div class="foot"><span>'+money(p.prices[0])+' / 30 مل</span><button class="add" data-add="'+p.id+'">'+'<svg class="zr-ico ic-bag" aria-hidden="true"><use href="#zr-bag"></use></svg>'+' أضف للسلة</button></div></article>').join("")||'<div class="empty" style="grid-column:1/-1">قائمة المفضلة فارغة حاليًا.<br><a href="index.html">ارجع للمتجر واختار عطرك</a></div>';}
async function save(){localStorage.setItem("zr_fav",JSON.stringify(favorites));if(uid)await set(ref(db,"favorites/"+uid),favorites);}
onAuthStateChanged(auth,async user=>{uid=user?.uid||null;if(!uid){el.innerHTML='<div class="empty" style="grid-column:1/-1">سجّل الدخول لعرض مفضلتك المحفوظة على حسابك.<br><a href="account.html">تسجيل الدخول</a></div>';return;}try{const s=await get(ref(db,"favorites/"+uid));favorites=s.exists()?s.val():favorites;await set(ref(db,"favorites/"+uid),favorites);localStorage.setItem("zr_fav",JSON.stringify(favorites));render();}catch(e){el.innerHTML='<div class="empty">تعذر تحميل المفضلة. راجع قواعد Firebase.</div>';console.error(e);}});
document.addEventListener("click",async e=>{const r=e.target.closest("[data-remove]");if(r){favorites=favorites.filter(x=>x!==+r.dataset.remove);await save();render();}const b=e.target.closest("[data-add]");if(b){const p=data.find(x=>x.id===+b.dataset.add);try{const s=await get(ref(db,"cart/"+uid)),c=s.exists()?s.val():[];const x=c.find(x=>x.id===p.id&&x.size===30);if(x)x.qty++;else c.push({id:p.id,name:p.name,size:30,price:p.prices[0],qty:1});await set(ref(db,"cart/"+uid),c);localStorage.setItem("zr_cart",JSON.stringify(c));b.textContent="اتضاف للسلة ✓";}catch(err){alert("تعذر حفظ السلة على حسابك.");}}});
</script><script src="./download-gate.js" defer></script><script type="module" src="./omnix-access-gate.js"></script></body></html>
