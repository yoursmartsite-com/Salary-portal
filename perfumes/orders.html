<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171614"><title>طلباتي | زين ورهف</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#faf7f2;--gold:#c59b27;--light:#e6c875;--dark:#9a7414;--ink:#171614;--muted:#7c756b;--line:#e8e0d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29241d,#141311 75%);font-family:Cairo,sans-serif;color:var(--ink);min-height:100vh;padding:22px}.app{max-width:1160px;margin:auto;background:var(--bg);border:1px solid #554b3b;border-radius:28px;overflow:hidden;min-height:calc(100vh - 44px);box-shadow:0 25px 70px #0008}.topline{height:7px;background:linear-gradient(90deg,#806019,#e6c875,#9a7414)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line)}.brand-title{font:700 34px Amiri,serif;line-height:1.1}.brand-sub{font-size:10px;letter-spacing:3px;color:var(--dark);font-weight:800}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:white;font-size:19px;display:grid;place-items:center;text-decoration:none;color:inherit}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 140px)}aside{padding:24px 18px;border-left:1px solid var(--line);background:#f5f0e7}.side-title{font-weight:800;margin:5px 8px 15px}.side-link{display:block;text-decoration:none;text-align:right;padding:12px;border-radius:12px;font:600 13px Cairo;color:#5e574d}.side-link.active,.side-link:hover{background:#171614;color:var(--light)}.side-note{margin-top:28px;padding:16px;background:#171614;color:#e6c875;border-radius:16px;font-size:12px;line-height:1.9}.content{padding:28px;min-width:0}.page-title{font:700 32px Amiri,serif;margin:5px 0}.page-sub{font-size:13px;color:var(--muted);margin:0 0 24px}.page-panel,.order-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.profile-mark{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#171614;color:var(--light);font-size:28px;margin:8px auto 12px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0 12px;font:13px Cairo;background:white}.primary{width:100%;border:0;background:#171614;color:var(--light);border-radius:13px;padding:13px;font:700 13px Cairo;cursor:pointer}.hint{font-size:11px;color:var(--muted);line-height:1.8}.empty{padding:45px 10px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{background:white;border:1px solid var(--line);border-radius:19px;padding:13px;position:relative;cursor:pointer}.art{height:145px;border-radius:15px;background:linear-gradient(#f2ece1,#e8decd);display:grid;place-items:center;margin-bottom:12px}.bottle{width:60px;height:91px;border:2px solid #a98232;border-radius:12px 12px 16px 16px;background:linear-gradient(90deg,#98702c,#f1d995,#9b702b);position:relative}.bottle:before{content:"";position:absolute;width:23px;height:15px;top:-16px;left:16px;background:#27231d;border-radius:4px 4px 0 0}.bottle:after{content:"ZEIN & RAHAF";position:absolute;top:38px;left:0;right:0;text-align:center;font-size:6px;color:#342817;font-weight:bold}.bottle.dark{background:linear-gradient(90deg,#111,#666,#171717)}.bottle.silver{background:linear-gradient(90deg,#888,#eee,#999)}.kind{font-size:10px;color:var(--dark);font-weight:800}.name{font-size:15px;font-weight:800;margin:3px 0}.notes{font-size:11px;color:var(--muted)}.foot{display:flex;justify-content:space-between;margin-top:12px;font-weight:800}.fav{position:absolute;top:12px;left:12px;border:0;background:#f2ece1;border-radius:50%;width:34px;height:34px;font-size:18px}.add{border:0;background:#171614;color:var(--light);border-radius:10px;padding:7px 12px}.bottom{display:none}.cartline{display:flex;justify-content:space-between;align-items:center;background:white;border:1px solid var(--line);padding:14px;border-radius:13px;margin:9px 0}.qty button{border:0;background:#f2ece1;border-radius:7px;padding:3px 10px}@media(max-width:760px){body{padding:0;background:var(--bg)}.app{border:0;border-radius:0;min-height:100vh}.layout{display:block}aside{display:none}.content{padding:20px 14px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:120px}header{padding:14px 16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}.bottom a{font:700 11px Cairo;color:var(--muted);text-decoration:none;text-align:center}.bottom a.active{color:var(--dark)}.bottom b{display:block;font-size:19px}}@media(min-width:761px){.layout{min-height:790px}} .status-panel{margin:18px 0 4px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#191713,#3a3020);color:#fff;box-shadow:0 10px 25px #1b160f18}.status-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.status-title{font-size:12px;color:#d9c99e}.status-current{font-size:18px;font-weight:800;color:#f0d58a}.status-track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;position:relative}.status-step{text-align:center;position:relative;z-index:1;font-size:10px;color:#bcb5a7}.status-dot{width:27px;height:27px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;border:2px solid #746b59;background:#29251e;color:#aaa;font-size:12px}.status-step.done .status-dot{background:linear-gradient(145deg,#f3dc9a,#b88b2c);border-color:#f3dc9a;color:#211b10;box-shadow:0 0 14px #e4c16b66}.status-step.active .status-dot{animation:statusPulse 1.7s infinite;background:#f4d98f;border-color:#fff;color:#211b10}.status-step.done,.status-step.active{color:#f2d995;font-weight:800}.status-cancelled{background:linear-gradient(135deg,#321b19,#6a2924)}.status-cancelled .status-current{color:#ffb6a9}.status-caption{font-size:11px;color:#d0c7b6;margin-top:12px}@keyframes statusPulse{0%,100%{box-shadow:0 0 0 0 #e6c87566}50%{box-shadow:0 0 0 7px #e6c87500}}@media(max-width:480px){.status-panel{padding:13px 9px}.status-step{font-size:9px}.status-dot{width:24px;height:24px}}</style></head><body><div class="app"><div class="topline"></div><header><div><div class="brand-title">زين ورهف</div><div class="brand-sub">ZEIN & RAHAF · PERFUMES</div></div><a class="icon" href="cart.html">🛍</a></header><div class="layout"><aside><div class="side-title">القائمة الرئيسية</div><a class="side-link" href="index.html">⌂　الرئيسية</a><a class="side-link " href="favorites.html">♡　المفضلة</a><a class="side-link active" href="orders.html">▤　طلباتي</a><a class="side-link " href="account.html">♙　حسابي</a><div class="side-note">زين ورهف<br>اختيارات استثنائية.. تليق بك.</div></aside><main class="content"><h1 class="page-title">طلباتي</h1><p class="page-sub">تابع مشترياتك وراجع تفاصيل طلباتك.</p><div id="items"></div></main></div><nav class="bottom"><a href="index.html"><b>⌂</b>الرئيسية</a><a class="" href="favorites.html"><b>♡</b>المفضلة</a><a class="active" href="orders.html"><b>▤</b>طلباتي</a><a class="" href="account.html"><b>♙</b>حسابي</a></nav></div><script type="module">
import {auth,db,onAuthStateChanged,ref,onValue} from "./firebase.js";
const el=document.getElementById("items"),money=n=>Number(n||0).toLocaleString("ar-EG")+" ج.م";
const safe=v=>String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stages=[["new","تم استلام الطلب"],["confirmed","تم التأكيد"],["preparing","جاري التجهيز"],["shipped","خرج للتوصيل"],["delivered","تم التسليم"]];
function statusView(status){
 if(status==="cancelled")return '<div class="status-panel status-cancelled"><div class="status-head"><span class="status-title">حالة الطلب الحالية</span><span class="status-current">تم إلغاء الطلب</span></div><div class="status-caption">لو محتاج مساعدة بخصوص الطلب، تواصل مع المتجر.</div></div>';
 const current=stages.findIndex(x=>x[0]===status),idx=current<0?0:current;
 return '<div class="status-panel"><div class="status-head"><span class="status-title">حالة الطلب الحالية</span><span class="status-current">'+stages[idx][1]+'</span></div><div class="status-track">'+stages.map((s,i)=>'<div class="status-step '+(i<idx?'done':i===idx?'active':'')+'"><div class="status-dot">'+(i<idx?'✓':i+1)+'</div>'+s[1]+'</div>').join("")+'</div><div class="status-caption">'+(idx===0?'استلمنا طلبك، وهنبدأ مراجعته قريبًا.':idx===1?'تم تأكيد طلبك، وبيتم تجهيزه.':idx===2?'طلبك بيتجهز حاليًا بعناية.':idx===3?'طلبك خرج للتوصيل وفي الطريق ليك.':'تم تسليم طلبك بنجاح، شكرًا لثقتك في زين ورهف.')+'</div></div>';
}
function render(orders){const list=Array.isArray(orders)?orders.map((o,i)=>[o.id||("طلب "+(i+1)),o]):Object.entries(orders||{}).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));el.innerHTML=list.length?list.map(([id,o])=>'<div class="order-card"><b>طلب رقم '+safe(id)+'</b><p>الاسم: '+safe(o.name)+'</p><p>رقم الهاتف: '+safe(o.phone)+'</p><p>العنوان: '+safe(o.address)+'</p><b>'+money(o.total)+'</b>'+statusView(o.status||"new")+'<div class="hint">'+(o.items||[]).map(x=>safe(x.name)+" · "+safe(x.size)+" مل × "+safe(x.qty)).join("، ")+'</div></div>').join(""):'<div class="empty">لسه مفيش طلبات مسجلة على الحساب.<br><a href="index.html">ابدأ التسوق</a></div>';}
onAuthStateChanged(auth,user=>{if(!user){el.innerHTML='<div class="empty">سجّل الدخول لمتابعة طلباتك.<br><a href="account.html">تسجيل الدخول</a></div>';return;}try{onValue(ref(db,"orders/"+user.uid),s=>render(s.exists()?s.val():{}),e=>{el.innerHTML='<div class="empty">تعذر تحميل الطلبات. راجع قواعد Firebase.</div>';console.error(e);});}catch(e){el.innerHTML='<div class="empty">تعذر متابعة الطلبات مباشرة.</div>';console.error(e);}});
</script><script src="./download-gate.js" defer></script></body></html>
