<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171614"><title>زين ورهف | ZEIN & RAHAF - متجر العطور الفاخرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--soft:#f2ece1;--ink:#171614;--gold:#c59b27;--light:#e6c875;--dark:#9a7414;--muted:#7c756b;--line:#e8e0d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29241d,#141311 75%);font-family:Cairo,sans-serif;color:var(--ink);min-height:100vh;padding:24px}.app{max-width:1120px;margin:auto;background:var(--bg);border:1px solid #554b3b;border-radius:28px;overflow:hidden;min-height:calc(100vh - 48px);box-shadow:0 25px 70px #0008}.topline{height:7px;background:linear-gradient(90deg,#806019,#e6c875,#9a7414)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);background:#faf7f2}.brand-title{font:700 34px Amiri,serif;line-height:1}.brand-sub{font-size:10px;letter-spacing:4px;color:var(--dark);font-weight:800}.actions{display:flex;gap:10px}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:white;font-size:19px;cursor:pointer;position:relative}.count{position:absolute;top:-6px;left:-5px;background:var(--gold);color:#171614;border-radius:20px;font-size:10px;padding:2px 6px;font-weight:800}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 150px)}aside{padding:24px 18px;border-left:1px solid var(--line);background:#f5f0e7}.side-title{font-weight:800;margin:5px 8px 15px}.side-link{display:block;width:100%;text-align:right;border:0;background:transparent;padding:12px;border-radius:12px;font:600 13px Cairo;cursor:pointer;color:#5e574d}.side-link.active,.side-link:hover{background:#171614;color:var(--light)}.side-note{margin-top:28px;padding:16px;background:#171614;color:#e6c875;border-radius:16px;font-size:12px;line-height:1.8}.content{padding:22px 26px 34px;min-width:0}.search-row{display:flex;gap:10px;margin-bottom:16px}.search-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:12px 15px;background:#fff;font:13px Cairo;outline:none}.search-row button,.primary{border:0;background:#171614;color:var(--light);border-radius:13px;padding:10px 18px;font:700 13px Cairo;cursor:pointer}.hero{background:linear-gradient(120deg,#171614,#393024);border:1px solid #8f702c;color:white;border-radius:22px;padding:26px 30px;position:relative;overflow:hidden;margin-bottom:20px}.hero small{display:inline-block;background:#c59b2730;color:var(--light);padding:5px 12px;border-radius:20px}.hero h1{font:700 32px Amiri,serif;margin:12px 0 4px}.hero p{font-size:13px;color:#d2c9ba;max-width:530px;line-height:1.9;margin:0 0 14px}.hero .deco{position:absolute;left:45px;bottom:-25px;font-size:115px;opacity:.18}.categories{display:flex;gap:8px;overflow:auto;padding:2px 0 16px}.cat{white-space:nowrap;padding:8px 16px;border:1px solid var(--line);background:white;border-radius:13px;font:600 12px Cairo;cursor:pointer}.cat.active{background:#171614;color:var(--light);border-color:#171614}.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.section-head h2{font-size:18px;margin:0}.section-head span{font-size:12px;color:var(--dark)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{background:white;border:1px solid var(--line);border-radius:19px;padding:13px;position:relative;cursor:pointer;transition:.2s}.product:hover{transform:translateY(-3px);box-shadow:0 12px 25px #17161412}.fav{position:absolute;top:12px;left:12px;border:0;background:var(--soft);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;z-index:1}.art{height:145px;border-radius:15px;background:linear-gradient(#f2ece1,#e8decd);display:grid;place-items:center;margin-bottom:12px}.bottle{width:60px;height:91px;border:2px solid #a98232;border-radius:12px 12px 16px 16px;background:linear-gradient(90deg,#98702c,#f1d995,#9b702b);position:relative;box-shadow:0 12px 17px #0002}.bottle:before{content:"";position:absolute;width:23px;height:15px;top:-16px;left:16px;background:#27231d;border-radius:4px 4px 0 0}.bottle:after{content:"ZEIN";position:absolute;top:38px;left:0;right:0;text-align:center;font-size:8px;color:#342817;font-weight:bold}.bottle.dark{background:linear-gradient(90deg,#111,#666,#171717);border-color:#777}.bottle.silver{background:linear-gradient(90deg,#888,#eee,#999);border-color:#aaa}.kind{font-size:10px;color:var(--dark);font-weight:800}.name{font-size:15px;font-weight:800;margin:3px 0}.notes{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-weight:800}.foot small{font-size:10px;color:var(--muted);font-weight:500}.add{border:0;background:#171614;color:var(--light);border-radius:10px;width:34px;height:34px;font-size:20px;cursor:pointer}.empty{padding:45px 10px;text-align:center;color:var(--muted);grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end;justify-content:center;padding:18px}.modal.show{display:flex}.sheet{background:var(--bg);border-radius:24px 24px 0 0;padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto}.close{float:left;border:0;background:var(--soft);border-radius:10px;padding:7px 12px;cursor:pointer}.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}.size{padding:12px 5px;border:1px solid var(--line);border-radius:12px;background:white;font:12px Cairo;cursor:pointer}.size.active{border:2px solid var(--gold);background:#fffdf7}.size strong{display:block}.size span{color:var(--dark)}.primary{width:100%;padding:13px;margin-top:8px}.cartline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid var(--line);padding:12px;border-radius:13px;margin:9px 0;font-size:13px}.qty button{border:0;background:var(--soft);border-radius:7px;padding:3px 9px;cursor:pointer}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0 12px;font:13px Cairo}.bottom{display:none}@media(max-width:760px){body{padding:0;background:var(--bg)}.app{border:0;border-radius:0;min-height:100vh}.layout{display:block;min-height:0}aside{display:none}.content{padding:15px 14px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:120px}.hero{padding:20px}.hero h1{font-size:27px}.hero .deco{left:8px;font-size:80px}header{padding:14px 16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:none;font:700 11px Cairo;color:var(--muted)}.bottom button.active{color:var(--dark)}.bottom b{display:block;font-size:19px}.modal{padding:0}.sheet{border-radius:23px 23px 0 0}}@media(min-width:761px){.app{min-height:850px}.layout{min-height:790px}}
</style>
</head>
<body>
<div class="app"><div class="topline"></div>
<header><div><div class="brand-title">زين ورهف</div><div class="brand-sub">LUXURY PERFUMES</div></div><div class="actions"><button class="icon" id="searchFocus" aria-label="بحث">⌕</button><button class="icon" id="cartOpen" aria-label="السلة">🛍<span class="count" id="count">0</span></button></div></header>
<div class="layout"><aside><div class="side-title">القائمة الرئيسية</div><button class="side-link active" data-page="home">⌂　الرئيسية</button><button class="side-link" data-page="favorites">♡　المفضلة</button><button class="side-link" data-page="orders">▤　طلباتي</button><button class="side-link" data-page="account">♙　حسابي</button><div class="side-note">زين ورهف<br>اختيارات استثنائية.. تليق بك.</div></aside>
<main class="content"><div class="search-row"><input id="search" placeholder="ابحث عن عطرك المفضل..."><button id="searchButton">بحث</button></div>
<section class="hero"><small>مجموعة مختارة بعناية</small><h1>عطرك.. بصمتك الخاصة</h1><p>اكتشف عالمًا من الروائح الفاخرة التي تعكس أناقتك وتترك أثرًا لا يُنسى. اختر عطرك المفضل بالحجم المناسب لك.</p><button class="primary" style="width:auto" id="discover">اكتشف المجموعة ←</button><div class="deco">♜</div></section>
<div class="categories" id="categories"><button class="cat active" data-cat="الكل">الكل</button><button class="cat" data-cat="رجالي">عطور رجالي</button><button class="cat" data-cat="حريمي">عطور حريمي</button><button class="cat" data-cat="يونيسكس">يونيسكس</button><button class="cat" data-cat="الأكثر مبيعًا">الأكثر مبيعًا</button></div>
<div class="section-head"><h2 id="heading">مختارات زين ورهف</h2><span>اكتشف عطرك</span></div><div class="grid" id="products"></div></main></div>
<nav class="bottom"><button class="active" data-page="home"><b>⌂</b>الرئيسية</button><button data-page="favorites"><b>♡</b>المفضلة</button><button data-page="orders"><b>▤</b>طلباتي</button><button data-page="account"><b>♙</b>حسابي</button></nav></div>
<div class="modal" id="modal"><section class="sheet" id="sheet"></section></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const data=[
{id:1,name:"عود ملكي",type:"رجالي",notes:"عود • عنبر • أخشاب",prices:[350,620,890],tag:"الأكثر مبيعًا",art:"dark"},
{id:2,name:"روز جولد",type:"حريمي",notes:"ورد • فانيليا • مسك",prices:[320,580,840],tag:"نسائي",art:""},
{id:3,name:"إمبير",type:"رجالي",notes:"برغموت • جلد • باتشولي",prices:[390,690,990],tag:"فاخر",art:"silver"},
{id:4,name:"وايت مسك",type:"يونيسكس",notes:"مسك أبيض • زهور • قطن",prices:[280,510,750],tag:"ناعم",art:""},
{id:5,name:"ليذر نايت",type:"رجالي",notes:"جلد • توابل • خشب الصندل",prices:[360,650,930],tag:"مميز",art:"dark"},
{id:6,name:"بلوم",type:"حريمي",notes:"ياسمين • فواكه • فانيليا",prices:[300,550,800],tag:"جديد",art:"silver"}];
let cat="الكل",page="home",cart=[],fav=[],current=null,size=0;
const money=n=>n.toLocaleString("ar-EG")+" ج.م";
function draw(){let q=$("search").value.trim();let list=data.filter(p=>(cat==="الكل"||p.type===cat||(cat==="الأكثر مبيعًا"&&p.tag===cat))&&p.name.includes(q));if(page==="favorites")list=data.filter(p=>fav.includes(p.id));$("products").innerHTML=list.map(p=>'<article class="product" data-open="'+p.id+'"><button class="fav" data-fav="'+p.id+'">'+(fav.includes(p.id)?"♥":"♡")+'</button><div class="art"><div class="bottle '+p.art+'"></div></div><div class="kind">'+p.tag+'</div><div class="name">'+p.name+'</div><div class="notes">'+p.notes+'</div><div class="foot"><span>'+money(p.prices[0])+' <small>/ 30 مل</small></span><button class="add" data-open="'+p.id+'">+</button></div></article>').join("")||'<div class="empty">لا توجد منتجات مطابقة.</div>';$("count").textContent=cart.reduce((n,x)=>n+x.qty,0);$("heading").textContent=page==="favorites"?"قائمة المفضلة":"مختارات زين ورهف"}
function open(html){$("sheet").innerHTML=html;$("modal").classList.add("show")}function close(){$("modal").classList.remove("show")}
function detail(id){current=data.find(p=>p.id===id);size=0;open('<button class="close" data-close>إغلاق ✕</button><div style="clear:both"></div><div class="art" style="margin-top:15px"><div class="bottle '+current.art+'"></div></div><div class="kind">'+current.tag+'</div><h2>'+current.name+'</h2><p style="color:#7c756b;font-size:13px">'+current.notes+'</p><h4>اختار الحجم المناسب</h4><div class="sizes">'+[30,50,100].map((v,i)=>'<button class="size '+(!i?"active":"")+'" data-size="'+i+'"><strong>'+v+' مل</strong><span>'+money(current.prices[i])+'</span></button>').join("")+'</div><button class="primary" id="add">أضف إلى السلة — '+money(current.prices[0])+'</button>')}
function cartView(){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);open('<button class="close" data-close>إغلاق ✕</button><div style="clear:both"></div><h2>سلة التسوق</h2>'+(cart.length?cart.map(x=>'<div class="cartline"><div><b>'+x.name+'</b><div style="color:#7c756b;font-size:11px">'+x.size+' مل · '+money(x.price)+'</div></div><div class="qty"><button data-qty="-1" data-id="'+x.id+'" data-size="'+x.size+'">−</button> '+x.qty+' <button data-qty="1" data-id="'+x.id+'" data-size="'+x.size+'">+</button></div></div>').join(""):'<div class="empty">سلتك فارغة حاليًا 🛍</div>')+'<div class="cartline"><b>الإجمالي</b><b>'+money(total)+'</b></div><button class="primary" id="checkout" '+(!cart.length?'disabled':'')+'>متابعة إتمام الطلب</button>')}
function pageChange(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));if(p==="orders")open('<button class="close" data-close>إغلاق ✕</button><div style="clear:both"></div><h2>طلباتي</h2><div class="empty">لا توجد طلبات مسجلة بعد.</div>');else if(p==="account")open('<button class="close" data-close>إغلاق ✕</button><div style="clear:both"></div><h2>حسابي</h2><p style="color:#7c756b;font-size:13px">سجل الدخول لمتابعة طلباتك وحفظ بياناتك.</p><input class="field" placeholder="رقم الموبايل أو البريد الإلكتروني"><input class="field" type="password" placeholder="كلمة المرور"><button class="primary" id="login">تسجيل الدخول</button>');else{close();draw()}}
document.addEventListener("click",e=>{let b=e.target.closest("button,[data-open]");if(!b)return;if(b.dataset.cat){cat=b.dataset.cat;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x===b));draw()}if(b.dataset.open)detail(+b.dataset.open);if(b.dataset.fav){let id=+b.dataset.fav;fav=fav.includes(id)?fav.filter(x=>x!==id):fav.concat(id);draw()}if(b.dataset.size!==undefined){size=+b.dataset.size;document.querySelectorAll(".size").forEach((x,i)=>x.classList.toggle("active",i===size));$("add").textContent="أضف إلى السلة — "+money(current.prices[size])}if(b.id==="add"){let ml=[30,50,100][size],old=cart.find(x=>x.id===current.id&&x.size===ml);if(old)old.qty++;else cart.push({id:current.id,name:current.name,size:ml,price:current.prices[size],qty:1});close();draw()}if(b.id==="cartOpen")cartView();if(b.dataset.close)close();if(b.dataset.qty){let x=cart.find(x=>x.id===+b.dataset.id&&x.size===+b.dataset.size);x.qty+=+b.dataset.qty;if(x.qty<=0)cart=cart.filter(y=>y!==x);cartView();draw()}if(b.id==="checkout")open('<button class="close" data-close>إغلاق ✕</button><div style="clear:both"></div><h2>بيانات التوصيل</h2><input class="field" placeholder="الاسم بالكامل"><input class="field" placeholder="رقم الموبايل"><input class="field" placeholder="العنوان بالتفصيل"><p style="font-size:11px;color:#7c756b">هذه واجهة تجريبية؛ لن يتم إرسال طلب فعلي قبل ربط المتجر بالخلفية.</p><button class="primary" id="confirm">تأكيد تجريبي</button>');if(b.id==="confirm"){cart=[];draw();open('<div class="empty"><h2>تمت التجربة بنجاح ✓</h2><p>لم يتم حفظ الطلب على خادم.</p><button class="primary" data-close>العودة للمتجر</button></div>')}if(b.dataset.page)pageChange(b.dataset.page);if(b.id==="discover")$("products").scrollIntoView({behavior:"smooth"});if(b.id==="searchFocus")$("search").focus();if(b.id==="searchButton")draw();if(b.id==="login")alert("تسجيل الدخول يحتاج ربط Firebase.");});
$("search").addEventListener("input",draw);$("modal").addEventListener("click",e=>{if(e.target===$("modal"))close()});draw();
})();
</script>
</body></html>
