ing:0;background:var(--bg)}.app{border:0;border-radius:0;min-height:100vh}.layout{display:block}aside{display:none}.content{padding:20px 14px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:120px}header{padding:14px 16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}.bottom a{font:700 11px Cairo;color:var(--muted);text-decoration:none;text-align:center}.bottom a.active{color:var(--dark)}.bottom b{display:block;font-size:19px}}@media(min-width:761px){.layout{min-height:790px}} </style><style id="ZR_SINGLE_PORTAL_GUARD">body{visibility:hidden}</style><style id="zr-colored-line-icons">.zr-icon-sprite{position:absolute;width:0;height:0;overflow:hidden}.zr-ico{width:19px;height:19px;display:inline-block;vertical-align:middle;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.icon .zr-ico{width:21px;height:21px}.ic-home{color:#d3a33b}.ic-heart{color:#d9799a}.ic-orders{color:#6c9fce}.ic-user{color:#9a83c9}.ic-bag{color:#4aa99b}.ic-search{color:#d3a33b}.ic-sparkle,.ic-star,.ic-perfume{color:#d3a33b}.ic-men{color:#6c9fce}.ic-women,.ic-heart{color:#d9799a}.ic-unisex{color:#6e9c82}.ic-bell{color:#d39a48}.ic-map{color:#6c9fce}.ic-logout{color:#c87968}.ic-plus,.ic-minus{color:#d3a33b}.nav button{display:flex;align-items:center;gap:9px}.tile b{display:flex;align-items:center;gap:8px}.side-link,.bottom a{display:flex;align-items:center;gap:10px}.side-link .zr-ico{width:19px;height:19px}.bottom a{flex-direction:column;gap:3px}.bottom a .zr-ico{width:22px;height:22px}.icon{display:grid;place-items:center}.fav{display:grid;place-items:center}.fav .zr-ico{width:19px;height:19px;color:#d9799a}.add{display:grid;place-items:center}.add .zr-ico{width:19px;height:19px;color:#e6c875}.cat{display:inline-flex;align-items:center;gap:7px}.cat .zr-ico{width:16px;height:16px;color:#c59b27}.search-row button{display:inline-flex;align-items:center;justify-content:center;gap:7px}.hero .deco{color:#d4af37}@media(max-width:760px){.bottom a{min-width:58px}.bottom a .zr-ico{width:21px;height:21px}}</style></head><body><svg class="zr-icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="zr-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol><symbol id="zr-heart" viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.7 4.7 0 0 1 12 6.1a4.7 4.7 0 0 1 8.8 2.6Z"/></symbol><symbol id="zr-orders" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H5V3z"/><path d="M14 3v5h5M8 12h8M8 16h8"/></symbol><symbol id="zr-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol><symbol id="zr-bag" viewBox="0 0 24 24"><path d="M4 8h16l-1 13H5L4 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></symbol><symbol id="zr-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol><symbol id="zr-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="zr-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="zr-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol><symbol id="zr-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/></symbol><symbol id="zr-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol><symbol id="zr-sparkle" viewBox="0 0 24 24"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></symbol><symbol id="zr-men" viewBox="0 0 24 24"><circle cx="10" cy="14" r="6"/><path d="m14.5 9.5 6-6M15 3h6v6"/></symbol><symbol id="zr-women" viewBox="0 0 24 24"><path d="M12 3a6 6 0 1 0 0 12 6 6 0 0 0 0-12ZM12 15v7M8 19h8"/></symbol><symbol id="zr-unisex" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9h8M8 15h8M12 3v18"/></symbol><symbol id="zr-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></symbol><symbol id="zr-perfume" viewBox="0 0 24 24"><path d="M9 3h6v3H9zM10 6V3M14 6V3M8 8h8l2 3v9H6v-9z"/><path d="M9 13h6M9 16h6"/></symbol></svg><div class="app"><div class="topline"></div><header><div><div class="brand-title">زين ورهف</div><div class="brand-sub">ZEIN & RAHAF · PERFUMES</div></div><a class="icon" href="cart.html" aria-label="سلة التسوق"><svg class="zr-ico ic-bag" aria-hidden="true"><use href="#zr-bag"></use></svg></a></header><div class="layout"><aside><div class="side-title">القائمة الرئيسية</div><a class="side-link " href="index.html"><svg class="zr-ico ic-home" aria-hidden="true"><use href="#zr-home"></use></svg><span>الرئيسية</span></a><a class="side-link " href="favorites.html"><svg class="zr-ico ic-heart" aria-hidden="true"><use href="#zr-heart"></use></svg><span>المفضلة</span></a><a class="side-link " href="orders.html"><svg class="zr-ico ic-orders" aria-hidden="true"><use href="#zr-orders"></use></svg><span>طلباتي</span></a><a class="side-link" href="account.html"><svg class="zr-ico ic-user" aria-hidden="true"><use href="#zr-user"></use></svg><span>حسابي</span></a><div class="side-note">زين ورهف<br>اختيارات استثنائية.. تليق بك.</div></aside><main class="content"><h1 class="page-title">سلة التسوق</h1><p class="page-sub">راجع العطور والأحجام قبل إتمام الطلب.</p><div id="items"></div><div class="page-panel" id="total"></div><h2>بيانات التوصيل</h2><input class="field" id="customerName" placeholder="الاسم بالكامل"><input class="field" id="customerPhone" placeholder="رقم الموبايل"><textarea class="field" id="customerAddress" rows="3" placeholder="العنوان بالتفصيل"></textarea><button class="primary" id="confirm">تأكيد الطلب – الدفع عند الاستلام</button><p class="hint">طريقة الدفع: الدفع عند الاستلام فقط. لن يتم خصم أي مبلغ إلكترونيًا.</p></main></div><nav class="bottom"><a class="" href="index.html"><svg class="zr-ico ic-home" aria-hidden="true"><use href="#zr-home"></use></svg>الرئيسية</a><a class="" href="favorites.html"><svg class="zr-ico ic-heart" aria-hidden="true"><use href="#zr-heart"></use></svg>المفضلة</a><a class="" href="orders.html"><svg class="zr-ico ic-orders" aria-hidden="true"><use href="#zr-orders"></use></svg>طلباتي</a><a href="account.html"><svg class="zr-ico ic-user" aria-hidden="true"><use href="#zr-user"></use></svg>حسابي</a></nav></div><script type="module">
import {auth,db,onAuthStateChanged,ref,get,set,push,update} from "./firebase.js";
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString("ar-EG")+" ج.م";
let items=JSON.parse(localStorage.getItem("zr_cart")||"[]"),uid=null,ready=false;
async function userToken(){return await auth.currentUser.getIdToken(true);}
function render(){const total=items.reduce((s,x)=>s+(Number(x.price)||0)*(Number(x.qty)||0),0);$("items").innerHTML=items.length?items.map(x=>'<div class="cartline"><div><b>'+x.name+'</b><div class="hint">'+x.size+' مل · '+money(x.price)+'</div></div><div class="qty"><button data-change="-1" data-id="'+x.id+'" data-size="'+x.size+'">+ '<svg class="zr-ico ic-minus" aria-hidden="true"><use href="#zr-minus"></use></svg>' + </button> '+x.qty+' <button data-change="1" data-id="'+x.id+'" data-size="'+x.size+'">+ '<svg class="zr-ico ic-plus" aria-hidden="true"><use href="#zr-plus"></use></svg>' + </button></div></div>').join(""):'<div class="empty">السلة فارغة حاليًا.<br><a href="index.html">تسوق العطور</a></div>';$("total").innerHTML='<b>الإجمالي: '+money(total)+'</b>';}
async function saveCart(){localStorage.setItem("zr_cart",JSON.stringify(items));if(uid&&ready)await set(ref(db,"cart/"+uid),items);}
onAuthStateChanged(auth,async user=>{uid=user?.uid||null;if(!user){$("items").innerHTML='<div class="empty">سجّل الدخول أولًا لعرض سلتك المحفوظة على حسابك.<br><a href="account.html">تسجيل الدخول</a></div>';ready=false;return;}try{const snap=await get(ref(db,"cart/"+uid));items=snap.exists()?snap.val():items;await set(ref(db,"cart/"+uid),items);localStorage.setItem("zr_cart",JSON.stringify(items));const profileSnap=await get(ref(db,"users/"+uid));const profile=profileSnap.exists()?profileSnap.val():{};$("customerName").value=profile.name||user.displayName||"";$("customerPhone").value=profile.phone||"";$("customerAddress").value=profile.address||"";ready=true;render();}catch(e){$("items").innerHTML='<div class="empty">تعذر تحميل السلة من Firebase. راجع قواعد قاعدة البيانات.</div>';console.error(e);}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-change]");if(b){const x=items.find(x=>x.id===+b.dataset.id&&x.size===+b.dataset.size);if(x){x.qty+=+b.dataset.change;if(x.qty<=0)items=items.filter(y=>y!==x);}await saveCart();render();return;}if(e.target.id==="confirm"){if(!uid){alert("سجّل الدخول أولًا لإتمام الطلب.");location.href="account.html";return;}const n=$("customerName").value.trim(),ph=$("customerPhone").value.trim(),ad=$("customerAddress").value.trim();if(!items.length||!n||!ph||!ad){alert("أكمل بياناتك وتأكد أن السلة بها منتجات");return;}const total=items.reduce((s,x)=>s+x.price*x.qty,0);const order={name:n,phone:ph,address:ad,items:items.map(x=>({...x})),total,status:"new",paymentMethod:"الدفع عند الاستلام",createdAt:Date.now()};try{await update(ref(db,"users/"+uid),{name:n,phone:ph,address:ad});const orderRef=push(ref(db,"orders/"+uid));const id="ORD-"+Date.now();await set(orderRef,{...order,id});try{const token=await userToken();const response=await fetch("https://omnix-api.fibrahem865.workers.dev/api/push/order",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({orderId:id,customerName:n,total})});if(!response.ok)console.warn("Admin push notification was not sent",await response.text());}catch(pushError){console.warn("Admin push notification:",pushError);}items=[];await saveCart();alert("تم إرسال طلبك وحفظه على حسابك بنجاح. حالة الطلب: طلب جديد – الدفع عند الاستلام.");location.href="orders.html";}catch(err){console.error(err);alert("تعذر إرسال الطلب. تأكد من نشر قواعد Firebase الخاصة بالطلبات والسلة.");}}});
render();
</script><script src="./download-gate.js" defer></script><script type="module" src="./omnix-access-gate.js"></script></body></html>
