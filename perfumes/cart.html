<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171614"><title>سلة التسوق | زين ورهف</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#faf7f2;--gold:#c59b27;--light:#e6c875;--dark:#9a7414;--ink:#171614;--muted:#7c756b;--line:#e8e0d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29241d,#141311 75%);font-family:Cairo,sans-serif;color:var(--ink);min-height:100vh;padding:22px}.app{max-width:1160px;margin:auto;background:var(--bg);border:1px solid #554b3b;border-radius:28px;overflow:hidden;min-height:calc(100vh - 44px);box-shadow:0 25px 70px #0008}.topline{height:7px;background:linear-gradient(90deg,#806019,#e6c875,#9a7414)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line)}.brand-title{font:700 34px Amiri,serif;line-height:1.1}.brand-sub{font-size:10px;letter-spacing:3px;color:var(--dark);font-weight:800}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:white;font-size:19px;display:grid;place-items:center;text-decoration:none;color:inherit}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 140px)}aside{padding:24px 18px;border-left:1px solid var(--line);background:#f5f0e7}.side-title{font-weight:800;margin:5px 8px 15px}.side-link{display:block;text-decoration:none;text-align:right;padding:12px;border-radius:12px;font:600 13px Cairo;color:#5e574d}.side-link.active,.side-link:hover{background:#171614;color:var(--light)}.side-note{margin-top:28px;padding:16px;background:#171614;color:#e6c875;border-radius:16px;font-size:12px;line-height:1.9}.content{padding:28px;min-width:0}.page-title{font:700 32px Amiri,serif;margin:5px 0}.page-sub{font-size:13px;color:var(--muted);margin:0 0 24px}.page-panel,.order-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.profile-mark{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#171614;color:var(--light);font-size:28px;margin:8px auto 12px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0 12px;font:13px Cairo;background:white}.primary{width:100%;border:0;background:#171614;color:var(--light);border-radius:13px;padding:13px;font:700 13px Cairo;cursor:pointer}.hint{font-size:11px;color:var(--muted);line-height:1.8}.empty{padding:45px 10px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product{background:white;border:1px solid var(--line);border-radius:19px;padding:13px;position:relative;cursor:pointer}.art{height:145px;border-radius:15px;background:linear-gradient(#f2ece1,#e8decd);display:grid;place-items:center;margin-bottom:12px}.bottle{width:60px;height:91px;border:2px solid #a98232;border-radius:12px 12px 16px 16px;background:linear-gradient(90deg,#98702c,#f1d995,#9b702b);position:relative}.bottle:before{content:"";position:absolute;width:23px;height:15px;top:-16px;left:16px;background:#27231d;border-radius:4px 4px 0 0}.bottle:after{content:"ZEIN & RAHAF";position:absolute;top:38px;left:0;right:0;text-align:center;font-size:6px;color:#342817;font-weight:bold}.bottle.dark{background:linear-gradient(90deg,#111,#666,#171717)}.bottle.silver{background:linear-gradient(90deg,#888,#eee,#999)}.kind{font-size:10px;color:var(--dark);font-weight:800}.name{font-size:15px;font-weight:800;margin:3px 0}.notes{font-size:11px;color:var(--muted)}.foot{display:flex;justify-content:space-between;margin-top:12px;font-weight:800}.fav{position:absolute;top:12px;left:12px;border:0;background:#f2ece1;border-radius:50%;width:34px;height:34px;font-size:18px}.add{border:0;background:#171614;color:var(--light);border-radius:10px;padding:7px 12px}.bottom{display:none}.cartline{display:flex;justify-content:space-between;align-items:center;background:white;border:1px solid var(--line);padding:14px;border-radius:13px;margin:9px 0}.qty button{border:0;background:#f2ece1;border-radius:7px;padding:3px 10px}@media(max-width:760px){body{padding:0;background:var(--bg)}.app{border:0;border-radius:0;min-height:100vh}.layout{display:block}aside{display:none}.content{padding:20px 14px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:120px}header{padding:14px 16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}.bottom a{font:700 11px Cairo;color:var(--muted);text-decoration:none;text-align:center}.bottom a.active{color:var(--dark)}.bottom b{display:block;font-size:19px}}@media(min-width:761px){.layout{min-height:790px}} </style></head><body><div class="app"><div class="topline"></div><header><div><div class="brand-title">زين ورهف</div><div class="brand-sub">ZEIN & RAHAF · PERFUMES</div></div><a class="icon" href="cart.html">🛍</a></header><div class="layout"><aside><div class="side-title">القائمة الرئيسية</div><a class="side-link" href="index.html">⌂　الرئيسية</a><a class="side-link " href="favorites.html">♡　المفضلة</a><a class="side-link " href="orders.html">▤　طلباتي</a><a class="side-link " href="account.html">♙　حسابي</a><div class="side-note">زين ورهف<br>اختيارات استثنائية.. تليق بك.</div></aside><main class="content"><h1 class="page-title">سلة التسوق</h1><p class="page-sub">راجع العطور والأحجام قبل إتمام الطلب.</p><div id="items"></div><div class="page-panel" id="total"></div><h2>بيانات التوصيل</h2><input class="field" id="customerName" placeholder="الاسم بالكامل"><input class="field" id="customerPhone" placeholder="رقم الموبايل"><textarea class="field" id="customerAddress" rows="3" placeholder="العنوان بالتفصيل"></textarea><button class="primary" id="confirm">تأكيد الطلب التجريبي</button><p class="hint">تأكيد الطلب تجريبي حاليًا، ولا يُرسل إلى المتجر قبل ربط Firebase.</p></main></div><nav class="bottom"><a href="index.html"><b>⌂</b>الرئيسية</a><a class="" href="favorites.html"><b>♡</b>المفضلة</a><a class="" href="orders.html"><b>▤</b>طلباتي</a><a class="" href="account.html"><b>♙</b>حسابي</a></nav></div><script type="module">
import {auth,db,onAuthStateChanged,ref,get,set} from "./firebase.js";
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString("ar-EG")+" ج.م";
let items=JSON.parse(localStorage.getItem("zr_cart")||"[]"),uid=null,ready=false;
function render(){const total=items.reduce((s,x)=>s+(Number(x.price)||0)*(Number(x.qty)||0),0);$("items").innerHTML=items.length?items.map(x=>'<div class="cartline"><div><b>'+x.name+'</b><div class="hint">'+x.size+' مل · '+money(x.price)+'</div></div><div class="qty"><button data-change="-1" data-id="'+x.id+'" data-size="'+x.size+'">−</button> '+x.qty+' <button data-change="1" data-id="'+x.id+'" data-size="'+x.size+'">+</button></div></div>').join(""):'<div class="empty">السلة فارغة حاليًا.<br><a href="index.html">تسوق العطور</a></div>';$("total").innerHTML='<b>الإجمالي: '+money(total)+'</b>';}
async function saveCart(){localStorage.setItem("zr_cart",JSON.stringify(items));if(uid&&ready)await set(ref(db,"cart/"+uid),items);}
onAuthStateChanged(auth,async user=>{uid=user?.uid||null;if(!user){$("items").innerHTML='<div class="empty">سجّل الدخول أولًا لعرض سلتك المحفوظة على حسابك.<br><a href="account.html">تسجيل الدخول</a></div>';ready=false;return;}try{const snap=await get(ref(db,"cart/"+uid));items=snap.exists()?snap.val():items;await set(ref(db,"cart/"+uid),items);localStorage.setItem("zr_cart",JSON.stringify(items));ready=true;render();}catch(e){$("items").innerHTML='<div class="empty">تعذر تحميل السلة من Firebase. راجع قواعد قاعدة البيانات.</div>';console.error(e);}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-change]");if(b){const x=items.find(x=>x.id===+b.dataset.id&&x.size===+b.dataset.size);if(x){x.qty+=+b.dataset.change;if(x.qty<=0)items=items.filter(y=>y!==x);}await saveCart();render();return;}if(e.target.id==="confirm"){if(!uid){alert("سجّل الدخول أولًا لإتمام الطلب.");location.href="account.html";return;}const n=$("customerName").value.trim(),ph=$("customerPhone").value.trim(),ad=$("customerAddress").value.trim();if(!items.length||!n||!ph||!ad){alert("أكمل بياناتك وتأكد أن السلة بها منتجات");return;}const total=items.reduce((s,x)=>s+x.price*x.qty,0);const order={name:n,phone:ph,address:ad,items:items.map(x=>({...x})),total,status:"pending",createdAt:Date.now()};try{const id="ORD-"+Date.now();const orderSnap=await get(ref(db,"orders/"+uid));const allOrders=orderSnap.exists()?orderSnap.val():[];const orderList=Array.isArray(allOrders)?allOrders:Object.entries(allOrders||{}).map(([key,value])=>({...value,id:key}));orderList.unshift({...order,id});await set(ref(db,"orders/"+uid),orderList);items=[];await saveCart();alert("تم إرسال طلبك وحفظه على حسابك بنجاح. حالة الطلب: قيد المراجعة.");location.href="orders.html";}catch(err){console.error(err);alert("تعذر إرسال الطلب إلى Firebase. تأكد من نشر قواعد السلة والطلبات.");}}});
render();
</script></body></html>
