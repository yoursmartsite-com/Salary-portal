<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171614"><title>لوحة تحكم زين ورهف</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#faf7f2;--gold:#c59b27;--light:#e6c875;--ink:#171614;--muted:#7c756b;--line:#e8e0d4}*{box-sizing:border-box}body{margin:0;background:#171614;font-family:Cairo,sans-serif;color:var(--ink);padding:20px}.app{max-width:1200px;margin:auto;background:var(--bg);min-height:calc(100vh - 40px);border-radius:22px;overflow:hidden}.top{height:7px;background:linear-gradient(90deg,#806019,#e6c875,#9a7414)}header{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid var(--line)}h1{font:700 30px Amiri;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.btn,select{font:700 12px Cairo;border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:#fff;cursor:pointer}.btn.dark{background:#171614;color:var(--light)}main{padding:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.order{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:26px;color:#9a7414}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.orders{display:grid;gap:12px}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#f2ece1;border-radius:20px;padding:5px 10px;font-size:11px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0;font-size:13px}.items{background:#faf7f2;padding:10px;border-radius:10px;font-size:12px;line-height:2}.actions{display:flex;gap:8px;align-items:center;margin-top:12px}.notice{background:#171614;color:#e6c875;padding:12px 15px;border-radius:12px;margin:12px 0;display:none}.empty{text-align:center;padding:40px;background:#fff;border-radius:15px;color:var(--muted)}#loginBox{max-width:460px;margin:45px auto;padding:24px;background:#fff;border-radius:18px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;font:13px Cairo}@media(max-width:650px){body{padding:0}.app{border-radius:0}.stats{grid-template-columns:repeat(2,1fr)}main{padding:14px}.details{grid-template-columns:1fr}header{padding:15px}.actions{flex-wrap:wrap}}.product-admin{display:grid;grid-template-columns:76px minmax(0,1fr);gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.product-preview{height:88px;border-radius:12px;background:linear-gradient(#f2ece1,#e8decd);display:grid;place-items:center}.product-photo{width:100%;height:100%;object-fit:cover;border-radius:12px}.product-bottle{width:35px;height:57px;border:2px solid #a98232;border-radius:8px 8px 11px 11px;background:linear-gradient(90deg,#98702c,#f1d995,#9b702c);position:relative;box-shadow:0 8px 12px #0002}.product-bottle:before{content:"";position:absolute;width:15px;height:10px;top:-11px;left:8px;background:#27231d;border-radius:3px 3px 0 0}.product-bottle.dark{background:linear-gradient(90deg,#111,#666,#171717);border-color:#777}.product-bottle.silver{background:linear-gradient(90deg,#888,#eee,#999);border-color:#aaa}.product-info{min-width:0}.product-info b{font-size:14px}.product-meta{font-size:11px;color:var(--muted);line-height:1.9;margin-top:3px}.product-prices{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.product-prices span{background:#f5f0e7;border-radius:7px;padding:3px 7px;font-size:10px}.product-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}@media(max-width:520px){.product-admin{grid-template-columns:62px minmax(0,1fr);padding:10px}.product-preview{height:76px}}</style></head><body><div class="app"><div class="top"></div><header><div><h1>زين ورهف | لوحة التحكم</h1><div class="sub">إدارة الطلبات · الدفع عند الاستلام</div></div><div><button class="btn" id="notify">🔔 تفعيل تنبيهات الطلبات</button> <button class="btn dark" id="logout" hidden>خروج</button></div></header><main><div id="loginBox"><h2>دخول الإدارة</h2><p class="muted">سجّل الدخول بحساب الإدارة المعتمد.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn dark" id="login">تسجيل الدخول</button><p id="message" class="muted"></p></div><section id="dashboard" hidden><div class="notice" id="notice"></div><div class="stats"><div class="stat">كل الطلبات<b id="total">0</b></div><div class="stat">طلبات جديدة<b id="fresh">0</b></div><div class="stat">قيد التجهيز<b id="prep">0</b></div><div class="stat">تم التسليم<b id="done">0</b></div></div><div class="toolbar"><select id="filter"><option value="all">كل الحالات</option><option value="new">طلبات جديدة</option><option value="confirmed">تم التأكيد</option><option value="preparing">جاري التجهيز</option><option value="shipped">تم الشحن</option><option value="cancelled">ملغي</option></select><button class="btn" id="refresh">تحديث</button><span class="muted" id="connection">بانتظار الاتصال…</span></div><div class="orders" id="orders"><div class="empty">جاري تحميل الطلبات…</div></div>
<div class="order" style="margin-top:22px"><h2>إدارة المنتجات والأسعار</h2><input id="productId" type="hidden"><input id="productName" placeholder="اسم العطر"><select id="productType"><option>رجالي</option><option>حريمي</option><option>يونيسكس</option></select><input id="productNotes" placeholder="وصف ومكونات العطر"><div class="details"><input id="price16" type="number" min="0" placeholder="سعر 16 مل"><input id="price22" type="number" min="0" placeholder="سعر 22 مل"><input id="price30" type="number" min="0" placeholder="سعر 30 مل"><input id="price50" type="number" min="0" placeholder="سعر 50 مل"><input id="price100" type="number" min="0" placeholder="سعر 100 مل"></div><input id="productTag" placeholder="شارة المنتج مثل الأكثر مبيعًا"><label for="productImage" style="display:block;font-weight:700;font-size:13px;margin-top:12px">صورة المنتج</label><input id="productImage" type="file" accept="image/*"><div class="muted">اختار صورة من الموبايل، بحد أقصى 5 ميجابايت.</div><img id="productImagePreview" alt="معاينة صورة المنتج" hidden style="width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin:8px 0"><select id="productArt"><option value="">ذهبي</option><option value="dark">داكن</option><option value="silver">فضي</option></select><div class="actions"><button class="btn dark" id="saveProduct">حفظ المنتج</button><button class="btn" id="clearProduct">منتج جديد</button></div><div id="productMessage" class="muted"></div><div id="productList" class="orders" style="margin-top:12px">جاري تحميل المنتجات…</div></div></section></main></div>
<script type="module">import {auth,db,signInWithEmailAndPassword,signOut,onAuthStateChanged,ref,onValue,set,get,push,getIdTokenResult} from "./firebase.js";
import {registerStorePush} from "./push-notifications.js";
const CLOUDINARY_CLOUD_NAME="g21wbsl1",CLOUDINARY_UPLOAD_PRESET="zein_rahaf_products";
function uploadProductImage(file,onProgress=()=>{}){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest(),form=new FormData();form.append("file",file);form.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);form.append("folder","zein-rahaf/products");xhr.open("POST","https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/image/upload");xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(Math.round(e.loaded/e.total*100),e.loaded,e.total);};xhr.onload=()=>{let result={};try{result=JSON.parse(xhr.responseText||"{}");}catch(_){ }if(xhr.status>=200&&xhr.status<300&&result.secure_url)resolve(result.secure_url);else reject(new Error(result.error?.message||("Cloudinary upload failed ("+xhr.status+")")));};xhr.onerror=()=>reject(new Error("تعذر الاتصال بخدمة رفع الصور. افحص الإنترنت وحاول مرة أخرى."));xhr.onabort=()=>reject(new Error("تم إلغاء رفع الصورة."));xhr.send(form);});}
const ADMIN_EMAIL="fibrahem865@gmail.com";const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString("ar-EG")+" ج.م";let all=[],known=new Set(),first=true,stop=null,products={},currentImageUrl="";
const labels={new:"طلب جديد",confirmed:"تم التأكيد",preparing:"جاري التجهيز",shipped:"تم الشحن",delivered:"تم التسليم",cancelled:"ملغي"}
function safe(v){return String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);}catch(e){$("message").textContent="تعذر الدخول: "+(e.message||e.code)}};
$("logout").onclick=()=>signOut(auth);$("notify").onclick=async()=>{try{const result=await registerStorePush();alert(result.message||"تم تفعيل إشعارات الطلبات");}catch(e){alert(e.message||"تعذر تفعيل الإشعارات");}};
function flatten(data){const out=[];Object.entries(data||{}).forEach(([uid,value])=>{const rows=Array.isArray(value)?value.map((o,i)=>[String(i),o]):Object.entries(value||{});rows.forEach(([key,o])=>{if(o&&typeof o==="object")out.push({...o,uid,orderKey:key,id:o.id||key});});});return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));}
function ping(o){$("notice").style.display="block";$("notice").textContent="طلب جديد وصل الآن: "+(o.name||"عميل")+" · "+money(o.total);try{if("Notification"in window&&Notification.permission==="granted")new Notification("طلب جديد – زين ورهف",{body:(o.name||"عميل")+" · "+money(o.total)+" · الدفع عند الاستلام"});}catch(e){}}
function draw(){const f=$("filter").value,rows=all.filter(o=>o.status!=="delivered"&&(f==="all"||o.status===f));$("total").textContent=all.length;$("fresh").textContent=all.filter(o=>!o.status||o.status==="new"||o.status==="pending").length;$("prep").textContent=all.filter(o=>o.status==="preparing").length;$("done").textContent=all.filter(o=>o.status==="delivered").length;$("orders").innerHTML=rows.length?rows.map(o=>'<article class="order"><div class="order-head"><b>طلب '+safe(o.id)+'</b><span class="pill">'+(labels[o.status]||"طلب جديد")+'</span></div><div class="details"><div>العميل: <b>'+safe(o.name)+'</b></div><div>الهاتف: <a href="tel:'+safe(o.phone)+'">'+safe(o.phone)+'</a></div><div>العنوان: '+safe(o.address)+'</div><div>التاريخ: '+new Date(o.createdAt||Date.now()).toLocaleString("ar-EG")+'</div><div>الدفع: الدفع عند الاستلام</div><div>الإجمالي: <b>'+money(o.total)+'</b></div></div><div class="items">'+(o.items||[]).map(x=>safe(x.name)+" · "+x.size+" مل × "+x.qty).join("<br>")+'</div><div class="actions"><select data-status="'+safe(o.uid+"|"+o.orderKey)+'">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(o.status===k?"selected":"")+'>'+v+'</option>').join("")+'</select><button class="btn dark" data-save="'+safe(o.uid+"|"+o.orderKey)+'">حفظ الحالة</button></div></article>').join(""):'<div class="empty">لا توجد طلبات في هذا التصنيف.</div>';}
function renderProducts(){const rows=Object.entries(products||{}).map(([key,p])=>({...p,id:String(p?.id??key),_key:key}));$("productList").innerHTML=rows.length?rows.map(p=>'<article class="product-admin"><div class="product-preview">'+(p.image?'<img class="product-photo" src="'+safe(p.image)+'" alt="'+safe(p.name||"صورة المنتج")+'">':'<div class="product-bottle '+safe(p.art||"")+'"></div>')+'</div><div class="product-info"><b>'+safe(p.name||"منتج بدون اسم")+'</b><div class="product-meta">'+safe(p.type||"غير مصنف")+' · '+safe(p.tag||"بدون شارة")+'</div><div class="product-prices">'+[[30,p.prices?.[0]],[50,p.prices?.[1]],[100,p.prices?.[2]],[16,p.prices?.[3]],[22,p.prices?.[4]]].map(([size,price])=>'<span>'+size+' مل: '+(price===undefined||price===null?"غير محدد":money(price))+'</span>').join("")+'</div><div class="product-actions"><button class="btn dark" data-edit-product="'+safe(p._key)+'">تعديل المنتج</button><button class="btn" data-delete-product="'+safe(p._key)+'">حذف المنتج</button></div></div></article>').join(""):'<div class="empty">لا توجد منتجات محفوظة في قاعدة البيانات حاليًا. استخدم النموذج بالأعلى لإضافة أول منتج.</div>'}
function clearProduct(){currentImageUrl="";$("productImage").value="";$("productImagePreview").src="";$("productImagePreview").hidden=true;$("productId").value="";$("productName").value="";$("productType").value="رجالي";$("productNotes").value="";$("price16").value="";$("price22").value="";$("price30").value="";$("price50").value="";$("price100").value="";$("productTag").value="";$("productArt").value="";}
$("clearProduct").onclick=clearProduct;
$("productImage").addEventListener("change",()=>{const file=$("productImage").files?.[0];if(!file){$("productImagePreview").hidden=true;return;}if(!file.type.startsWith("image/")||file.size>5*1024*1024){alert("اختار صورة صحيحة أقل من 5 ميجابايت.");$("productImage").value="";return;}$("productImagePreview").src=URL.createObjectURL(file);$("productImagePreview").hidden=false;});
$("saveProduct").onclick=async()=>{const name=$("productName").value.trim(),prices=[$("price30").value,$("price50").value,$("price100").value,$("price16").value,$("price22").value].map(Number);if(!name||[$("price30").value,$("price50").value,$("price100").value,$("price16").value,$("price22").value].some(x=>x.trim()==="")||prices.some(x=>!Number.isFinite(x)||x<0)){ $("productMessage").textContent="اكتب اسم المنتج والأسعار الثلاثة بشكل صحيح.";return;}const id=$("productId").value||String(Date.now());const product={id:Number(id),name,type:$("productType").value,notes:$("productNotes").value.trim(),prices,tag:$("productTag").value.trim()||"جديد",art:$("productArt").value};try{$("saveProduct").disabled=true;$("productMessage").textContent="جاري حفظ المنتج...";const file=$("productImage").files?.[0];if(file){const path="product-images/"+id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");$("productMessage").textContent="جاري رفع الصورة إلى Cloudinary...";product.image=await uploadProductImage(file,(percent)=>{$("productMessage").textContent="رفع الصورة إلى Cloudinary: "+percent+"%";});}else if(currentImageUrl){product.image=currentImageUrl;}await set(ref(db,"products/"+id),product);$("productMessage").textContent="تم حفظ المنتج والصورة بنجاح.";clearProduct();}catch(e){$("productMessage").textContent="فشل الحفظ أو رفع الصورة: "+(e.code||e.message||"خطأ")+" — راجع اتصال Firebase أو إعدادات Cloudinary.";console.error(e);}finally{$("saveProduct").disabled=false;}};
$("productList").addEventListener("click",async e=>{const edit=e.target.closest("[data-edit-product]"),del=e.target.closest("[data-delete-product]");if(edit){const p=products[edit.dataset.editProduct];if(!p)return;$("productId").value=p.id;currentImageUrl=p.image||"";$("productImage").value="";$("productImagePreview").src=currentImageUrl;$("productImagePreview").hidden=!currentImageUrl;$("productName").value=p.name||"";$("productType").value=p.type||"رجالي";$("productNotes").value=p.notes||"";$("price30").value=p.prices?.[0]??"";$("price16").value=p.prices?.[3]??"";$("price22").value=p.prices?.[4]??"";$("price50").value=p.prices?.[1]??"";$("price100").value=p.prices?.[2]??"";$("productTag").value=p.tag||"";$("productArt").value=p.art||"";return;}if(del&&confirm("متأكد من حذف المنتج؟")){try{await set(ref(db,"products/"+del.dataset.deleteProduct),null);}catch(e){alert("تعذر حذف المنتج؛ راجع صلاحيات الإدارة.");}}});
onValue(ref(db,"products"),snap=>{products=snap.val()||{};renderProducts();},e=>{$("productList").textContent="تعذر تحميل المنتجات.";console.error(e);});
$("filter").onchange=draw;$("refresh").onclick=()=>{$("connection").textContent="التحديث مباشر من Firebase";};
$("orders").addEventListener("click",async e=>{const b=e.target.closest("[data-save]");if(!b)return;const [uid,id]=b.dataset.save.split("|"),sel=$("orders").querySelector('[data-status="'+CSS.escape(b.dataset.save)+'"]'),status=sel.value;try{const oldOrder=all.find(o=>o.uid===uid&&o.orderKey===id);await set(ref(db,"orders/"+uid+"/"+id+"/status"),status);$("connection").textContent="تم تحديث حالة الطلب";if(oldOrder&&oldOrder.status!==status){const title=status==="confirmed"?"تمت الموافقة على طلبك":status==="cancelled"?"تم إلغاء طلبك":"تم تحديث حالة طلبك";const message=status==="confirmed"?"وافق المتجر على طلبك وسيتم تجهيزه قريبًا.":("حالة طلبك الآن: "+(labels[status]||status));try{const noticeRef=push(ref(db,"notifications/"+uid));await set(noticeRef,{orderId:oldOrder.id||id,status,title,message,createdAt:Date.now(),read:false});const token=await auth.currentUser.getIdToken(true);const response=await fetch("https://omnix-api.fibrahem865.workers.dev/api/push/notify",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({targetUid:uid,title,body:message,data:{orderId:String(oldOrder.id||id),status}})});const result=await response.json().catch(()=>({}));if(!response.ok)console.warn("Push notification not sent:",result.error||response.status);else $("connection").textContent=result.sent?"تم تحديث الحالة وإرسال إشعار فوري للعميل":"تم تحديث الحالة وحفظ الإشعار داخل الحساب";}catch(noticeError){console.error("Notification save failed:",noticeError);$("connection").textContent="تم تحديث الحالة، لكن تعذر إرسال الإشعار الفوري";}}}catch(err){alert("فشل تحديث الطلب. راجع صلاحيات الإدارة في قواعد Firebase.");console.error(err);}});
onAuthStateChanged(auth,async u=>{if(stop){stop();stop=null;}if(!u){$("loginBox").hidden=false;$("dashboard").hidden=true;$("logout").hidden=true;return;}const signedEmail=String(u.email||"").trim().toLowerCase();let allowed=signedEmail===ADMIN_EMAIL;try{const token=await getIdTokenResult(u,true);allowed=allowed||token.claims.zeinRahafStoreAdmin===true;}catch(e){console.error("Admin role check:",e);}if(!allowed){$("loginBox").hidden=false;$("dashboard").hidden=true;$("logout").hidden=false;$("message").textContent="هذا الحساب غير مصرح له بإدارة عطور زين ورهف.";return;}$("loginBox").hidden=true;$("dashboard").hidden=false;$("logout").hidden=false;$("connection").textContent="متصل – متابعة لحظية";$("connection").textContent="متصل – متابعة لحظية";stop=onValue(ref(db,"orders"),snap=>{const next=flatten(snap.val());if(!first)next.filter(x=>!known.has(x.uid+"|"+x.id)).forEach(ping);known=new Set(next.map(x=>x.uid+"|"+x.id));all=next;first=false;draw();},e=>{$("connection").textContent="خطأ صلاحيات Firebase";console.error(e);});});
</script></body></html>
