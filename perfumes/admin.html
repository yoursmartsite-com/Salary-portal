<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171614"><title>لوحة تحكم زين ورهف</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#faf7f2;--gold:#c59b27;--light:#e6c875;--ink:#171614;--muted:#7c756b;--line:#e8e0d4}*{box-sizing:border-box}body{margin:0;background:#171614;font-family:Cairo,sans-serif;color:var(--ink);padding:20px}.app{max-width:1200px;margin:auto;background:var(--bg);min-height:calc(100vh - 40px);border-radius:22px;overflow:hidden}.top{height:7px;background:linear-gradient(90deg,#806019,#e6c875,#9a7414)}header{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid var(--line)}h1{font:700 30px Amiri;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.btn,select{font:700 12px Cairo;border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:#fff;cursor:pointer}.btn.dark{background:#171614;color:var(--light)}main{padding:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.order{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{display:block;font-size:26px;color:#9a7414}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.orders{display:grid;gap:12px}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#f2ece1;border-radius:20px;padding:5px 10px;font-size:11px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0;font-size:13px}.items{background:#faf7f2;padding:10px;border-radius:10px;font-size:12px;line-height:2}.actions{display:flex;gap:8px;align-items:center;margin-top:12px}.notice{background:#171614;color:#e6c875;padding:12px 15px;border-radius:12px;margin:12px 0;display:none}.empty{text-align:center;padding:40px;background:#fff;border-radius:15px;color:var(--muted)}#loginBox{max-width:460px;margin:45px auto;padding:24px;background:#fff;border-radius:18px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;font:13px Cairo}@media(max-width:650px){body{padding:0}.app{border-radius:0}.stats{grid-template-columns:repeat(2,1fr)}main{padding:14px}.details{grid-template-columns:1fr}header{padding:15px}.actions{flex-wrap:wrap}}</style></head><body><div class="app"><div class="top"></div><header><div><h1>زين ورهف | لوحة التحكم</h1><div class="sub">إدارة الطلبات · الدفع عند الاستلام</div></div><div><button class="btn" id="notify">تفعيل إشعارات المتصفح</button> <button class="btn dark" id="logout" hidden>خروج</button></div></header><main><div id="loginBox"><h2>دخول الإدارة</h2><p class="muted">سجّل الدخول بحساب الإدارة المعتمد.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="btn dark" id="login">تسجيل الدخول</button><p id="message" class="muted"></p></div><section id="dashboard" hidden><div class="notice" id="notice"></div><div class="stats"><div class="stat">كل الطلبات<b id="total">0</b></div><div class="stat">طلبات جديدة<b id="fresh">0</b></div><div class="stat">قيد التجهيز<b id="prep">0</b></div><div class="stat">تم التسليم<b id="done">0</b></div></div><div class="toolbar"><select id="filter"><option value="all">كل الحالات</option><option value="new">طلبات جديدة</option><option value="confirmed">تم التأكيد</option><option value="preparing">جاري التجهيز</option><option value="shipped">تم الشحن</option><option value="delivered">تم التسليم</option><option value="cancelled">ملغي</option></select><button class="btn" id="refresh">تحديث</button><span class="muted" id="connection">بانتظار الاتصال…</span></div><div class="orders" id="orders"><div class="empty">جاري تحميل الطلبات…</div></div>
<div class="order" style="margin-top:22px"><h2>إدارة المنتجات والأسعار</h2><input id="productId" type="hidden"><input id="productName" placeholder="اسم العطر"><select id="productType"><option>رجالي</option><option>حريمي</option><option>يونيسكس</option></select><input id="productNotes" placeholder="وصف ومكونات العطر"><div class="details"><input id="price16" type="number" min="0" placeholder="سعر 16 مل"><input id="price30" type="number" min="0" placeholder="سعر 30 مل"><input id="price50" type="number" min="0" placeholder="سعر 50 مل"><input id="price100" type="number" min="0" placeholder="سعر 100 مل"></div><input id="productTag" placeholder="شارة المنتج مثل الأكثر مبيعًا"><select id="productArt"><option value="">ذهبي</option><option value="dark">داكن</option><option value="silver">فضي</option></select><div class="actions"><button class="btn dark" id="saveProduct">حفظ المنتج</button><button class="btn" id="clearProduct">منتج جديد</button></div><div id="productMessage" class="muted"></div><div id="productList" class="orders" style="margin-top:12px">جاري تحميل المنتجات…</div></div></section></main></div>
<script type="module">import {auth,db,signInWithEmailAndPassword,signOut,onAuthStateChanged,ref,onValue,set,get} from "./firebase.js";
const ADMIN_EMAIL="fibrahem865@gmail.com";const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString("ar-EG")+" ج.م";let all=[],known=new Set(),first=true,stop=null,products={};
const labels={new:"طلب جديد",confirmed:"تم التأكيد",preparing:"جاري التجهيز",shipped:"تم الشحن",delivered:"تم التسليم",cancelled:"ملغي"}
function safe(v){return String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("login").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);}catch(e){$("message").textContent="تعذر الدخول: "+(e.message||e.code)}};
$("logout").onclick=()=>signOut(auth);$("notify").onclick=async()=>{if(!("Notification"in window))return alert("المتصفح لا يدعم إشعارات النظام");const p=await Notification.requestPermission();alert(p==="granted"?"تم تفعيل إشعارات الطلبات":"لم يتم السماح بالإشعارات");};
function flatten(data){const out=[];Object.entries(data||{}).forEach(([uid,value])=>{const rows=Array.isArray(value)?value.map((o,i)=>[String(i),o]):Object.entries(value||{});rows.forEach(([key,o])=>{if(o&&typeof o==="object")out.push({...o,uid,orderKey:key,id:o.id||key});});});return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));}
function ping(o){$("notice").style.display="block";$("notice").textContent="طلب جديد وصل الآن: "+(o.name||"عميل")+" · "+money(o.total);try{if("Notification"in window&&Notification.permission==="granted")new Notification("طلب جديد – زين ورهف",{body:(o.name||"عميل")+" · "+money(o.total)+" · الدفع عند الاستلام"});}catch(e){}}
function draw(){const f=$("filter").value,rows=all.filter(o=>f==="all"||o.status===f);$("total").textContent=all.length;$("fresh").textContent=all.filter(o=>!o.status||o.status==="new"||o.status==="pending").length;$("prep").textContent=all.filter(o=>o.status==="preparing").length;$("done").textContent=all.filter(o=>o.status==="delivered").length;$("orders").innerHTML=rows.length?rows.map(o=>'<article class="order"><div class="order-head"><b>طلب '+safe(o.id)+'</b><span class="pill">'+(labels[o.status]||"طلب جديد")+'</span></div><div class="details"><div>العميل: <b>'+safe(o.name)+'</b></div><div>الهاتف: <a href="tel:'+safe(o.phone)+'">'+safe(o.phone)+'</a></div><div>العنوان: '+safe(o.address)+'</div><div>التاريخ: '+new Date(o.createdAt||Date.now()).toLocaleString("ar-EG")+'</div><div>الدفع: الدفع عند الاستلام</div><div>الإجمالي: <b>'+money(o.total)+'</b></div></div><div class="items">'+(o.items||[]).map(x=>safe(x.name)+" · "+x.size+" مل × "+x.qty).join("<br>")+'</div><div class="actions"><select data-status="'+safe(o.uid+"|"+o.orderKey)+'">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(o.status===k?"selected":"")+'>'+v+'</option>').join("")+'</select><button class="btn dark" data-save="'+safe(o.uid+"|"+o.orderKey)+'">حفظ الحالة</button></div></article>').join(""):'<div class="empty">لا توجد طلبات في هذا التصنيف.</div>';}
function renderProducts(){const rows=Object.values(products||{});$("productList").innerHTML=rows.length?rows.map(p=>'<div class="order-head"><b>'+safe(p.name)+'</b><span>'+money((p.prices||[])[0]||0)+' / 30 مل</span><div class="actions"><button class="btn" data-edit-product="'+safe(p.id)+'">تعديل</button><button class="btn" data-delete-product="'+safe(p.id)+'">حذف</button></div></div>').join(""):'<div class="empty">مفيش منتجات محفوظة على Firebase؛ المتجر هيعرض المجموعة الافتراضية.</div>';}
function clearProduct(){$("productId").value="";$("productName").value="";$("productType").value="رجالي";$("productNotes").value="";$("price16").value="";$("price30").value="";$("price50").value="";$("price100").value="";$("productTag").value="";$("productArt").value="";}
$("clearProduct").onclick=clearProduct;
$("saveProduct").onclick=async()=>{const name=$("productName").value.trim(),prices=[$("price30").value,$("price50").value,$("price100").value,$("price16").value].map(Number);if(!name||[$("price30").value,$("price50").value,$("price100").value,$("price16").value].some(x=>x.trim()==="")||prices.some(x=>!Number.isFinite(x)||x<0)){ $("productMessage").textContent="اكتب اسم المنتج والأسعار الثلاثة بشكل صحيح.";return;}const id=$("productId").value||String(Date.now());const product={id:Number(id),name,type:$("productType").value,notes:$("productNotes").value.trim(),prices,tag:$("productTag").value.trim()||"جديد",art:$("productArt").value};try{await set(ref(db,"products/"+id),product);$("productMessage").textContent="تم حفظ المنتج.";clearProduct();}catch(e){$("productMessage").textContent="فشل الحفظ؛ تأكد من بريد الإدارة وقواعد Firebase.";console.error(e);}};
$("productList").addEventListener("click",async e=>{const edit=e.target.closest("[data-edit-product]"),del=e.target.closest("[data-delete-product]");if(edit){const p=products[edit.dataset.editProduct];if(!p)return;$("productId").value=p.id;$("productName").value=p.name||"";$("productType").value=p.type||"رجالي";$("productNotes").value=p.notes||"";$("price30").value=p.prices?.[0]??"";$("price16").value=p.prices?.[3]??"";$("price50").value=p.prices?.[1]??"";$("price100").value=p.prices?.[2]??"";$("productTag").value=p.tag||"";$("productArt").value=p.art||"";return;}if(del&&confirm("متأكد من حذف المنتج؟")){try{await set(ref(db,"products/"+del.dataset.deleteProduct),null);}catch(e){alert("تعذر حذف المنتج؛ راجع صلاحيات الإدارة.");}}});
onValue(ref(db,"products"),snap=>{products=snap.val()||{};renderProducts();},e=>{$("productList").textContent="تعذر تحميل المنتجات.";console.error(e);});
$("filter").onchange=draw;$("refresh").onclick=()=>{$("connection").textContent="التحديث مباشر من Firebase";};
$("orders").addEventListener("click",async e=>{const b=e.target.closest("[data-save]");if(!b)return;const [uid,id]=b.dataset.save.split("|"),sel=$("orders").querySelector('[data-status="'+CSS.escape(b.dataset.save)+'"]'),status=sel.value;try{await set(ref(db,"orders/"+uid+"/"+id+"/status"),status);$("connection").textContent="تم تحديث حالة الطلب";}catch(err){alert("فشل تحديث الطلب. راجع صلاحيات الإدارة في قواعد Firebase.");console.error(err);}});
onAuthStateChanged(auth,async u=>{if(stop){stop();stop=null;}if(!u){$("loginBox").hidden=false;$("dashboard").hidden=true;$("logout").hidden=true;return;}const signedEmail=String(u.email||"").trim().toLowerCase(),adminEmail=String(ADMIN_EMAIL||"").trim().toLowerCase();if(signedEmail!==adminEmail){$("loginBox").hidden=false;$("dashboard").hidden=true;$("logout").hidden=false;$("message").textContent="أنت مسجل حاليًا بحساب "+(u.email||"بدون بريد")+". اضغط خروج لتبديل الحساب، ثم سجّل ببريد الإدارة "+ADMIN_EMAIL+".";return;}$("loginBox").hidden=true;$("dashboard").hidden=false;$("logout").hidden=false;$("connection").textContent="متصل – متابعة لحظية";$("connection").textContent="متصل – متابعة لحظية";stop=onValue(ref(db,"orders"),snap=>{const next=flatten(snap.val());if(!first)next.filter(x=>!known.has(x.uid+"|"+x.id)).forEach(ping);known=new Set(next.map(x=>x.uid+"|"+x.id));all=next;first=false;draw();},e=>{$("connection").textContent="خطأ صلاحيات Firebase";console.error(e);});});
</script></body></html>
