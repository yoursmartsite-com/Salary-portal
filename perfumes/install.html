<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b22"><meta name="description" content="ثبّت متجر زين ورهف للعطور على موبايلك"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>تطبيق زين ورهف | تثبيت المتجر</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#30313a,#171b22 55%,#101216);color:#fff8ed;font-family:Cairo,Arial,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,460px);text-align:center;border:1px solid #c99a6270;border-radius:28px;padding:34px 24px;background:#ffffff08;box-shadow:0 25px 80px #0007}.logo{width:86px;height:86px;margin:0 auto 16px;border-radius:24px;background:#0f1218;border:1px solid #d6a65d;display:grid;place-items:center;color:#e6c487;font-size:48px}.eyebrow{color:#d6a65d;font-size:11px;letter-spacing:3px;font-weight:800}.card h1{font-size:30px;margin:7px 0 4px}.card p{color:#c7bfb3;font-size:13px;line-height:2;margin:12px 0 24px}.btn{display:block;width:100%;padding:15px 18px;border-radius:13px;text-decoration:none;font:800 14px Cairo,Arial;border:0;margin:10px 0;cursor:pointer}.gold{background:linear-gradient(120deg,#bd8845,#f0ce8c);color:#21170d}.outline{border:1px solid #c99a62;color:#f3d39a;background:transparent}.hint{font-size:11px!important;color:#a9a096!important;margin-top:18px!important}.status{font-size:12px;color:#e6c487;min-height:24px}</style></head><body><main class="card"><div class="logo">ز</div><div class="eyebrow">ZEIN & RAHAF</div><h1>زين ورهف للعطور</h1><p>عطورك المفضلة وتجربة تسوق سهلة — ثبّت المتجر على شاشة موبايلك وافتحه في أي وقت.</p><button class="btn gold" id="installBtn">تثبيت التطبيق على الموبايل</button><a class="btn outline" href="./index.html">الدخول إلى المتجر مباشرة</a><div class="status" id="status"></div><p class="hint" id="hint">لو زر التثبيت مش متاح، افتح قائمة المتصفح واختر «إضافة إلى الشاشة الرئيسية» أو «Install app».</p></main><script>let installPrompt=null;const btn=document.getElementById("installBtn"),status=document.getElementById("status"),hint=document.getElementById("hint");window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;btn.hidden=false});btn.addEventListener("click",async()=>{if(!installPrompt){status.textContent="افتح قائمة المتصفح ⋮ ثم اختر إضافة إلى الشاشة الرئيسية.";return}installPrompt.prompt();const choice=await installPrompt.userChoice;status.textContent=choice.outcome==="accepted"?"جاري تثبيت المتجر…":"تقدر تثبته في أي وقت من قائمة المتصفح.";installPrompt=null});window.addEventListener("appinstalled",()=>{status.textContent="تم تثبيت زين ورهف بنجاح ❤️";btn.hidden=true});if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
