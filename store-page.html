<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14"><title>متجر لَمّة | لَمّة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b14;--line:#283653;--text:#f4f6ff;--muted:#a5b2ca}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#30234e 0,transparent 43%),var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(1180px,100%);margin:auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:18px;background:#111a2cee}
.brand{font-size:22px;font-weight:900}.brand b{display:inline-grid;place-items:center;width:40px;height:40px;margin-left:8px;border-radius:12px;background:linear-gradient(135deg,#8057ed,#27bad2)}
.btn{border:0;border-radius:12px;padding:10px 15px;background:linear-gradient(110deg,#7651e8,#267f9d);color:white;font:800 13px Cairo;cursor:pointer}
.hero{margin:16px 0;padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(120deg,#1c2440,#10182a)}
.hero h1{font-size:clamp(28px,5vw,42px);margin:0 0 5px}.hero p{margin:0;color:var(--muted);line-height:1.9}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0;padding:16px 18px;border:1px solid #cda95166;border-radius:16px;background:linear-gradient(130deg,#322a20,#171c2c)}
.wallet small{display:block;color:#d8c69d}.wallet strong{font-size:27px;color:#ffe5a2}.status{min-height:25px;color:#b8c9e4;font-size:12px;margin:12px 2px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.item{display:flex;flex-direction:column;gap:8px;min-width:0;padding:16px;border:1px solid #ffffff1c;border-radius:17px;background:linear-gradient(145deg,#1a2942,#101828);box-shadow:0 12px 28px #0003}
.item .symbol{display:grid;place-items:center;width:58px;height:58px;border-radius:15px;background:linear-gradient(145deg,#f7e5b9,#b98737);color:#1c2435;font-size:30px;box-shadow:inset 0 2px 3px #fff9,0 5px 13px #0004}
.item h2{font-size:16px;margin:2px 0}.item p{margin:0;color:var(--muted);font-size:12px;line-height:1.7;min-height:38px}
.item .meta{display:flex;justify-content:space-between;gap:8px;color:#e9d39f;font-size:12px;font-weight:800}
.item button{margin-top:auto;width:100%;border:0;border-radius:11px;padding:10px;background:linear-gradient(110deg,#d6a849,#f1d17c);color:#211a0c;font:900 13px Cairo;cursor:pointer}
.item button:disabled{opacity:.5;cursor:wait}.owned{color:#65ddb1!important}.empty{padding:22px;border:1px dashed #52617b;border-radius:14px;color:var(--muted);text-align:center}
@media(max-width:760px){.wrap{padding:9px}.top{padding:10px}.brand{font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{padding:11px}.item h2{font-size:14px}.item p{font-size:11px}.item .symbol{width:49px;height:49px;font-size:25px}.wallet{padding:12px}.hero{padding:18px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><a class="brand" href="./index.html"><b>ل</b>لَمّة | المتجر</a><a class="btn" href="./index.html">← الرئيسية</a></header>
<section class="hero"><h1>متجر لَمّة</h1><p>كل إضافات ألعاب لَمّة في مكان واحد. اشتري بعملة LC، وهتتسجل المشتريات في مخزون حسابك.</p></section>
<section class="wallet"><div><small>رصيد عملة لَمّة</small><strong id="balance">— LC</strong></div><div id="accountState">جاري تسجيل الدخول…</div></section>
<div class="status" id="status" aria-live="polite">جاري تحميل المنتجات…</div>
<section class="grid" id="items"><div class="empty">جاري تحميل المتجر…</div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(()=>{
const cfg={apiKey:"AIzaSyArJNDKNNTs2oFGFWV58_1UKY3GmE06ghk",authDomain:"play-with-friends-com.firebaseapp.com",databaseURL:"https://play-with-friends-com-default-rtdb.firebaseio.com",projectId:"play-with-friends-com",storageBucket:"play-with-friends-com.firebasestorage.app",messagingSenderId:"52443545219",appId:"1:52443545219:web:62c9746888f7fe2bf9a5b6"};
const API="https://empty-unit-a7ab.fibrahem865.workers.dev", $=id=>document.getElementById(id);
let db=null,user=null,inventory={};
function say(t){$("status").textContent=t}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function refresh(){
 if(!user)return;
 const [walletSnap,inventorySnap]=await Promise.all([db.ref("wallets/"+user.uid).get(),db.ref("inventory/"+user.uid).get()]);
 $("balance").textContent=Number(walletSnap.val()?.balance||0).toLocaleString("en-US")+" LC";
 inventory=inventorySnap.val()?.items||{};
}
async function load(){
 try{
  if(!firebase.apps.length)firebase.initializeApp(cfg);
  db=firebase.database();
  user=firebase.auth().currentUser;
  if(!user){const credential=await firebase.auth().signInAnonymously();user=credential.user}
  $("accountState").textContent="الحساب متصل";
  await refresh();
  const response=await fetch(API+"/catalog");
  const data=await response.json();
  if(!response.ok||!data.items)throw Error(data.error||"تعذر تحميل المنتجات.");
  $("items").innerHTML=Object.entries(data.items).map(([id,item])=>{
   const count=Number(inventory[id]?.quantity||0);
   const icon={dice:"🎲",piece:"💎",board:"♟",frame:"🖼️",effect:"🏆"}[item.type]||"✦";
   return '<article class="item"><div class="symbol">'+icon+'</div><h2>'+esc(item.name)+'</h2><p>إضافة لحسابك في ألعاب لَمّة.</p><div class="meta"><span>'+Number(item.price)+' LC</span><span class="'+(count?'owned':'')+'">'+(count?"معاك: "+count:"غير مملوك")+'</span></div><button data-buy="'+esc(id)+'">'+(count?"شراء نسخة أخرى":"شراء فوري")+'</button></article>';
  }).join("")||'<div class="empty">المتجر فاضي حاليًا.</div>';
  document.querySelectorAll("[data-buy]").forEach(button=>button.addEventListener("click",()=>buy(button.dataset.buy,button)));
  say("الشراء فوري ويُخصم من رصيد LC بعد تأكيد العملية.");
 }catch(error){$("accountState").textContent="تعذر الاتصال";say(error.message||"حصل خطأ أثناء تحميل المتجر.")}
}
async function buy(id,button){
 if(!user)return say("سجل دخولك الأول.");
 button.disabled=true;button.textContent="جاري الشراء…";
 try{
  const token=await user.getIdToken(true);
  const response=await fetch(API+"/purchase",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:JSON.stringify({itemId:id,requestId:crypto.randomUUID().replace(/-/g,"")})});
  const data=await response.json();
  if(!response.ok||!data.ok)throw Error(data.error||"فشل الشراء.");
  $("balance").textContent=Number(data.balance||0).toLocaleString("en-US")+" LC";
  say("تم شراء "+data.itemName+" وتسليمه لحسابك.");
  await load();
 }catch(error){say(error.message||"تعذر الشراء.");button.disabled=false;button.textContent="إعادة المحاولة"}
}
load();
})();
</script></body></html>
