<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090e1d"><title>كسّر الطوب | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#090e1d;color:#f5f7ff;font-family:system-ui,Arial;text-align:center;padding:12px}.wrap{max-width:600px;margin:auto}a{color:#b9adff;text-decoration:none;font-weight:800}h1{margin:10px 0}p{color:#aab5ce}canvas{width:min(94vw,520px);height:auto;display:block;margin:12px auto;border:1px solid #364767;border-radius:14px;background:#0d1729;touch-action:none}.hud{display:flex;justify-content:center;gap:12px}.stat{padding:8px 18px;background:#151f35;border:1px solid #303e5e;border-radius:12px}.btn{border:1px solid #3b4a6c;border-radius:12px;background:#202d49;color:white;padding:12px 18px;font-weight:900}.hint{font-size:12px}</style></head><body><div class="wrap"><header><a href="./games.html">← مكتبة الألعاب</a></header><h1>🧱 كسّر الطوب</h1><p>حرّك المضرب وخلّي الكرة تكسّر كل الطوب.</p><div class="hud"><div class="stat">النقاط <b id="score">0</b></div><div class="stat">المحاولات <b id="lives">3</b></div></div><canvas id="c" width="520" height="620"></canvas><button class="btn" id="start">ابدأ اللعب</button><p class="hint">حرّك إصبعك يمين وشمال على اللوحة، أو استخدم الأسهم على الكمبيوتر.</p></div><script>const c=document.getElementById('c'),g=c.getContext('2d');let paddle,ball,bricks,score,lives,running=false,raf=0;function reset(){paddle={x:210,w:100};ball={x:260,y:520,dx:3,dy:-4,r:8};bricks=[];for(let r=0;r<5;r++)for(let col=0;col<8;col++)bricks.push({x:12+col*63,y:65+r*30,w:55,h:20,on:true,color:['#a99aff','#71e2b4','#ffb36b','#ff729d','#72baff'][r]});score=0;lives=3;running=true;document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;cancelAnimationFrame(raf);loop()}function draw(){g.clearRect(0,0,520,620);g.fillStyle='#0d1729';g.fillRect(0,0,520,620);bricks.forEach(b=>{if(!b.on)return;g.fillStyle=b.color;g.beginPath();g.roundRect(b.x,b.y,b.w,b.h,5);g.fill()});g.fillStyle='#f5f7ff';g.beginPath();g.roundRect(paddle.x,570,paddle.w,13,7);g.fill();g.fillStyle='#ffef9c';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill()}function loop(){if(!running)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>520-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy*=-1;if(ball.y+ball.r>=570&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);ball.dx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*4.5}for(const b of bricks){if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){b.on=false;ball.dy*=-1;score+=10;document.getElementById('score').textContent=score;break}}if(ball.y>620){lives--;document.getElementById('lives').textContent=lives;if(!lives){running=false;draw();g.fillStyle='white';g.font='bold 24px system-ui';g.textAlign='center';g.fillText('انتهت المحاولات! اضغط ابدأ',260,330);return}ball={x:260,y:520,dx:3,dy:-4,r:8}}if(bricks.every(b=>!b.on)){running=false;draw();g.fillStyle='white';g.font='bold 25px system-ui';g.textAlign='center';g.fillText('كسبت! ممتاز 👏',260,330);return}draw();raf=requestAnimationFrame(loop)}function move(clientX){const r=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(520-paddle.w,(clientX-r.left)/r.width*520-paddle.w/2))}c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});c.addEventListener('pointerdown',e=>move(e.clientX));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')paddle.x=Math.max(0,paddle.x-25);if(e.key==='ArrowRight')paddle.x=Math.min(520-paddle.w,paddle.x+25)});document.getElementById('start').onclick=reset;draw();</script></body></html>
