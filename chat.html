<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080e1c"><title>شات اللاعبين | لَمّة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080e1c;--panel:#111b2e;--line:#263651;--text:#f3f6ff;--muted:#9caac5;--mint:#66e8c2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#152944 0,#080e1c 58%);color:var(--text);font-family:Cairo,system-ui,sans-serif;min-height:100dvh}button,input{font:inherit}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#080e1ceF;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{font-weight:900;font-size:19px}.brand b{display:inline-grid;place-items:center;background:linear-gradient(135deg,#66e8c2,#4799ff);color:#07121f;border-radius:10px;width:34px;height:34px;margin-left:8px}.back{border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted)}main{width:min(900px,100%);margin:auto;padding:18px 12px 20px}.intro{padding:18px 16px 12px}.eyebrow{color:var(--mint);font-size:12px;font-weight:800}.intro h1{font-size:clamp(25px,5vw,38px);margin:6px 0}.intro p{color:var(--muted);margin:0;line-height:1.8}.panel{background:#0e1829;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px #0003}.status{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-left:6px}.messages{height:min(58dvh,590px);min-height:280px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}.empty{text-align:center;color:var(--muted);margin:auto;line-height:1.9}.msg{max-width:88%;align-self:flex-start;background:#18263b;border:1px solid #293d59;border-radius:16px 16px 16px 5px;padding:9px 12px;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#103b3a;border-color:#20665e;border-radius:16px 16px 5px 16px}.meta{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--mint);font-weight:800;margin-bottom:3px}.meta time{font-size:10px;color:var(--muted);font-weight:400}.body{white-space:pre-wrap;line-height:1.65;font-size:14px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#0a1322}.composer input{min-width:0;flex:1;border:1px solid #2b3d58;border-radius:13px;padding:12px;background:#111d30;color:white;font-size:16px;outline:none}.composer input:focus{border-color:var(--mint)}.send{border:0;border-radius:13px;padding:0 17px;background:linear-gradient(135deg,#66e8c2,#54aaff);color:#07121f;font-weight:900}.send:disabled{opacity:.5}.note{color:var(--muted);font-size:11px;line-height:1.8;padding:10px 14px}.error{color:#ffb6b6}.who{font-size:12px;color:var(--muted);padding:0 16px 12px}@media(max-width:520px){.messages{height:58dvh;min-height:250px}.composer{padding:9px}.send{padding:0 13px}.msg{max-width:94%}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./"><b>ل</b>لَمّة</a><a class="back" href="./">← رجوع للموقع</a></header>
<main><section class="intro"><span class="eyebrow">مجتمع لَمّة · دردشة عامة</span><h1>💬 شات اللاعبين</h1><p>اتكلم مع اللاعبين الموجودين في لَمّة، اتعرف على ناس جديدة واتفقوا على لعبة.</p></section>
<div class="who" id="who">جاري الاتصال…</div>
<section class="panel"><div class="status"><span><i class="dot"></i><span id="connection">جاري الاتصال بالشات</span></span><span id="count">آخر الرسائل</span></div><div class="messages" id="messages" aria-live="polite"><div class="empty">بنجهّز الشات…</div></div>
<form class="composer" id="form"><input id="message" maxlength="300" autocomplete="off" placeholder="اكتب رسالتك للاعبين…" aria-label="رسالتك" required><button class="send" id="send" type="submit">إرسال</button></form>
<div class="note">خليك محترم ومتشاركش بياناتك الخاصة. الرسائل عامة للاعبين المسجلين. <span id="help" class="error"></span></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyArJNDKNNTs2oFGFWV58_1UKY3GmE06ghk",authDomain:"play-with-friends-com.firebaseapp.com",databaseURL:"https://play-with-friends-com-default-rtdb.firebaseio.com",projectId:"play-with-friends-com",storageBucket:"play-with-friends-com.firebasestorage.app",messagingSenderId:"52443545219",appId:"1:52443545219:web:62c9746888f7fe2bf9a5b6"};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,me=null,myName=localStorage.getItem('lammaName')||localStorage.getItem('arcade_name')||'لاعب',firstLoad=true,seen=new Set();
function fail(msg){$('#help').textContent=msg;$('#connection').textContent='الاتصال محتاج مراجعة';}
function render(snap){const data=snap.val()||{};const rows=Object.entries(data).map(([id,m])=>({id,...m})).filter(m=>m&&typeof m.text==='string').sort((a,b)=>(Number(a.at)||0)-(Number(b.at)||0));$('#count').textContent=rows.length+' رسالة';const nearBottom=$('#messages').scrollHeight-$('#messages').scrollTop-$('#messages').clientHeight<100;$('#messages').innerHTML=rows.length?rows.map(m=>'<article class="msg '+(m.uid===me?.uid?'mine':'')+'"><div class="meta"><span>'+esc(m.name||'لاعب')+'</span><time>'+new Date(Number(m.at)||Date.now()).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+'</time></div><div class="body">'+esc(m.text)+'</div></article>').join(''):'<div class="empty">لسه مفيش رسائل هنا.<br>ابدأ الكلام وخلي اللّمة تجمعكم 👋</div>';if(nearBottom||firstLoad)$('#messages').scrollTop=$('#messages').scrollHeight;firstLoad=false;}
(async()=>{try{if(!firebase.apps.length)firebase.initializeApp(cfg);db=firebase.database();const auth=firebase.auth();let user=auth.currentUser;if(!user)user=(await auth.signInAnonymously()).user;me=user;const profile=(await db.ref('profiles/'+user.uid).once('value')).val()||{};myName=profile.name||myName;$('#who').textContent='داخل باسم: '+myName;$('#connection').textContent='متصل أونلاين';db.ref('globalChat').limitToLast(100).on('value',render,e=>{console.error(e);fail(e.code==='PERMISSION_DENIED'?'صلاحيات الشات مش منشورة في Firebase لسه.': 'تعذر تحميل الرسائل: '+e.message)});}catch(e){console.error(e);fail(e.code==='PERMISSION_DENIED'?'صلاحيات الشات مش منشورة في Firebase لسه.':'تعذر الاتصال: '+(e.message||e.code));}})();
$('#form').addEventListener('submit',async e=>{e.preventDefault();const text=$('#message').value.trim();if(!text||!db||!me)return;const btn=$('#send');btn.disabled=true;try{const profile=(await db.ref('profiles/'+me.uid).once('value')).val()||{};const name=String(profile.name||myName||'لاعب').slice(0,32);await db.ref('globalChat').push({uid:me.uid,name,text:text.slice(0,300),at:firebase.database.ServerValue.TIMESTAMP});$('#message').value='';$('#help').textContent='';}catch(e){console.error(e);fail(e.code==='PERMISSION_DENIED'?'لازم تنشر قواعد globalChat في Firebase (الرابط والتعليمات موجودة في database.rules.json).':'فشل إرسال الرسالة: '+(e.message||e.code));}finally{btn.disabled=false;$('#message').focus();}});
</script></body></html>
