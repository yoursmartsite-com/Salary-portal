<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>مغامرة النار والماء | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;text-align:center}header{padding:12px;background:#0b2034;border-bottom:1px solid #246080;display:flex;justify-content:space-between;align-items:center}h2{font-size:19px;margin:0}button{border:1px solid #46b8e8;background:#07517b;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;touch-action:manipulation}main{max-width:900px;margin:auto;padding:10px}canvas{width:100%;height:min(65vh,540px);display:block;background:#0c2235;border:1px solid #2d5976;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}.hint{color:#a6c6da;font-size:13px;padding:4px}button:active{transform:scale(.98)}</style><header><h2>مغامرة النار والماء</h2><button onclick="location.href='/'">لَمّة ⌂</button></header><main><div class="hint">حرّك الشخصيتين واجمع الجواهر ووصل للبابين. الأسهم للنار و A/D للماء.</div><canvas id="c" width="800" height="520"></canvas><div class="controls"><button onclick="move(-1,0)">◀ نار</button><button onclick="move(1,0)">نار ▶</button><button onclick="move(-1,1)">◀ ماء</button><button onclick="move(1,1)">ماء ▶</button><button onclick="reset()">إعادة</button></div><div id="status" class="hint">ابدأ اللعب!</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let a=[100,420],b=[160,420],gems=[[300,380],[470,300],[600,420]],won=false;function reset(){a=[100,420];b=[160,420];gems=[[300,380],[470,300],[600,420]];won=false;draw()}function move(d,p){let q=p?b:a;q[0]=Math.max(35,Math.min(765,q[0]+d*24));q[1]=Math.max(80,Math.min(460,q[1]-(q[1]>180?12:0)));draw()}function draw(){x.fillStyle='#0b2035';x.fillRect(0,0,800,520);x.fillStyle='#356d89';[[0,470,800,50],[100,390,230,15],[370,320,210,15],[570,430,150,15]].forEach(r=>x.fillRect(...r));gems.forEach((g,i)=>{x.fillStyle='#ffe26d';x.beginPath();x.arc(g[0],g[1],9,0,7);x.fill()});[[a,'#ff634e'],[b,'#56d9ff']].forEach(([p,col])=>{x.fillStyle=col;x.fillRect(p[0]-13,p[1]-27,26,34);x.beginPath();x.arc(p[0],p[1]-32,12,0,7);x.fill()});x.fillStyle='#8cffb4';x.fillRect(730,390,35,80);if(a[0]>700&&b[0]>700){won=true;s.textContent='🏆 وصلتوا للنهاية! اضغط إعادة للعب تاني'}else s.textContent='الجواهر المتبقية: '+gems.length}c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*800/r.width;move(px<400?-1:1,0);gems=gems.filter(g=>Math.abs(g[0]-a[0])>25);draw()});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='a')move(-1,1);if(e.key==='d')move(1,1)});reset();</script></html>
