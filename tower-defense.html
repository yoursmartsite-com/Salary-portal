<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>الدفاع عن القلعة | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;text-align:center}header{padding:12px;background:#0b2034;border-bottom:1px solid #246080;display:flex;justify-content:space-between;align-items:center}h2{font-size:19px;margin:0}button{border:1px solid #46b8e8;background:#07517b;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;touch-action:manipulation}main{max-width:900px;margin:auto;padding:10px}canvas{width:100%;height:min(65vh,540px);display:block;background:#0c2235;border:1px solid #2d5976;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}.hint{color:#a6c6da;font-size:13px;padding:4px}button:active{transform:scale(.98)}</style><header><h2>الدفاع عن القلعة</h2><button onclick="location.href='/'">لَمّة ⌂</button></header><main><div class="hint">اضغط على أرض الملعب لبناء برج. الأبراج تطلق على الأعداء تلقائيًا.</div><canvas id="c" width="800" height="520"></canvas><div class="controls"><button onclick="build()">ابني برج (10 نقاط)</button><button onclick="reset()">إعادة</button></div><div id="status" class="hint">ابدأ اللعب!</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let towers=[],enemies=[],money=30,kills=0,last=0;function reset(){towers=[];enemies=[];money=30;kills=0;last=0;requestAnimationFrame(loop)}function build(){if(money>=10){towers.push({x:100+towers.length%5*130,y:260+(towers.length%2)*100,cd:0});money-=10}else s.textContent='محتاج نقاط أكتر للبناء'}function loop(t){x.fillStyle='#193d35';x.fillRect(0,0,800,520);x.fillStyle='#8c754a';x.fillRect(0,220,800,90);if(t-last>1250){enemies.push({x:0,y:265,hp:3});last=t}enemies.forEach(e=>{e.x+=.7;towers.forEach(a=>{if(Math.hypot(e.x-a.x,e.y-a.y)<150&&e.hp>0){e.hp-=.018;x.strokeStyle='#ffe36b';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(e.x,e.y);x.stroke()}});x.fillStyle='#ff6060';x.fillRect(e.x-10,e.y-12,20,24)});enemies=enemies.filter(e=>{if(e.hp<=0){money+=3;kills++;return false}return e.x<810});towers.forEach(a=>{x.fillStyle='#64d8ff';x.fillRect(a.x-15,a.y-18,30,36);x.fillStyle='#c7f4ff';x.beginPath();x.arc(a.x,a.y-18,10,0,7);x.fill()});s.textContent='النقاط: '+money+' • أعداء هزمتهم: '+kills+' • اضغط ابنِ برج';requestAnimationFrame(loop)}c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();towers.push({x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*520/r.height});money=Math.max(0,money-10)});reset();</script></html>
