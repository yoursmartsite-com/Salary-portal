<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071327"><title>بولينج لَمّة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101e;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation}button{font:inherit;color:white;border:1px solid #3c8cc4;background:linear-gradient(145deg,#12335a,#08162d);border-radius:14px;padding:10px 15px;font-weight:800;cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0,#14355b 0,#071327 55%,#030914 100%)}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px;border-bottom:1px solid #2b5278;background:#071326;z-index:2}.brand{display:flex;align-items:center;gap:9px;font-size:clamp(18px,4vw,25px);font-weight:950}.ball{font-size:30px;filter:drop-shadow(0 0 9px #16baff)}.sub{font-size:11px;color:#8cb4d7}.stats{display:flex;gap:7px}.pill{border:1px solid #24517b;background:#091a31;border-radius:12px;padding:6px 9px;text-align:center;min-width:53px}.pill b{display:block;color:#ffc857;font-size:17px}.pill small{color:#8cb4d7;font-size:10px}.arena{position:relative;flex:1;min-height:0;overflow:hidden;background:#081525}canvas{width:100%;height:100%;display:block;touch-action:none}.topmsg{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#071327df;border:1px solid #23699c;border-radius:30px;padding:7px 13px;font-size:12px;color:#d9f2ff}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;background:#061326ef;border:1px solid #ffc857;border-radius:18px;text-align:center;font-weight:900;font-size:22px;display:none;pointer-events:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px calc(10px + env(safe-area-inset-bottom));background:#071326;border-top:1px solid #254766}.hint{font-size:12px;color:#9dc3e3;line-height:1.6}.actions{display:flex;gap:8px;align-items:center}.throw{background:linear-gradient(135deg,#0879c6,#004278);border:1px solid #39c9ff;min-width:105px}.throw:disabled{opacity:.4}.footer{font-size:10px;color:#597b9c;text-align:center;padding:4px;background:#050d19}@media(max-width:520px){header{height:60px;padding:6px 8px}.sub{display:none}.pill{padding:5px 6px;min-width:46px}.bottom{align-items:stretch;flex-direction:column;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.actions button{flex:1}.hint{text-align:center}.topmsg{top:7px;font-size:11px;padding:6px 10px}}
</style></head><body><div class="app"><header><div class="brand"><span class="ball">🎳</span><div>بولينج لَمّة<div class="sub">صالة التحدي • العب وارفع نتيجتك</div></div></div><div class="stats"><div class="pill"><small>النقاط</small><b id="score">0</b></div><div class="pill"><small>الرميات</small><b id="frame">1 / 10</b></div><button id="home" title="إعادة اللعبة">⌂</button></div></header><main class="arena"><canvas id="game"></canvas><div class="topmsg" id="msg">اسحب يمين أو شمال لتحديد اتجاه الكورة</div><div class="toast" id="toast"></div></main><div class="bottom"><div class="hint">🎯 اسحب على الملعب لتوجيه الرمية<br>💡 قرب من منتصف القوايم لفرصة سترايك!</div><div class="actions"><button id="restart">↻ لعبة جديدة</button><button class="throw" id="throw">🎳 ارمي الكورة</button></div></div><div class="footer">لعبة مستقلة • لا تستخدم عملات أو أرصدة حقيقية</div></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d',{alpha:false,desynchronized:true}),score=document.getElementById('score'),frameEl=document.getElementById('frame'),msg=document.getElementById('msg'),toast=document.getElementById('toast'),btn=document.getElementById('throw');let W=0,H=0,dpr=1,drawQueued=false,aim=0,rolling=false,anim=0,total=0,rolls=0,frame=1,remaining=10,pins=[],drag=false,lastX=0,finished=false;function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,window.innerWidth<700?1.25:1.6);W=r.width;H=r.height;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);x.setTransform(dpr,0,0,dpr,0,0);draw()}function scheduleDraw(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;draw()})}function setup(){pins=[];for(let row=0;row<4;row++)for(let col=0;col<=row;col++)pins.push({x:(col-row/2)*W*.064,y:H*.26+row*H*.043,alive:true})}function ui(){score.textContent=total;frameEl.textContent=finished?'خلصت':Math.min(frame,10)+' / 10';btn.disabled=rolling||finished}function draw(){if(!W||!H)return;x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07162c');g.addColorStop(.3,'#163657');g.addColorStop(.31,'#08111e');g.addColorStop(1,'#050a12');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#0c2038';x.fillRect(0,H*.13,W,H*.2);for(let a=W*.08;a<W;a+=W*.16){x.fillStyle='#1b9de0';x.shadowColor='#08aaff';x.shadowBlur=6;x.fillRect(a,H*.16,3,H*.14)}x.shadowBlur=0;x.textAlign='center';x.fillStyle='#ffc857';x.font='900 '+clamp(W*.07,22,40)+'px system-ui';x.fillText('لَمّة',W/2,H*.18);x.fillStyle='#b8d6ee';x.font='600 '+clamp(W*.025,10,14)+'px system-ui';x.fillText('B O W L I N G',W/2,H*.22);x.beginPath();x.moveTo(W*.39,H*.28);x.lineTo(W*.61,H*.28);x.lineTo(W*.96,H*1.03);x.lineTo(W*.04,H*1.03);x.closePath();let lane=x.createLinearGradient(0,H*.28,0,H);lane.addColorStop(0,'#b57942');lane.addColorStop(.45,'#e7b779');lane.addColorStop(1,'#8a4e27');x.fillStyle=lane;x.fill();x.strokeStyle='#28bfff';x.lineWidth=3;x.shadowColor='#00aaff';x.shadowBlur=7;x.beginPath();x.moveTo(W*.39,H*.28);x.lineTo(W*.04,H);x.moveTo(W*.61,H*.28);x.lineTo(W*.96,H);x.stroke();x.shadowBlur=0;for(let i=-5;i<=5;i++){x.strokeStyle=i%2?'#63391f55':'#ffe0a044';x.lineWidth=1;x.beginPath();x.moveTo(W/2+i*W*.012,H*.29);x.lineTo(W/2+i*W*.075,H);x.stroke()}pins.forEach(p=>{if(!p.alive)return;let px=W/2+p.x+aim*W*.18*(p.y/H),py=p.y,s=clamp(.38+p.y/H*.8,.45,1);x.save();x.translate(px,py);x.scale(s,s);x.shadowColor='#000';x.shadowBlur=2;x.fillStyle='#f5f8ff';x.beginPath();x.ellipse(0,0,8,14,0,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#e73543';x.fillRect(-6,-5,12,2.5);x.fillRect(-5,-1,10,2);x.restore()});if(!rolling&&!finished){x.strokeStyle='#4be1ffbb';x.setLineDash([5,7]);x.lineWidth=2;x.beginPath();x.moveTo(W/2+aim*W*.18,H*.91);x.lineTo(W/2+aim*W*.18,H*.37);x.stroke();x.setLineDash([])}let bx=W/2+aim*W*.18,by=H*.88;if(rolling){by=H*.88-anim*H*.57;bx+=W*.06*Math.sin(anim*Math.PI*.5)}let r=clamp(W*.045,15,26)*(rolling?1-anim*.45:1),bg=x.createRadialGradient(bx-r*.35,by-r*.4,2,bx,by,r);bg.addColorStop(0,'#76e4ff');bg.addColorStop(.28,'#087ac5');bg.addColorStop(.7,'#07396f');bg.addColorStop(1,'#020b1b');x.fillStyle=bg;x.shadowColor='#00aaff';x.shadowBlur=9;x.beginPath();x.arc(bx,by,Math.max(5,r),0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#020914';for(let [dx,dy] of [[-.32,-.25],[.2,-.32],[.28,.08]]){x.beginPath();x.ellipse(bx+dx*r,by+dy*r,r*.13,r*.17,-.3,0,Math.PI*2);x.fill()}}function reset(){aim=0;rolling=false;anim=0;total=0;rolls=0;frame=1;remaining=10;finished=false;setup();toast.style.display='none';ui();msg.textContent='اسحب يمين أو شمال لتحديد اتجاه الكورة';draw()}function roll(){if(rolling||finished)return;rolling=true;anim=0;ui();msg.textContent='الكورة في طريقها للقوايم...';let start=performance.now();function tick(now){anim=clamp((now-start)/1050,0,1);draw();if(anim<1){requestAnimationFrame(tick);return}rolling=false;let chance=Math.max(0,1-Math.abs(aim)*1.45),knocked=clamp(Math.round(Math.random()*4+chance*7),0,remaining);if(Math.abs(aim)>.88)knocked=Math.min(knocked,Math.floor(Math.random()*4));let alive=pins.filter(p=>p.alive);for(let i=0;i<Math.min(knocked,alive.length);i++)alive.splice(Math.floor(Math.random()*alive.length),1)[0].alive=false;remaining-=knocked;total+=knocked;rolls++;toast.textContent=knocked===10?'🔥 STRIKE! ضربة كاملة':knocked===0?'❌ ولا قُويمة!':'👏 وقّعت '+knocked+' قُويمة';toast.style.display='block';msg.textContent='وقّعت '+knocked+' قُويمة — وجّه الرمية الجاية';if(remaining<=0||rolls%2===0){frame++;remaining=10;setup();aim=0}if(frame>10){finished=true;toast.textContent='🏆 خلصت اللعبة! مجموعك '+total+' نقطة';msg.textContent='اضغط لعبة جديدة عشان تلعب تاني'}ui();draw();setTimeout(()=>{if(!finished)toast.style.display='none'},1400)}requestAnimationFrame(tick)}c.addEventListener('pointerdown',e=>{if(rolling||finished)return;drag=true;lastX=e.clientX;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag||rolling)return;aim=clamp(aim+(e.clientX-lastX)/(W*.75),-1,1);lastX=e.clientX;scheduleDraw()});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);btn.addEventListener('click',roll);document.getElementById('restart').addEventListener('click',reset);document.getElementById('home').addEventListener('click',reset);addEventListener('resize',resize);setup();resize();})();
</script></body></html>
