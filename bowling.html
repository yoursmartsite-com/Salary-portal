<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111f"><title>بولينج لَمّة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:system-ui,sans-serif}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0,#173d5d,#07111f 65%)}header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #2c5673;gap:8px}h1{font-size:20px;margin:0}small{color:#a6c6da}.stats{display:flex;gap:7px}.stat{background:#0a1e30;border:1px solid #2b5875;border-radius:10px;padding:5px 10px;text-align:center;min-width:58px}.stat b{display:block;color:#ffd16a;font-size:19px}main{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}.message{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#061525e8;border:1px solid #387ba1;border-radius:20px;padding:7px 12px;font-size:12px}.controls{display:flex;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#07111f;border-top:1px solid #25445c}button{flex:1;border:1px solid #3c9bca;border-radius:12px;padding:12px;background:linear-gradient(#12659a,#07395d);color:white;font-size:15px;font-weight:800}button.secondary{background:#102338;border-color:#34516b}button:disabled{opacity:.45}.result{position:absolute;display:none;top:43%;left:50%;transform:translate(-50%,-50%);padding:14px 18px;border-radius:14px;background:#061525f2;border:1px solid #ffd16a;text-align:center;font-weight:900;font-size:20px;pointer-events:none}@media(min-width:700px){#app{max-width:1000px;margin:auto;border-inline:1px solid #27435a}.controls{padding-inline:22%}} 
</style></head><body><div id="app"><header><div><h1>🎳 بولينج لَمّة</h1><small>وجّه الكورة ووقّع القوايم</small></div><div class="stats"><div class="stat"><small>النقاط</small><b id="score">0</b></div><div class="stat"><small>الرميات</small><b id="rollno">1</b></div></div></header><main><canvas id="c"></canvas><div class="message" id="msg">اسحب على الملعب لتحديد الاتجاه</div><div class="result" id="result"></div></main><div class="controls"><button class="secondary" id="reset">↻ لعبة جديدة</button><button id="throw">🎳 ارمي الكورة</button></div></div>
<script>
(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),rollEl=document.getElementById('rollno'),msg=document.getElementById('msg'),result=document.getElementById('result'),throwBtn=document.getElementById('throw');let w=0,h=0,dpr=1,aim=0,ball=null,pins=[],score=0,rolls=0,animating=false,done=false,drag=false,lastX=0,raf=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const r=c.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!animating)draw()}
function rack(){pins=[];const spacing=w*.047;for(let row=0;row<4;row++)for(let col=0;col<=row;col++)pins.push({x:(col-row/2)*spacing,y:h*.29+row*h*.042,alive:true,fall:0,dx:0})}
function reset(){score=0;rolls=0;aim=0;ball=null;animating=false;done=false;rack();result.style.display='none';msg.textContent='اسحب على الملعب لتحديد الاتجاه';ui();draw()}
function ui(){scoreEl.textContent=score;rollEl.textContent=done?'خلصت':String(rolls+1);throwBtn.disabled=animating||done}
function draw(){if(!w||!h)return;ctx.clearRect(0,0,w,h);let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#081a2b');bg.addColorStop(.3,'#173b55');bg.addColorStop(.31,'#081321');bg.addColorStop(1,'#020811');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
const top=h*.25;ctx.beginPath();ctx.moveTo(w*.405,top);ctx.lineTo(w*.595,top);ctx.lineTo(w*.97,h*1.04);ctx.lineTo(w*.03,h*1.04);ctx.closePath();let wood=ctx.createLinearGradient(0,top,0,h);wood.addColorStop(0,'#d6a36a');wood.addColorStop(.55,'#b87943');wood.addColorStop(1,'#70401f');ctx.fillStyle=wood;ctx.fill();ctx.strokeStyle='#4bcaff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w*.405,top);ctx.lineTo(w*.03,h);ctx.moveTo(w*.595,top);ctx.lineTo(w*.97,h);ctx.stroke();
for(let i=-4;i<=4;i++){ctx.strokeStyle='#fff2c42a';ctx.beginPath();ctx.moveTo(w/2+i*w*.012,top+5);ctx.lineTo(w/2+i*w*.07,h);ctx.stroke()}
ctx.textAlign='center';ctx.fillStyle='#ffd16a';ctx.font='900 '+clamp(w*.065,22,38)+'px system-ui';ctx.fillText('لَمّة',w/2,h*.12);
pins.forEach(p=>{if(!p.alive&&p.fall>=1)return;let scale=.4+p.y/h*.75,px=w/2+p.x+p.dx*p.fall,py=p.y+p.fall*12;ctx.save();ctx.translate(px,py);ctx.rotate(p.fall*p.dx*.6);ctx.scale(scale,scale);ctx.fillStyle='#f8fbff';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.beginPath();ctx.ellipse(0,0,7,13,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e53d50';ctx.fillRect(-5,-4,10,2);ctx.fillRect(-4,0,8,2);ctx.restore()});
if(ball){const bx=w/2+ball.x,by=ball.y,r=clamp(w*.043,14,24)*(1-ball.t*.25);ctx.save();const gr=ctx.createRadialGradient(bx-r*.35,by-r*.4,2,bx,by,r);gr.addColorStop(0,'#a4f1ff');gr.addColorStop(.3,'#168fd0');gr.addColorStop(.75,'#075087');gr.addColorStop(1,'#020a16');ctx.fillStyle=gr;ctx.shadowColor='#15bfff';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#03101c';[[-.3,-.25],[.2,-.3],[.25,.08]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(bx+dx*r,by+dy*r,r*.12,0,7);ctx.fill()});ctx.restore()}else if(!done){const bx=w/2+aim*w*.2,by=h*.88,r=clamp(w*.043,14,24);ctx.fillStyle='#168fd0';ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fill();ctx.fillStyle='#03101c';ctx.beginPath();ctx.arc(bx-r*.25,by-r*.25,3,0,7);ctx.fill();ctx.strokeStyle='#9beaff';ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(bx,by-r);ctx.lineTo(w/2+aim*w*.2,h*.38);ctx.stroke();ctx.setLineDash([])}
}
function throwBall(){if(animating||done)return;animating=true;ui();result.style.display='none';msg.textContent='الكورة بتتحرك...';ball={x:aim*w*.2,y:h*.88,t:0,startX:aim*w*.2};let start=performance.now();function tick(now){ball.t=clamp((now-start)/1250,0,1);ball.y=h*.88-ball.t*h*.58;ball.x=ball.startX*(1-ball.t)+ball.startX*.15*ball.t;draw();if(ball.t<1){raf=requestAnimationFrame(tick);return}finishThrow()}raf=requestAnimationFrame(tick)}
function finishThrow(){const bx=w/2+ball.x,hit=[];const radius=Math.max(12,w*.032);pins.filter(p=>p.alive).forEach(p=>{let px=w/2+p.x,dy=(h*.31-p.y)*.55;if(Math.hypot(bx-px,dy)<radius+(p.y/h)*9)hit.push(p)});let knocked=new Set(hit),front=[...hit];for(let d=0;d<3;d++){let next=[];front.forEach(a=>pins.filter(p=>p.alive&&!knocked.has(p)).forEach(b=>{if(Math.hypot(a.x-b.x,(a.y-b.y)*.7)<w*.075){knocked.add(b);next.push(b)}}));front=next}knocked.forEach(p=>{p.alive=false;p.fall=0;p.dx=(p.x-ball.x)>=0?1:-1});let n=knocked.size;score+=n;rolls++;ball=null;animating=false;let start=performance.now();function fallTick(now){let t=clamp((now-start)/360,0,1);pins.forEach(p=>{if(!p.alive)p.fall=Math.max(p.fall,t)});draw();if(t<1){requestAnimationFrame(fallTick);return}if(rolls>=10){done=true;msg.textContent='انتهت اللعبة';result.textContent='🏆 مجموعك '+score+' قُويمة';result.style.display='block'}else{msg.textContent=n?'وقّعت '+n+' قوايم — وجّه الرمية التالية':'مافيش إصابة، غيّر الاتجاه';result.textContent=n===10?'🔥 STRIKE!':n?'👏 '+n+' قوايم':'❌ MISS';result.style.display='block';setTimeout(()=>{if(!done)result.style.display='none'},900);if(rolls%2===0){pins.filter(p=>!p.alive).forEach(p=>p.fall=1);rack()}}ui();draw()}requestAnimationFrame(fallTick)}
c.addEventListener('pointerdown',e=>{if(animating||done)return;drag=true;lastX=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag||animating)return;aim=clamp(aim+(e.clientX-lastX)/(w*.7),-1,1);lastX=e.clientX;draw()});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);throwBtn.addEventListener('click',throwBall);document.getElementById('reset').addEventListener('click',reset);addEventListener('resize',()=>{resize();rack();draw()});resize();rack();draw();ui()})();
</script></body></html>
