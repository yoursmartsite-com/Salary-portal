<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b18">
<title>بروفايلي | لَمّة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b18;--panel:#101a30;--line:#263653;--muted:#9baac8;--purple:#713cff;--green:#35dfad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#202b58,transparent 55%),var(--bg);color:#f5f7ff;font:14px Cairo,Arial,sans-serif;min-height:100vh;padding:22px}
a{color:inherit;text-decoration:none}.wrap{max-width:980px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:24px;font-weight:900}.back{padding:9px 14px;background:#182642;border:1px solid var(--line);border-radius:10px}
.hero{background:linear-gradient(130deg,#172647,#10182d 65%,#24164c);border:1px solid #34466b;border-radius:22px;padding:26px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.avatar{width:112px;height:112px;border-radius:50%;border:3px solid #9a79ff;background:#0b1326;object-fit:cover;display:grid;place-items:center;font-size:42px;font-weight:900;color:#c8baff;overflow:hidden}
.identity{flex:1;min-width:220px}.identity h1{font-size:28px;margin:0 0 4px}.identity p{margin:3px 0;color:var(--muted);overflow-wrap:anywhere}.uid{font-size:11px;color:#8d9bbb}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:16px 0}.stat,.panel{background:linear-gradient(145deg,#111d34,#0b1325);border:1px solid var(--line);border-radius:16px;padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}
.panel h2{font-size:18px;margin:0 0 14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#bdc9df}.field input,.field textarea{width:100%;background:#070f20;border:1px solid #344563;color:white;border-radius:10px;padding:11px;font:inherit;outline:none}.field textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{padding:10px 17px;border:0;border-radius:10px;background:linear-gradient(110deg,#5526e8,#8242ff);color:white;font:700 13px Cairo;cursor:pointer}.btn.secondary{background:#1a2943;border:1px solid #344563}.msg{min-height:24px;color:var(--green);margin-top:9px}.danger{background:#421d32}
.bag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.bag-item{background:#0a1428;border:1px solid #30415f;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}.bag-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#f7e5b9,#b98737);color:#182238;font-size:27px;flex:0 0 52px}.bag-item b{display:block}.bag-item small{display:block;color:var(--muted)}.bag-item .btn{margin-top:8px;padding:7px 12px}.bag-item.equipped{border-color:#35dfad;box-shadow:0 0 0 1px #35dfad44}.bag-empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #344563;border-radius:12px}
@media(max-width:650px){body{padding:12px}.hero{padding:18px}.avatar{width:84px;height:84px}.identity h1{font-size:22px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.stat{padding:13px}.stat strong{font-size:21px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><a class="brand" href="./">♛ لَمّة</a><a class="back" href="./">← الرئيسية</a></header>
<section class="hero">
<div class="avatar" id="avatarView">ل</div>
<div class="identity"><h1 id="profileName">بروفايلي</h1><p id="profileEmail">جارٍ تحميل الحساب...</p><div class="uid" id="profileUid"></div><div class="actions" id="adminActions" hidden><a class="btn" href="admin.html" style="background:linear-gradient(110deg,#b87916,#f4cf69);color:#211707">♛ لوحة الإدارة</a></div></div>
</section>
<section class="grid">
<div class="stat"><small>رصيد عملات لَمّة</small><strong id="coinBalance">— LC</strong></div>
<div class="stat"><small>العناصر في مخزني</small><strong id="inventoryCount">—</strong></div>
<div class="stat"><small>تاريخ الانضمام</small><strong id="joinDate" style="font-size:16px">—</strong></div>
</section>
<section class="panel"><h2>شنطة مشترياتي</h2><p style="color:var(--muted);margin:-6px 0 14px">كل الحاجات اللي اشتريتها محفوظة في حسابك. اختار النرد اللي تحب تلعب بيه.</p><div id="bagItems" class="bag-grid"><div class="bag-empty">جاري تحميل الشنطة...</div></div><div class="msg" id="bagStatus" role="status"></div></section>
<section class="panel">
<h2>تعديل البروفايل</h2>
<form id="profileForm">
<div class="formgrid">
<div class="field"><label for="displayName">اسم اللاعب</label><input id="displayName" maxlength="24" required placeholder="اكتب اسمك في لَمّة"></div>
<div class="field"><label for="avatarUrl">رابط صورة شخصية (اختياري)</label><input id="avatarUrl" type="url" placeholder="https://..."></div>
<div class="field full"><label for="bio">نبذة عنك</label><textarea id="bio" maxlength="180" placeholder="اكتب نبذة قصيرة عنك..."></textarea></div>
</div>
<div class="actions"><button class="btn" id="saveBtn" type="submit">حفظ التعديلات</button><button class="btn secondary" type="button" id="logoutBtn">تسجيل الخروج</button></div>
<div class="msg" id="status" role="status"></div>
</form>
</section>
</main>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,onAuthStateChanged,updateProfile,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {getDatabase,ref,get,set,onValue} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);let currentUser=null;
const DICE_ITEMS={dice_gold:{name:"النرد الذهبي",icon:"✦"},dice_crystal:{name:"نرد الكريستال",icon:"💎"},dice_fire:{name:"نرد اللهب الأسطوري",icon:"🔥"},dice_lightning:{name:"نرد البرق",icon:"⚡"},dice_galaxy:{name:"نرد المجرة",icon:"🌌"}};
function showAvatar(url,name){const box=$("avatarView");if(url){box.innerHTML="";const img=document.createElement("img");img.src=url;img.alt="الصورة الشخصية";img.style.cssText="width:100%;height:100%;object-fit:cover";img.onerror=()=>{box.textContent=(name||"ل").charAt(0)};box.append(img)}else box.textContent=(name||"ل").trim().charAt(0).toUpperCase()}
function say(t,bad=false){$("status").textContent=t;$("status").style.color=bad?"#ff8da4":"#35dfad"}
function renderBag(items,equipped){const root=$("bagItems");const owned=Object.entries(DICE_ITEMS).filter(([id])=>Number(items?.[id]?.quantity||0)>0);if(!owned.length){root.innerHTML='<div class="bag-empty">شنطتك لسه فاضية من النرد المميز. مشترياتك هتظهر هنا تلقائيًا.</div>';return}root.replaceChildren();owned.forEach(([id,item])=>{const card=document.createElement("div");card.className="bag-item"+(equipped===id?" equipped":"");const icon=document.createElement("div");icon.className="bag-icon";icon.textContent=item.icon;const info=document.createElement("div");info.style.flex="1";const name=document.createElement("b");name.textContent=item.name;const qty=document.createElement("small");qty.textContent="الكمية: "+Number(items[id].quantity||0);const btn=document.createElement("button");btn.className="btn"+(equipped===id?" secondary":"");btn.textContent=equipped===id?"مستخدم حاليًا":"استخدام النرد";btn.disabled=equipped===id;btn.onclick=async()=>{btn.disabled=true;try{await set(ref(db,"profiles/"+currentUser.uid+"/diceSkin"),id);renderBag(items,id);$("bagStatus").textContent="تم اختيار "+item.name+" بنجاح."; }catch(e){btn.disabled=false;$("bagStatus").textContent="فشل تغيير النرد: "+e.message;}};info.append(name,qty,btn);card.append(icon,info);root.append(card);});}
(async()=>{
 try{
  await setPersistence(auth,browserLocalPersistence);
  if(auth.authStateReady) await auth.authStateReady();
 }catch(e){say("تعذر استعادة جلسة الدخول: "+e.message,true);return;}
 onAuthStateChanged(auth,async user=>{
  if(!user||user.isAnonymous){
   $("profileEmail").textContent="مش مسجل دخول على الحساب ده. ارجع للرئيسية وسجّل دخولك بنفس الإيميل.";
   say("جلسة الحساب مش موجودة على المتصفح الحالي.",true);
   return;
  }
  currentUser=user;$("profileEmail").textContent=user.email||"";$("profileUid").textContent="معرّف اللاعب: "+user.uid;$("adminActions").hidden=!(user.uid==="91N0rI5SCDN1aKBXJkowj5KcUOz1"&&user.email==="admin@lamma.com");
  const fallbackName=user.displayName||user.email?.split("@")[0]||"لاعب";
  let profile={};
  try{const snap=await get(ref(db,"profiles/"+user.uid));profile=snap.val()||{};}catch(e){say("تعذر تحميل بيانات البروفايل: "+e.message,true)}
  $("profileName").textContent=profile.displayName||fallbackName;$("displayName").value=profile.displayName||fallbackName;$("bio").value=profile.bio||"";$("avatarUrl").value=profile.avatarUrl||"";showAvatar(profile.avatarUrl||user.photoURL,profile.displayName||fallbackName);
  $("joinDate").textContent=profile.createdAt?new Date(profile.createdAt).toLocaleDateString("ar-EG"):(user.metadata.creationTime?new Date(user.metadata.creationTime).toLocaleDateString("ar-EG"):"—");
  try{const [walletSnap,inventorySnap]=await Promise.all([get(ref(db,"wallets/"+user.uid+"/balance")),get(ref(db,"inventory/"+user.uid+"/items"))]);$("coinBalance").textContent=(Number(walletSnap.val())||0)+" LC";const items=inventorySnap.val()||{};const total=Object.values(items).reduce((n,v)=>n+Math.max(0,Number(v?.quantity)||0),0);$("inventoryCount").textContent=String(total);renderBag(items,profile.diceSkin||"classic");}catch(e){$("coinBalance").textContent="— LC";$("inventoryCount").textContent="—";$("bagItems").textContent="تعذر تحميل الشنطة: "+e.message}
 });
})();
$("avatarUrl").addEventListener("input",()=>showAvatar($("avatarUrl").value,$("displayName").value));
$("displayName").addEventListener("input",()=>{$("profileName").textContent=$("displayName").value||"بروفايلي";if(!$("avatarUrl").value)showAvatar("",$("displayName").value)});
$("profileForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!currentUser)return;
 const displayName=$("displayName").value.trim().slice(0,24),bio=$("bio").value.trim().slice(0,180),avatarUrl=$("avatarUrl").value.trim();
 if(!displayName){say("اكتب اسم اللاعب الأول.",true);return}
 $("saveBtn").disabled=true;$("saveBtn").textContent="بيحفظ...";
 try{
  await updateProfile(currentUser,{displayName,photoURL:avatarUrl||null});
  const old=await get(ref(db,"profiles/"+currentUser.uid));const oldData=old.val()||{};
  await set(ref(db,"profiles/"+currentUser.uid),{...oldData,uid:currentUser.uid,email:currentUser.email||"",displayName,bio,avatarUrl,createdAt:oldData.createdAt||Date.now(),updatedAt:Date.now()});
  await set(ref(db,"userDirectory/"+currentUser.uid),{uid:currentUser.uid,name:displayName,email:currentUser.email||"",createdAt:oldData.createdAt||Date.now(),lastSeen:Date.now()});
  $("profileName").textContent=displayName;showAvatar(avatarUrl,displayName);say("تم حفظ البروفايل بنجاح.");
 }catch(err){say("فشل الحفظ: "+err.message,true)}
 finally{$("saveBtn").disabled=false;$("saveBtn").textContent="حفظ التعديلات"}
});
$("logoutBtn").addEventListener("click",async()=>{await signOut(auth);location.replace("./")});
</script></body></html>
