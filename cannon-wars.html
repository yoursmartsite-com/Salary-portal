<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>حرب المدافع | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;text-align:center}header{padding:12px;background:#0b2034;border-bottom:1px solid #246080;display:flex;justify-content:space-between;align-items:center}h2{font-size:19px;margin:0}button{border:1px solid #46b8e8;background:#07517b;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;touch-action:manipulation}main{max-width:900px;margin:auto;padding:10px}canvas{width:100%;height:min(65vh,540px);display:block;background:#0c2235;border:1px solid #2d5976;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}.hint{color:#a6c6da;font-size:13px;padding:4px}button:active{transform:scale(.98)}</style><header><h2>حرب المدافع</h2><button onclick="location.href='/'">لَمّة ⌂</button></header><main><div class="hint">اختار زاوية وقوة الضربة ثم اضرب الهدف. غيّر القيم بعد كل محاولة.</div><canvas id="c" width="800" height="520"></canvas><div class="controls">زاوية <input id="ang" type="range" min="15" max="75" value="45"> قوة <input id="pow" type="range" min="10" max="30" value="22"><button onclick="shoot()">اضرب!</button><button onclick="reset()">إعادة</button></div><div id="status" class="hint">ابدأ اللعب!</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let target=650,shots=0,ball=null;function draw(){x.fillStyle='#9bd8f4';x.fillRect(0,0,800,520);x.fillStyle='#438b49';x.fillRect(0,450,800,70);x.fillStyle='#445b73';x.fillRect(70,410,70,40);x.fillStyle='#e65a4d';x.fillRect(target-18,410,36,40);x.fillStyle='#172a3a';x.fillRect(75,390,55,20);if(ball){x.fillStyle='#202d3b';x.beginPath();x.arc(ball.x,ball.y,10,0,7);x.fill()}}function shoot(){if(ball)return;let a=+document.querySelector('#ang').value*Math.PI/180,v=+document.querySelector('#pow').value;ball={x:130,y:400,vx:v*Math.cos(a),vy:-v*Math.sin(a)};let id=setInterval(()=>{if(!ball){clearInterval(id);return}ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=.45;if(ball.x>target-25&&ball.x<target+25&&ball.y>380){target=250+Math.random()*500;s.textContent='🎯 إصابة! الهدف اتحرك';ball=null;shots++;clearInterval(id)}else if(ball.y>450||ball.x>800){ball=null;shots++;s.textContent='الضربة فاتت! جرّب زاوية مختلفة'}draw();if(!ball)draw()},30)}function reset(){target=650;shots=0;ball=null;s.textContent='صوّب على الهدف';draw()}draw();</script></html>
