<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ضربات الحسم | لمة</title><style>body{background:#07120f;color:#eff;font-family:Arial;text-align:center;padding:20px}.box{max-width:700px;margin:auto;background:#10271f;padding:24px;border-radius:20px}button{padding:14px;margin:5px;border-radius:12px;background:#65ffc0;border:0;font-weight:bold}</style><div class="box"><h1>ضربات الحسم ⚽</h1><p>لعبة تحدي بين لاعبين: اختار مكان التسديد، والحارس يحاول يتصدى.</p><a href="./betting.html">رجوع لغرفة الرهانات</a><h2 id="status">ابدأ المواجهة</h2><button onclick="play('شمال')">شمال</button><button onclick="play('وسط')">وسط</button><button onclick="play('يمين')">يمين</button><script>function play(x){let y=['شمال','وسط','يمين'][Math.floor(Math.random()*3)];document.getElementById('status').textContent=x===y?'الحارس صدها! اختار تاني':'جووول! الحارس راح '+y;}</script></div></html>
