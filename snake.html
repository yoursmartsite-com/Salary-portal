<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090e1d"><title>ثعبان النيون | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#090e1d;color:#f5f7ff;font-family:system-ui,Arial;text-align:center;padding:12px}a{color:#b9adff;text-decoration:none;font-weight:800}.wrap{max-width:560px;margin:auto}h1{margin:10px 0}p{color:#aab5ce}.hud{display:flex;justify-content:center;gap:12px}.stat{padding:8px 18px;background:#151f35;border:1px solid #303e5e;border-radius:12px}canvas{width:min(92vw,440px);height:min(92vw,440px);display:block;margin:14px auto;border:1px solid #364767;border-radius:14px;background:#0d1729;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;direction:ltr}.controls button,.main{border:1px solid #3b4a6c;border-radius:12px;background:#202d49;color:white;padding:13px;font-size:18px;font-weight:900}.main{font-size:15px;margin:12px}button:active{transform:scale(.96)}.hint{font-size:12px}</style></head><body><div class="wrap"><header><a href="./games.html">← مكتبة الألعاب</a></header><h1>🐍 ثعبان النيون</h1><p>اجمع النقاط من غير ما تخبط في الحيط أو في نفسك.</p><div class="hud"><div class="stat">النقاط <b id="score">0</b></div><div class="stat">الأفضل <b id="best">0</b></div></div><canvas id="c" width="400" height="400"></canvas><button class="main" id="start">ابدأ / العب تاني</button><div class="controls"><span></span><button data-d="up">▲</button><span></span><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><p class="hint">على الموبايل استخدم الأسهم أو اسحب على لوحة اللعب. على الكمبيوتر استخدم الأسهم.</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20;let snake,food,dir,next,score=0,running=false,timer=null;const bestKey='lammaSnakeBest';document.getElementById('best').textContent=localStorage.getItem(bestKey)||0;function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};next=dir;score=0;food=spawn();running=true;document.getElementById('score').textContent=score;clearInterval(timer);timer=setInterval(tick,125);draw()}function spawn(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake&&snake.some(a=>a.x===p.x&&a.y===p.y));return p}function change(d){const ds={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};let v=ds[d];if(v&&!(v.x===-dir.x&&v.y===-dir.y))next=v}function tick(){if(!running)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(a=>a.x===h.x&&a.y===h.y)){running=false;clearInterval(timer);draw();x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='center';x.fillText('انتهت اللعبة! اضغط ابدأ',200,205);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;document.getElementById('score').textContent=score;let b=+(localStorage.getItem(bestKey)||0);if(score>b){localStorage.setItem(bestKey,score);document.getElementById('best').textContent=score}food=spawn()}else snake.pop();draw()}function draw(){x.clearRect(0,0,400,400);x.strokeStyle='#1b2a43';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,400);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(400,i*S);x.stroke()}x.fillStyle='#ff6c9d';x.beginPath();x.arc(food.x*S+10,food.y*S+10,7,0,Math.PI*2);x.fill();snake?.forEach((a,i)=>{x.fillStyle=i?'#42d7a1':'#a99aff';x.beginPath();x.roundRect(a.x*S+2,a.y*S+2,16,16,5);x.fill()})}document.getElementById('start').onclick=reset;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>change(b.dataset.d));document.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]){e.preventDefault();change(m[e.key])}});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>12)change(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});draw();</script></body></html>
