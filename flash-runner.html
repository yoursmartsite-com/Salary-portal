<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>مغامرات الرجل السريع | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;text-align:center}header{padding:12px;background:#0b2034;border-bottom:1px solid #246080;display:flex;justify-content:space-between;align-items:center}h2{font-size:19px;margin:0}button{border:1px solid #46b8e8;background:#07517b;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;touch-action:manipulation}main{max-width:900px;margin:auto;padding:10px}canvas{width:100%;height:min(65vh,540px);display:block;background:#0c2235;border:1px solid #2d5976;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}.hint{color:#a6c6da;font-size:13px;padding:4px}button:active{transform:scale(.98)}</style><header><h2>مغامرات الرجل السريع</h2><button onclick="location.href='/'">لَمّة ⌂</button></header><main><div class="hint">اضغط اقفز لتعدّي الحواجز واجمع النقاط.</div><canvas id="c" width="800" height="520"></canvas><div class="controls"><button onclick="jump()">اقفز ⤴</button><button onclick="reset()">إعادة اللعبة</button></div><div id="status" class="hint">ابدأ اللعب!</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let y=420,vy=0,obs=[],score=0,over=false,last=0;function reset(){y=420;vy=0;obs=[];score=0;over=false;last=0;requestAnimationFrame(loop)}function jump(){if(y>=419&&!over)vy=-17;if(over)reset()}function loop(t){if(over)return;x.fillStyle='#7ed7f4';x.fillRect(0,0,800,520);x.fillStyle='#248b56';x.fillRect(0,450,800,70);if(t-last>1050){obs.push({x:820,w:25+Math.random()*25,h:35+Math.random()*45});last=t}vy+=.8;y+=vy;if(y>420){y=420;vy=0}x.fillStyle='#ff9d36';x.fillRect(100,y-40,30,40);x.fillStyle='#12334b';x.fillRect(106,y-31,6,6);obs.forEach(o=>{o.x-=6;x.fillStyle='#d64a4a';x.fillRect(o.x,450-o.h,o.w,o.h);if(o.x<130&&o.x+o.w>95&&y>410-o.h){over=true;s.textContent='انتهت الجولة! نتيجتك '+score+' — اضغط اقفز لإعادة اللعب'}});obs=obs.filter(o=>o.x>-60);score++;s.textContent='النقاط: '+score;if(!over)requestAnimationFrame(loop)}c.addEventListener('pointerdown',jump);document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump()});reset();</script></html>
