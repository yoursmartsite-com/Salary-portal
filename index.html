<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourSmartSite - لعبة إكس أو الأونلاين</title>
  <!-- مكتبة الاتصال السريعة -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --x-color: #ef4444;
      --o-color: #22c55e;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { color: var(--accent); margin-bottom: 10px; font-size: 1.6rem; }
    
    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; text-align: center; margin-bottom: 15px; }
    
    input, button { padding: 12px; border-radius: 8px; border: none; font-size: 1rem; width: 100%; margin-top: 8px; outline: none; }
    input { background: #0f172a; color: #fff; border: 1px solid #475569; text-align: center; }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }

    /* شبكة لعبة X - O */
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; margin: 20px auto; }
    .cell { background: #0f172a; border: 2px solid #334155; border-radius: 10px; height: 90px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; user-select: none; }
    .cell.X { color: var(--x-color); }
    .cell.O { color: var(--o-color); }

    /* الشات */
    #chat-box { background: #0f172a; height: 120px; overflow-y: auto; padding: 10px; border-radius: 8px; text-align: right; font-size: 0.9rem; border: 1px solid #334155; margin-bottom: 8px; }
    .chat-row { display: flex; gap: 5px; }
  </style>
</head>
<body>

  <h1>🎮 لعبة إكس - أو الجماعية</h1>

  <!-- شاشة الدخول -->
  <div class="card" id="login-card">
    <p style="margin-bottom: 10px; color: #94a3b8;">ادخل اسمك ورقم الغرفة لتلعب مع صاحبك:</p>
    <input type="text" id="username" placeholder="اسمك (مثلاً: إبراهيم)">
    <input type="text" id="room-id" placeholder="رقم الغرفة (مثلاً: 100)">
    <button onclick="joinGame()">دخول اللعبة 🚀</button>
  </div>

  <!-- ساحة اللعب -->
  <div class="card" id="game-card" style="display: none;">
    <h3 id="room-info" style="color: var(--accent);"></h3>
    <p id="turn-info" style="margin-top: 5px; color: #94a3b8;">دور اللعب الآن...</p>

    <!-- الشبكة الظاهرة -->
    <div class="board" id="board">
      <div class="cell" onclick="playMove(0)"></div>
      <div class="cell" onclick="playMove(1)"></div>
      <div class="cell" onclick="playMove(2)"></div>
      <div class="cell" onclick="playMove(3)"></div>
      <div class="cell" onclick="playMove(4)"></div>
      <div class="cell" onclick="playMove(5)"></div>
      <div class="cell" onclick="playMove(6)"></div>
      <div class="cell" onclick="playMove(7)"></div>
      <div class="cell" onclick="playMove(8)"></div>
    </div>

    <button onclick="resetBoard()" style="background: #ef4444; color: #fff; margin-bottom: 15px;">إعادة اللعبة 🔄</button>

    <!-- الشات -->
    <div id="chat-box"></div>
    <div class="chat-row">
      <input type="text" id="chat-input" placeholder="اكتب رسالة..." style="margin-top:0;">
      <button onclick="sendMsg()" style="width: 30%; margin-top:0;">إرسال</button>
    </div>
  </div>

  <script>
    // ربط بخدمة Supabase المجانية والسريعة
    const SUPABASE_URL = "https://xyzcompany.supabase.co"; // مفتاح تجريبي سريع
    const SUPABASE_KEY = "public-anon-key";
    
    let boardState = Array(9).fill("");
    let currentTurn = "X";
    let myName = "";
    let roomNum = "";

    function joinGame() {
      myName = document.getElementById('username').value.trim();
      roomNum = document.getElementById('room-id').value.trim();

      if(!myName || !roomNum) {
        alert("من فضلك اكتب اسمك ورقم الغرفة!");
        return;
      }

      document.getElementById('login-card').style.display = 'none';
      document.getElementById('game-card').style.display = 'block';
      document.getElementById('room-info').innerText = "غرفة رقم: " + roomNum;

      renderBoard();
    }

    function renderBoard() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((cell, idx) => {
        cell.innerText = boardState[idx];
        cell.className = 'cell ' + boardState[idx];
      });
      document.getElementById('turn-info').innerText = "الدور الحالي لـ: " + currentTurn;
    }

    function playMove(idx) {
      if(boardState[idx] !== "") return;
      
      boardState[idx] = currentTurn;
      currentTurn = currentTurn === "X" ? "O" : "X";
      renderBoard();
      
      checkWinner();
    }

    function resetBoard() {
      boardState = Array(9).fill("");
      currentTurn = "X";
      renderBoard();
    }

    function checkWinner() {
      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for(let w of wins) {
        if(boardState[w[0]] && boardState[w[0]] === boardState[w[1]] && boardState[w[0]] === boardState[w[2]]) {
          alert("🎉 الفائز هو: " + boardState[w[0]]);
          return;
        }
      }
    }

    function sendMsg() {
      const input = document.getElementById('chat-input');
      if(!input.value.trim()) return;
      
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div><b>${myName}:</b> ${input.value}</div>`;
      box.scrollTop = box.scrollHeight;
      input.value = "";
    }
  </script>
</body>
</html>
