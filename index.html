<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YourSmartSite - منصة الأدوات والروشتات الطبية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
        }

        /* أنماط الروشتات المختلفة */
        .prescription-paper {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* نمط 1: مستشفى أمان (مطابق للصورة) */
        .style-aman {
            background: #f7f7f9;
            color: #1e293b;
            font-family: 'Cairo', sans-serif;
        }

        /* نمط 2: كلاسيكي بسيط (رسمي) */
        .style-classic {
            background: #ffffff;
            color: #000000;
            font-family: 'Serif', Georgia, 'Times New Roman', serif;
        }

        /* نمط 3: حديث (بسيط جداً) */
        .style-modern {
            background: #ffffff;
            color: #1e293b;
            font-family: 'Sans-Serif', Helvetica, Arial, sans-serif;
        }

        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .prescription-paper { box-shadow: none !important; width: 100% !important; margin: 0 !important; }
            header, footer, .fixed { display: none !important; }
            input, textarea { border: none !important; background: transparent !important; resize: none; box-shadow: none !important; }
            .style-aman, .style-classic, .style-modern { background: white !important; color: black !important; }
            .style-aman .border-blue-900 { border-color: black !important; }
            .style-aman .text-blue-900 { color: black !important; }
            .style-aman .border-red-600, .style-aman .text-red-600 { border-color: black !important; color: black !important; }
            .style-aman .bg-blue-900 { background: transparent !important; color: black !important; border: 1px solid black !important;}
            .style-aman .opacity-85 { opacity: 1 !important; }
            .prescription-paper textarea.border-dashed { border-color: black !important; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- خلفية مضيئة متحرّكة -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10 no-print">
        <div class="absolute -top-48 -left-48 w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-[140px] animate-pulse"></div>
        <div class="absolute top-1/3 -right-48 w-[500px] h-[500px] bg-blue-600/15 rounded-full blur-[140px] animate-pulse" style="animation-duration: 5s;"></div>
    </div>

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl sticky top-0 z-50 transition-all duration-300 no-print">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse group cursor-pointer" onclick="switchTab('tools')">
                <div id="siteLogoBox" class="bg-indigo-600 text-white p-2.5 rounded-xl font-black text-xl shadow-lg shadow-indigo-600/30 group-hover:scale-110 transition duration-300">YS</div>
                <span id="siteBrandName" class="text-2xl font-black tracking-wide bg-gradient-to-r from-indigo-400 via-blue-300 to-indigo-500 bg-clip-text text-transparent">YourSmartSite</span>
            </div>
            
            <nav id="mainNav" class="hidden md:flex space-x-2 space-x-reverse text-sm text-slate-300 items-center bg-slate-950/60 p-1.5 rounded-2xl border border-slate-800/60 shadow-inner">
                <button onclick="switchTab('tools')" class="px-3.5 py-2 rounded-xl hover:text-white hover:bg-indigo-600/20 transition font-medium">الأدوات الذكية</button>
                <button onclick="switchTab('prescription')" class="px-3.5 py-2 rounded-xl hover:text-white hover:bg-blue-600/20 transition font-bold text-blue-400">📄 كتابة روشتة</button>
                <button onclick="switchTab('webservice')" class="px-3.5 py-2 rounded-xl hover:text-white hover:bg-blue-600/20 transition font-medium">تصميم المواقع</button>
                <button onclick="switchTab('features')" class="px-3.5 py-2 rounded-xl hover:text-white hover:bg-indigo-600/20 transition font-medium">المميزات</button>
                <button onclick="switchTab('auth')" class="px-3.5 py-2 rounded-xl hover:text-white hover:bg-indigo-600/20 transition font-medium flex items-center gap-1.5">
                    <span id="navAuthLabel">حسابي / بياناتي</span>
                </button>
                <button onclick="switchTab('admin')" class="hover:text-amber-300 transition font-medium text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl bg-amber-500/10 shadow-sm hover:bg-amber-500/20">⚙️ المسؤول</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full animate-fade-in">
        
        <!-- محتوى المنصة (تم تجاوز شاشة القفل الإجباري لتظهر لك الخيارات) -->
        <div id="protectedPlatformContent" class="space-y-12">

            <!-- 1. قسم الأدوات والتحويل -->
            <section id="toolsSection" class="tab-content space-y-8">
                <!-- البانر الترويجي -->
                <div class="relative rounded-3xl overflow-hidden shadow-2xl bg-slate-900 border border-blue-500/30 group transition-all duration-500 hover:border-blue-500/60">
                    <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://i.ibb.co/gL4SPgnT/image.png');"></div>
                    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-[2px]"></div>
                    <div class="relative z-10 p-8 md:p-12 text-center">
                        <span class="bg-blue-500/20 text-blue-300 border border-blue-500/30 text-xs font-bold px-3.5 py-1.5 rounded-full uppercase tracking-wider inline-block mb-3 shadow-sm animate-pulse">
                            منصة رقمية متكاملة
                        </span>
                        <h1 id="mainHeading" class="text-3xl md:text-5xl font-black mb-3 tracking-tight bg-gradient-to-r from-white via-blue-100 to-blue-300 bg-clip-text text-transparent">منصة أدواتك الذكية الشاملة</h1>
                    </div>
                </div>

                <div class="glass-card rounded-2xl p-6 md:p-8 transition-all duration-300">
                    <label class="block text-sm font-semibold text-slate-300 mb-4">اختر الأداة المطلوبة:</label>
                    <select id="conversionType" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition shadow-inner cursor-pointer">
                    </select>
                    <button type="button" id="convertBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-600/30">
                        تشغيل الأداة والمعالجة الفورية
                    </button>
                </div>
            </section>

            <!-- 2. قسم الروشتة الشامل (تم إضافة خيار الأنماط هنا) -->
            <section id="prescriptionSection" class="tab-content hidden space-y-6">
                <!-- شريط أدوات الروشتة -->
                <div class="glass-card p-4 rounded-2xl no-print flex flex-col md:flex-row gap-4 justify-between items-center sticky top-24 z-40 border border-blue-500/40">
                    <div>
                        <h2 class="text-xl font-black text-blue-400">كتابة وطباعة الروشتة الطبية</h2>
                        <p class="text-slate-300 text-xs">اختر النمط، املأ البيانات، ثم اطبعها.</p>
                    </div>
                    
                    <div class="flex items-center gap-3 bg-slate-900 p-2 rounded-xl border border-slate-700">
                        <label class="text-xs font-bold text-slate-400 pr-2">النمط:</label>
                        <select id="styleSelector" onchange="changePrescriptionStyle()" class="bg-slate-800 text-sm text-white px-3 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-400 cursor-pointer">
                            <option value="style-aman">📄 مستشفى أمان (النمط المطابق)</option>
                            <option value="style-classic">📑 كلاسيكي (رسمي)</option>
                            <option value="style-modern">📰 حديث (بسيط)</option>
                        </select>
                    </div>

                    <button type="button" onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-lg flex items-center gap-2">
                        <span>🖨️</span> طباعة الروشتة
                    </button>
                </div>

                <!-- حاوية الروشتة (تتغير بناءً على النمط المختار) -->
                <div id="prescriptionContainer" class="prescription-paper p-8 flex flex-col justify-between rounded-xl style-aman animate-fade-in border-2 border-slate-300">
                    
                    <!-- سيتم حقن محتوى الروشتة هنا بواسطة جافاسكريبت بناءً على النمط -->
                    <div id="prescriptionContentArea">
                        <!-- المحتوى الافتراضي (نمط أمان) -->
                        <div id="amanTemplate" class="style-aman-template">
                            <!-- رأس الروشتة -->
                            <div class="flex justify-between items-start border-b-2 border-red-600 pb-3 mb-6 relative">
                                <div class="flex items-center">
                                    <div class="w-20 h-20 rounded-full border-4 border-blue-900 flex flex-col items-center justify-center relative bg-white shadow-md">
                                        <span class="text-blue-900 font-black text-xs">مستشفى</span>
                                        <span class="text-blue-900 font-black text-lg -mt-1">أمان</span>
                                        <div class="absolute top-2 right-3 w-3 h-3 bg-red-600 rounded-full"></div>
                                    </div>
                                </div>
                                <div class="text-left">
                                    <div class="bg-blue-900 text-white px-8 py-2 rounded-l-full rounded-r-xl inline-block text-2xl font-black tracking-wider shadow">
                                        مستشفى أمان
                                    </div>
                                    <div class="text-red-600 font-black tracking-[0.25em] text-base mt-1.5 mr-1">
                                        A MAN HOSPITAL
                                    </div>
                                </div>
                            </div>

                            <!-- حقول البيانات -->
                            <div class="grid grid-cols-2 gap-4 text-sm font-bold text-slate-900 mb-6">
                                <div class="space-y-3">
                                    <div class="flex items-center gap-2">
                                        <span class="w-28 text-slate-800 font-bold">الطبيب المعالج :</span>
                                        <input type="text" placeholder="اكتب اسم الطبيب..." class="border-b border-dotted border-slate-500 bg-transparent flex-grow px-2 py-1 text-blue-900 font-bold focus:outline-none focus:border-blue-600">
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="w-28 text-slate-800 font-bold">اسم المريض :</span>
                                        <input type="text" placeholder="اكتب اسم المريض..." class="border-b border-dotted border-slate-500 bg-transparent flex-grow px
