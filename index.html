<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourSmartSite - ألعاب السيرفر السريع</title>
  <!-- استدعاء فايربيس السريع -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 15px; text-align: center; }
    h1 { color: var(--accent); margin-bottom: 15px; font-size: 1.5rem; }
    .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; }
    input, button { padding: 10px; border-radius: 8px; border: none; font-size: 1rem; margin: 5px; }
    input { background: #0f172a; color: #fff; border: 1px solid #475569; width: 70%; text-align: center; }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
    
    /* Tic Tac Toe */
    .ttt-board { display: grid; grid-template-columns: repeat(3, 80px); gap: 8px; justify-content: center; margin: 15px auto; }
    .ttt-cell { width: 80px; height: 80px; background: #0f172a; font-size: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; color: var(--accent); font-weight: bold; }

    /* Chat */
    #chat-box { background: #0f172a; height: 100px; overflow-y: auto; padding: 8px; border-radius: 6px; text-align: right; margin-top: 10px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <h1>🎮 صالة الألعاب السريعة</h1>

  <!-- تسجيل الدخول للغرفة -->
  <div class="card" id="login-card">
    <p>اختر اسماً لك ورقم الغرفة لتلعب مع أصحابك فوراً:</p>
    <input type="text" id="username" placeholder="اسمك (مثلاً: إبراهيم)"><br>
    <input type="text" id="room-id" placeholder="رقم الغرفة (مثلاً: 777)"><br>
    <button onclick="joinRoom()" style="width: 80%;">دخول اللعبة 🚀</button>
  </div>

  <!-- ساحة الألعاب (تظهر بعد الدخول) -->
  <div class="card" id="game-arena" style="display:none;">
    <h2 id="room-title" style="color:var(--accent); margin-bottom: 10px;"></h2>
    
    <p>لعبة إكس - أو التشاركية (تحدث لحظياً):</p>
    <div class="ttt-board" id="ttt-board"></div>
    <button onclick="resetGame()" style="background:#ef4444; color:#fff;">إعادة اللعبة</button>

    <!-- شات الغرفة -->
    <div id="chat-box"></div>
    <div style="display:flex; margin-top:8px;">
      <input type="text" id="chat-input" placeholder="اكتب رسالة..." style="width:75%;">
      <button onclick="sendChat()" style="width:25%;">إرسال</button>
    </div>
  </div>

  <script>
    // إعدادات اتصال سريعة مجانية
    const firebaseConfig = {
      databaseURL: "https://yoursmartsite-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let myName = "";
    let roomNum = "";
    let boardState = Array(9).fill("");

    function joinRoom() {
      myName = document.getElementById('username').value;
      roomNum = document.getElementById('room-id').value;

      if(!myName || !roomNum) {
        alert("من فضلك اكتب اسمك ورقم الغرفة!");
        return;
      }

      document.getElementById('login-card').style.display = 'none';
      document.getElementById('game-arena').style.display = 'block';
      document.getElementById('room-title').innerText = "غرفة رقم: " + roomNum;

      initGameListeners();
    }

    function initGameListeners() {
      // مراقبة تحديثات اللعبة على السيرفر
      db.ref('rooms/' + roomNum).on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
          if(data.board) {
            boardState = data.board;
            renderBoard();
          }
          if(data.chat) {
            updateChat(data.chat);
          }
        }
      });
    }

    function renderBoard() {
      const board = document.getElementById('ttt-board');
      board.innerHTML = '';
      boardState.forEach((val, idx) => {
        const cell = document.createElement('div');
        cell.className = 'ttt-cell';
        cell.innerText = val;
        cell.onclick = () => makeMove(idx);
        board.appendChild(cell);
      });
    }

    function makeMove(idx) {
      if(boardState[idx] !== "") return;
      boardState[idx] = "X"; // أو توزيع الأدوار
      db.ref('rooms/' + roomNum).update({ board: boardState });
    }

    function resetGame() {
      boardState = Array(9).fill("");
      db.ref('rooms/' + roomNum).update({ board: boardState });
    }

    function sendChat() {
      const text = document.getElementById('chat-input').value;
      if(!text) return;
      const msgData = { sender: myName, text: text };
      
      db.ref('rooms/' + roomNum + '/chat').push(msgData);
      document.getElementById('chat-input').value = '';
    }

    function updateChat(chatObj) {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      Object.values(chatObj).forEach(msg => {
        box.innerHTML += `<div><b>${msg.sender}:</b> ${msg.text}</div>`;
      });
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
