<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourSmartSite - تحدي X-O</title>
  <!-- استدعاء Firebase المجاني السريع جداً -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --x-color: #ef4444;
      --o-color: #22c55e;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { color: var(--accent); margin-bottom: 15px; font-size: 1.5rem; text-align: center; }
    
    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; text-align: center; margin-bottom: 15px; }
    
    input, button { padding: 12px; border-radius: 8px; border: none; font-size: 1rem; width: 100%; margin-top: 10px; outline: none; }
    input { background: #0f172a; color: #fff; border: 1px solid #475569; text-align: center; }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }

    .status-badge { background: #334155; padding: 8px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 10px; color: var(--accent); }

    /* شبكة لعبة X - O */
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 280px; margin: 15px auto; }
    .cell { background: #0f172a; border: 2px solid #334155; border-radius: 10px; height: 85px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; }
    .cell.X { color: var(--x-color); }
    .cell.O { color: var(--o-color); }

    #chat-box { background: #0f172a; height: 100px; overflow-y: auto; padding: 8px; border-radius: 8px; text-align: right; font-size: 0.85rem; border: 1px solid #334155; margin-bottom: 8px; }
    .chat-row { display: flex; gap: 5px; }
  </style>
</head>
<body>

  <h1>🎮 صالة التحدي الفوري</h1>

  <!-- شاشة الدخول -->
  <div class="card" id="login-card">
    <p style="color: #94a3b8; margin-bottom: 5px;">اكتب اسمك ورقم الغرفة واتفق عليه انت وصاحبك:</p>
    <input type="text" id="username" placeholder="اسمك (مثلاً: إبراهيم)">
    <input type="text" id="room-name" placeholder="اسم أو رقم الغرفة (مثلاً: game123)">
    <button onclick="joinRoom()">دخول اللعبة فوراً 🚀</button>
  </div>

  <!-- ساحة اللعب -->
  <div class="card" id="game-card" style="display: none;">
    <div class="status-badge" id="room-display">الغرفة: -</div>
    <p id="turn-info" style="margin-bottom: 10px; font-weight: bold; color: var(--accent);">جاري التحميل...</p>

    <div class="board" id="board">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button onclick="resetGame()" style="background: #ef4444; color: #fff; margin-bottom: 15px;">إعادة اللعبة 🔄</button>

    <div id="chat-box"></div>
    <div class="chat-row">
      <input type="text" id="chat-input" placeholder="اكتب رسالة..." style="margin-top:0;">
      <button onclick="sendChat()" style="width: 30%; margin-top:0;">إرسال</button>
    </div>
  </div>

  <script>
    // استخدام قاعدة بيانات سريعة ومستقرة
    const firebaseConfig = {
      databaseURL: "https://yoursmartsite-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let myName = "";
    let roomKey = "";
    let mySymbol = ""; // X أو O
    let boardState = Array(9).fill("");
    let currentTurn = "X";

    function joinRoom() {
      myName = document.getElementById('username').value.trim();
      roomKey = document.getElementById('room-name').value.trim();

      if(!myName || !roomKey) {
        alert("من فضلك اكتب اسمك ورقم الغرفة!");
        return;
      }

      document.getElementById('login-card').style.display = 'none';
      document.getElementById('game-card').style.display = 'block';
      document.getElementById('room-display').innerText = "غرفة رقم: " + roomKey;

      // تحديد الرمز بناءً على الدخول (أول واحد يفتح الغرفة بياخد X، التاني بياخد O)
      const roomRef = db.ref('games/' + roomKey);
      roomRef.once('value', snapshot => {
        const data = snapshot.val();
        if (!data || !data.playerX) {
          mySymbol = "X";
          roomRef.update({ playerX: myName });
        } else {
          mySymbol = "O";
          roomRef.update({ playerO: myName });
        }
        
        // بدء الاستماع للتحديثات اللحظية
        listenToGame();
      });
    }

    function listenToGame() {
      db.ref('games/' + roomKey).on('value', snapshot => {
        const data = snapshot.val();
        if(data) {
          if(data.board) boardState = data.board;
          if(data.turn) currentTurn = data.turn;
          renderBoard();
        }
      });

      db.ref('games/' + roomKey + '/chat').on('child_added', snapshot => {
        const msg = snapshot.val();
        appendChat(`${msg.name}: ${msg.text}`);
      });
    }

    function makeMove(index) {
      if(boardState[index] !== "") return; // المربع مش فاضي
      if(currentTurn !== mySymbol) {
        alert("مش دورك! انتظر دورك يا بطل.");
        return;
      }

      boardState[index] = mySymbol;
      const nextTurn = mySymbol === "X" ? "O" : "X";

      // تحديث السيرفر بالحركة الجديدة فوراً
      db.ref('games/' + roomKey).update({
        board: boardState,
        turn: nextTurn
      });
    }

    function renderBoard() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((cell, idx) => {
        cell.innerText = boardState[idx];
        cell.className = 'cell ' + boardState[idx];
      });

      const turnText = document.getElementById('turn-info');
      if(currentTurn === mySymbol) {
        turnText.innerText = `👉 دورك أنت (${mySymbol})`;
        turnText.style.color = "var(--accent)";
      } else {
        turnText.innerText = `⏳ دور المنافس (${currentTurn})`;
        turnText.style.color = "#94a3b8";
      }
    }

    function resetGame() {
      db.ref('games/' + roomKey).update({
        board: Array(9).fill(""),
        turn: "X"
      });
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      if(!input.value.trim()) return;

      db.ref('games/' + roomKey + '/chat').push({
        name: myName,
        text: input.value
      });
      input.value = "";
    }

    function appendChat(text) {
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div>${text}</div>`;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
