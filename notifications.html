<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إشعارات لَمّة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100vh;background:radial-gradient(ellipse at 80% 0,#24164c,transparent 45%),#070b18;color:#f5f7ff;font:14px Cairo,Arial}.wrap{max-width:900px;margin:auto}.top,.card,.item{background:#101a30;border:1px solid #293b5c;border-radius:16px;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}.links{display:flex;gap:8px;flex-wrap:wrap}a,button{color:inherit;text-decoration:none;font:inherit}.btn{border:1px solid #3b4d70;background:#1b2b47;border-radius:10px;padding:8px 12px}.muted,small{color:#9aabc9}.item{display:flex;justify-content:space-between;gap:12px;margin-top:10px}.item.unread{border-color:#795de0;background:#171d3b}small{display:block;margin-top:5px;line-height:1.7}.empty{text-align:center;padding:25px;color:#9aabc9}</style></head><body><main class="wrap"><header class="top"><b>🔔 إشعارات لَمّة</b><div class="links"><a class="btn" href="./profile.html">بروفايلي</a><a class="btn" href="./social-hub.html">ميدان الأبطال</a><a class="btn" href="./index.html">الرئيسية</a></div></header><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>مركز الإشعارات</h1><span class="muted">طلبات الصداقة والفرق والبطولات وتنبيهات لَمّة.</span></div><button class="btn" id="markAll">تحديد الكل كمقروء</button></div><div id="list"><div class="empty">جاري التحميل...</div></div><p id="status" class="muted"></p></section></main><script type="module">import {firebaseConfig} from "./firebase-config.js";import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import {getDatabase,ref,onValue,update} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);let uid="",data={};const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function render(){const rows=Object.entries(data).map(([id,n])=>({id,...n})).sort((a,b)=>(Number(b.at)||0)-(Number(a.at)||0));$("list").innerHTML=rows.length?rows.map(n=>'<div class="item '+(!n.read?"unread":"")+'"><div><b>'+esc(n.title||"إشعار من لَمّة")+'</b><small>'+esc(n.body||"")+' · '+(n.at?new Date(n.at).toLocaleString("ar-EG"):"")+'</small></div>'+(!n.read?'<button class="btn" data-read="'+esc(n.id)+'">مقروء</button>':'<span class="muted">تمت القراءة</span>')+'</div>').join(""):'<div class="empty">مفيش إشعارات لحد دلوقتي.</div>';document.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>update(ref(db,"notifications/"+uid+"/"+b.dataset.read),{read:true}).catch(e=>$("status").textContent="تعذر تحديث الإشعار: "+e.message));}onAuthStateChanged(auth,user=>{if(!user||user.isAnonymous){$("list").innerHTML='<div class="empty">سجّل دخولك من الرئيسية لعرض إشعاراتك.</div>';return;}uid=user.uid;onValue(ref(db,"notifications/"+uid),x=>{data=x.val()||{};render();},e=>$("status").textContent="تعذر تحميل الإشعارات: "+e.message);});$("markAll").onclick=async()=>{try{const patch={};Object.entries(data).forEach(([id,n])=>{if(!n.read)patch[id+"/read"]=true});if(Object.keys(patch).length)await update(ref(db,"notifications/"+uid),patch);$("status").textContent="كل الإشعارات اتحددت كمقروءة.";}catch(e){$("status").textContent="تعذر تحديث الإشعارات: "+e.message;}};</script></body></html>
