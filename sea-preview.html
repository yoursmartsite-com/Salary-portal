<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061521;color:#fff;font-family:Arial,sans-serif}#renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:0}.hud{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#061521a8,transparent 22%,transparent 78%,#061521a8)}.top{position:absolute;top:18px;right:20px;left:20px;display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:20px;font-weight:800;text-shadow:0 2px 14px #000}.sub{font-size:11px;color:#b8dce7;margin-top:5px}.pill{border:1px solid #83d8d0a0;background:#062631c9;border-radius:20px;padding:9px 13px;font-size:10px;letter-spacing:.5px}.back{pointer-events:auto;position:absolute;top:76px;right:20px;text-decoration:none;color:#eaffff;background:#06232dcc;border:1px solid #ffffff44;border-radius:10px;padding:9px 13px;font-size:11px}.bottom{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);background:#061b25d9;border:1px solid #83d8d055;border-radius:14px;padding:10px 15px;font-size:11px;white-space:nowrap;text-align:center}@media(max-width:600px){.top{top:12px;left:12px;right:12px}.title{font-size:16px}.pill{font-size:9px;padding:7px 9px}.back{top:65px;right:12px}.bottom{bottom:12px;font-size:10px;max-width:calc(100% - 24px)}}

<body><canvas id="renderCanvas"></canvas>
<div class="hud"><div class="top"><div><div class="title">🌊 بحر لَمّة</div><div class="sub">نسخة مطوّرة · مياه ديناميكية وإضاءة ليلية</div></div><div class="pill">BABYLON.JS · OCEAN TEST</div></div><a class="back" href="./hub.html">العودة إلى عالم لَمّة</a><div class="bottom">اسحب لتدوير المشهد · استخدم إصبعين للتقريب والإبعاد</div></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(()=> {
 const canvas=document.getElementById('renderCanvas');
 if(!window.BABYLON){document.querySelector('.title').textContent='تعذر تحميل محرك العرض';return;}
 const B=BABYLON,engine=new B.Engine(canvas,true,{antialias:true,stencil:true,preserveDrawingBuffer:false});
 engine.setHardwareScalingLevel(Math.min(1.5,Math.max(1,devicePixelRatio||1)));
 const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.008,.022,.043,1);scene.fogMode=B.Scene.FOGMODE_EXP2;scene.fogColor=new B.Color3(.008,.022,.043);scene.fogDensity=.00115;
 const camera=new B.ArcRotateCamera('camera',Math.PI*.91,1.22,91,new B.Vector3(48,1,0),scene);camera.lowerRadiusLimit=38;camera.upperRadiusLimit=145;camera.lowerBetaLimit=.78;camera.upperBetaLimit=1.49;camera.wheelPrecision=42;camera.panningSensibility=0;camera.attachControl(canvas,true);
 const hemi=new B.HemisphericLight('sky-fill',new B.Vector3(0,1,0),scene);hemi.intensity=.55;hemi.diffuse=new B.Color3(.38,.57,.78);hemi.groundColor=new B.Color3(.035,.055,.065);
 const moonLight=new B.DirectionalLight('moonlight',new B.Vector3(-.45,-1,.16),scene);moonLight.position=new B.Vector3(15,48,-45);moonLight.intensity=1.25;moonLight.diffuse=new B.Color3(.67,.79,1);
 const sand=B.MeshBuilder.CreateGround('beach',{width:78,height:190,subdivisions:2},scene);sand.position.set(-21,-.26,0);
 const sandMat=new B.PBRMaterial('sand-material',scene);sandMat.albedoColor=new B.Color3(.34,.29,.21);sandMat.roughness=.94;sand.material=sandMat;
 const wet=B.MeshBuilder.CreateGround('wet-shore',{width:11,height:190,subdivisions:2},scene);wet.position.set(13.5,-.15,0);
 const wetMat=new B.PBRMaterial('wet-sand-material',scene);wetMat.albedoColor=new B.Color3(.095,.16,.16);wetMat.roughness=.22;wetMat.metallic=.08;wet.material=wetMat;
 const vertex=`
 precision highp float;
 attribute vec3 position;
 uniform mat4 world; uniform mat4 viewProjection; uniform float uTime;
 varying vec3 vWorld; varying float vHeight; varying vec2 vSlope;
 void main(){
  vec3 p=position; float t=uTime;
  float a=sin(p.x*.105+p.z*.038+t*.72)*.58;
  float b=sin(p.z*.145-p.x*.062-t*.51)*.29;
  float c=sin((p.x+p.z)*.075+t*.37)*.17;
  float d=sin(p.x*.29-p.z*.21+t*1.13)*.075;
  float e=sin(p.x*.48+p.z*.33-t*1.38)*.027;
  p.y+=a+b+c+d+e;
  float sx=cos(p.x*.105+p.z*.038+t*.72)*.0609-cos(p.z*.145-p.x*.062-t*.51)*.0180+cos((p.x+p.z)*.075+t*.37)*.01275+cos(p.x*.29-p.z*.21+t*1.13)*.02175+cos(p.x*.48+p.z*.33-t*1.38)*.01296;
  float sz=cos(p.x*.105+p.z*.038+t*.72)*.0220+cos(p.z*.145-p.x*.062-t*.51)*.04205+cos((p.x+p.z)*.075+t*.37)*.01275-sin(p.x*.29-p.z*.21+t*1.13)*.01575+cos(p.x*.48+p.z*.33-t*1.38)*.00891;
  vec4 w=world*vec4(p,1.0);vWorld=w.xyz;vHeight=p.y;vSlope=vec2(sx,sz);
  gl_Position=viewProjection*w;
 }`;
 const fragment=`
 precision highp float;
 uniform float uTime; uniform vec3 cameraPosition;
 varying vec3 vWorld; varying float vHeight; varying vec2 vSlope;
 float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
 void main(){
  float dist=vWorld.x;
  vec3 deep=vec3(.003,.025,.055),blue=vec3(.006,.075,.12),teal=vec3(.012,.17,.19);
  float shallow=1.0-smoothstep(24.0,85.0,dist);
  vec3 col=mix(deep,blue,shallow*.82);col=mix(col,teal,shallow*.34);
  vec3 N=normalize(vec3(-vSlope.x,1.0,-vSlope.y));vec3 V=normalize(cameraPosition-vWorld);
  float fres=pow(1.0-max(dot(N,V),0.0),3.0);
  vec3 L=normalize(vec3(-.35,.82,-.42));vec3 R=reflect(-L,N);
  float spec=pow(max(dot(R,V),0.0),75.0);
  float moonLine=exp(-pow((vWorld.z+vWorld.x*.16+sin(vWorld.x*.045+uTime*.24)*5.0)*.045,2.0));
  float glint=pow(max(0.0,sin(vWorld.x*.19+vWorld.z*.12+uTime*.82)*sin(vWorld.z*.28-uTime*.63)),10.0);
  float micro=noise(vWorld.xz*.24+vec2(uTime*.08,-uTime*.11));
  float crest=smoothstep(.48,.79,vHeight+micro*.22);
  float foamEdge=1.0-smoothstep(18.5,24.0,dist+sin(vWorld.z*.11+uTime*.72)*1.15+noise(vWorld.zy*.19+uTime*.15)*1.4);
  float foamNoise=noise(vWorld.xz*.34+vec2(uTime*.17,-uTime*.11));
  float shoreFoam=foamEdge*smoothstep(.36,.7,foamNoise+sin(vWorld.z*.31+uTime*1.15)*.2);
  col+=vec3(.24,.39,.54)*spec*(.35+moonLine*.95);
  col+=vec3(.18,.3,.4)*moonLine*glint*.8;
  col+=vec3(.12,.28,.31)*fres*.5;
  col+=vec3(.2,.34,.37)*crest*.18;
  col=mix(col,vec3(.63,.79,.79),shoreFoam*.78);
  gl_FragColor=vec4(col,1.0);
 }`;
 const water=B.MeshBuilder.CreateGround('ocean',{width:190,height:190,subdivisions:220},scene);water.position.set(114,-.055,0);
 const waterMat=new B.ShaderMaterial('ocean-shader',scene,{vertexSource:vertex,fragmentSource:fragment},{attributes:['position'],uniforms:['world','viewProjection','uTime','cameraPosition']});waterMat.backFaceCulling=false;water.material=waterMat;
 // Animated foam is generated directly in the ocean shader, so no per-frame mesh allocation is needed.\n // Dark coastal rocks with irregular scale and a little wet sheen.
 const rockMat=new B.PBRMaterial('basalt-rock',scene);rockMat.albedoColor=new B.Color3(.105,.14,.15);rockMat.roughness=.72;
 for(let i=0;i<54;i++){const z=-91+(i*41%178);if(Math.abs(z)<9)continue;const x=10+(i*19%10);const rock=B.MeshBuilder.CreatePolyhedron('coastal-rock',{type:i%3,size:.42+(i%5)*.17},scene);rock.position.set(x,-.02,z);rock.scaling.set(1.2+(i%3)*.3,.48+(i%4)*.14,.9+(i%2)*.35);rock.rotation.set(i*.19,i*.73,i*.27);rock.material=rockMat;}
 // Moon, atmospheric halo and scattered stars.
 const moon=B.MeshBuilder.CreateSphere('moon',{diameter:6.8,segments:32},scene);moon.position.set(5,42,-65);
 const moonMat=new B.StandardMaterial('moon-material',scene);moonMat.emissiveColor=new B.Color3(.72,.82,1);moon.material=moonMat;
 const halo=B.MeshBuilder.CreateSphere('moon-atmosphere',{diameter:13,segments:24},scene);halo.position.copyFrom(moon.position);const haloMat=new B.StandardMaterial('halo-material',scene);haloMat.emissiveColor=new B.Color3(.12,.2,.38);haloMat.alpha=.13;haloMat.disableLighting=true;halo.material=haloMat;
 const starMat=new B.StandardMaterial('star-material',scene);starMat.emissiveColor=new B.Color3(.48,.62,.85);starMat.disableLighting=true;
 for(let i=0;i<210;i++){const s=B.MeshBuilder.CreateSphere('star',{diameter:.08+(i%4)*.035,segments:5},scene);const ang=i*2.399,rad=55+(i%23)*2.5;s.position.set(Math.cos(ang)*rad,20+(i%13)*3.2,Math.sin(ang)*rad-20);s.material=starMat;}
 let time=0;
 engine.runRenderLoop(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.04);time+=dt;waterMat.setFloat('uTime',time);waterMat.setVector3('cameraPosition',camera.position);
  scene.render();
 });
 window.addEventListener('resize',()=>engine.resize());
})();
</script></body></html>
