<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>قتال الشوارع | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;text-align:center}header{padding:12px;background:#0b2034;border-bottom:1px solid #246080;display:flex;justify-content:space-between;align-items:center}h2{font-size:19px;margin:0}button{border:1px solid #46b8e8;background:#07517b;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;touch-action:manipulation}main{max-width:900px;margin:auto;padding:10px}canvas{width:100%;height:min(65vh,540px);display:block;background:#0c2235;border:1px solid #2d5976;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}.hint{color:#a6c6da;font-size:13px;padding:4px}button:active{transform:scale(.98)}</style><header><h2>قتال الشوارع</h2><button onclick="location.href='/'">لَمّة ⌂</button></header><main><div class="hint">تحرك يمين وشمال واضرب الخصم قبل ما طاقتك تخلص.</div><canvas id="c" width="800" height="520"></canvas><div class="controls"><button onclick="move(-1)">◀</button><button onclick="attack()">لكمة 👊</button><button onclick="move(1)">▶</button><button onclick="reset()">إعادة</button></div><div id="status" class="hint">ابدأ اللعب!</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let p=150,e=630,hp=100,ehp=100;function draw(){x.fillStyle='#19273a';x.fillRect(0,0,800,520);x.fillStyle='#6b7280';x.fillRect(0,420,800,100);for(let i=0;i<5;i++){x.fillStyle='#253f55';x.fillRect(i*170+20,90,80,330)}fighter(p,'#4dd5ff');fighter(e,'#ff5968');x.fillStyle='#333';x.fillRect(40,30,250,18);x.fillRect(510,30,250,18);x.fillStyle='#57e389';x.fillRect(40,30,250*hp/100,18);x.fillStyle='#ff5968';x.fillRect(510,30,250*ehp/100,18)}function fighter(px,col){x.fillStyle=col;x.fillRect(px-20,340,40,80);x.beginPath();x.arc(px,320,20,0,7);x.fill()}function move(d){p=Math.max(50,Math.min(750,p+d*25));if(Math.abs(p-e)<100)e=Math.max(40,Math.min(760,e+(e>p?1:-1)*20));draw()}function attack(){if(Math.abs(p-e)<125)ehp=Math.max(0,ehp-15);else s.textContent='قرّب من الخصم الأول!';if(ehp>0&&Math.abs(p-e)<150)hp=Math.max(0,hp-7);s.textContent=ehp===0?'🏆 كسبت القتال!':hp===0?'خسرت الجولة':'طاقتك '+hp+' — طاقة الخصم '+ehp;draw()}function reset(){hp=ehp=100;p=150;e=630;draw();s.textContent='ابدأ القتال!'}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.code==='Space')attack()});reset();</script></html>
