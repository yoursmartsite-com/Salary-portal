name: Build and deploy Rahaf to GitHub Pages
on:
  push:
    branches: [rahaf-github-migration]
    paths:
      - "rahaf-app/**"
      - ".github/workflows/deploy-rahaf-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rahaf-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: rahaf-app
        run: npm install
      - name: Build
        working-directory: rahaf-app
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rahaf-app/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
