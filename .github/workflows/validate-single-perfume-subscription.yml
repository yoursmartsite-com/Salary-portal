name: Validate single-store perfume subscription
on:
  push:
    branches:
      - feature/perfumes-single-subscription
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded app JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('perfumes/index.html', 'utf8');
          const match = html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Main module script not found');
          fs.writeFileSync('/tmp/perfumes-app.mjs', match[1]);
          NODE
          node --check /tmp/perfumes-app.mjs
      - name: Check subscription wiring and preserve single-store data model
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('perfumes/index.html', 'utf8');
          for (const token of ['appConfig","subscription', 'onSnapshot(subscriptionRef', 'subscriptionLock', 'subscriptionRenew', 'ADMIN_UID']) {
            if (!html.includes(token)) throw new Error('Missing expected subscription feature: ' + token);
          }
          if (html.includes('SHOP_ID') || html.includes('shopId')) throw new Error('Multi-shop identifiers must not be added to the single-store app');
          console.log('Subscription wiring checks passed.');
          NODE
