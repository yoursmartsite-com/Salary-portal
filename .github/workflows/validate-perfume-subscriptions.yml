name: Validate perfume subscription preview

on:
  push:
    branches:
      - backup/perfumes-before-subscriptions-2026-11-24
    paths:
      - "perfumes/**"
      - ".github/workflows/validate-perfume-subscriptions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript and tenant wiring
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for filename in ["perfumes/index.html", "perfumes/subscriptions-admin.html"]:
              html = Path(filename).read_text()
              scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
              if not scripts:
                  raise SystemExit(f"No module script found in {filename}")
              for i, script in enumerate(scripts):
                  Path(f"/tmp/{Path(filename).stem}-{i}.mjs").write_text(script)
          app = Path("perfumes/index.html").read_text()
          admin = Path("perfumes/subscriptions-admin.html").read_text()
          rules = Path("perfumes/firestore-subscriptions.rules").read_text()
          required = [
              ('shop-scoped product query', 'where("shopId","==",SHOP_ID)' in app),
              ('shop-scoped order creation', '{shopId:SHOP_ID,userId:currentUser.uid' in app),
              ('subscription lock', 'subscriptionLock' in app and 'shopStatus' in app),
              ('owner dashboard migration', 'migrateLegacy' in admin),
              ('shop account membership', 'shopMembers' in admin),
              ('public status read', 'match /shopStatus/{shopId}' in rules and 'allow read: if true;' in rules),
              ('server-side expiry enforcement', 'expiresAt > request.time' in rules),
              ('owner-only subscription changes', 'allow create, update, delete: if isOwner();' in rules),
          ]
          failed = [name for name, ok in required if not ok]
          for name, ok in required:
              print(("PASS" if ok else "FAIL") + ": " + name)
          if failed:
              raise SystemExit("Missing required tenant wiring: " + ", ".join(failed))
          PY
          node --check /tmp/index-0.mjs
          node --check /tmp/subscriptions-admin-0.mjs
          echo "Both preview pages passed JavaScript syntax and tenant-wiring checks."
