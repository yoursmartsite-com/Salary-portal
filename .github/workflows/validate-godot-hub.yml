name: Validate and export Lamma Godot HUB

on:
  workflow_dispatch:
  push:
    paths:
      - 'hub-godot/**'
      - '.github/workflows/validate-godot-hub.yml'

permissions:
  contents: write

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          VERSION="4.7.2"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          GODOT_BIN="$(find /tmp/godot -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project and validate GDScript
        run: |
          "$GODOT_BIN" --headless --editor --path hub-godot --quit --verbose

      - name: Run headless scene smoke test
        run: |
          "$GODOT_BIN" --headless --path hub-godot --quit-after 5

      - name: Test remote player creation and interpolation
        run: |
          "$GODOT_BIN" --headless --path hub-godot --script res://tests/remote_avatar_smoke.gd

      - name: Export Web build
        run: |
          mkdir -p hub-web
          "$GODOT_BIN" --headless --path hub-godot --export-release Web ../hub-web/index.html

      - name: Publish isolated HUB preview without replacing the current hub
        run: |
          set -euo pipefail
          mkdir -p hub-preview
          rsync -a --delete hub-web/ hub-preview/
          touch hub-preview/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub-preview
          if git diff --cached --quiet; then
            echo "Preview is already up to date"
          else
            git commit -m "Publish isolated Lamma HUB web preview"
            git push origin HEAD:main
          fi

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamma-hub-web-preview
          path: hub-web/
          if-no-files-found: error
