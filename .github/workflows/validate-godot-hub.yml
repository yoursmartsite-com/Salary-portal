name: Validate and export Lamma Godot HUB

on:
  workflow_dispatch:
  push:
    paths:
      - 'hub-godot/**'
      - '.github/workflows/validate-godot-hub.yml'

permissions:
  contents: write

concurrency:
  group: lamma-hub-preview-publish
  cancel-in-progress: false

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download licensed rigged Lamma avatar
        run: |
          set -euo pipefail
          mkdir -p hub-godot/assets
          curl -fL --retry 3 "https://grab3d.com/dl/woman-rigged/woman-rigged.glb" -o hub-godot/assets/lamma_girl.glb
          test -s hub-godot/assets/lamma_girl.glb
          curl -fL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o hub-godot/assets/Cairo.ttf
          test -s hub-godot/assets/Cairo.ttf
          echo "Downloaded rigged Casual Woman GLB ($(du -h hub-godot/assets/lamma_girl.glb | cut -f1))"

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          VERSION="4.7.2"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          GODOT_BIN="$(find /tmp/godot -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project and validate GDScript
        run: |
          "$GODOT_BIN" --headless --editor --path hub-godot --quit --verbose

      - name: Validate imported avatar walk and run clips
        timeout-minutes: 1
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path hub-godot --script res://tests/avatar_animation_smoke.gd

      - name: Run headless scene smoke test
        run: |
          "$GODOT_BIN" --headless --path hub-godot --quit-after 5

      - name: Test remote player creation, movement, and portal UI
        timeout-minutes: 1
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path hub-godot --script res://tests/remote_avatar_smoke.gd

      - name: Test mobile joystick, camera, buttons, and saved layout
        timeout-minutes: 1
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path hub-godot --script res://tests/mobile_controls_smoke.gd

      - name: Export Web build
        run: |
          mkdir -p hub-web
          "$GODOT_BIN" --headless --path hub-godot --export-release Web ../hub-web/index.html

      - name: Publish isolated HUB preview without replacing the current hub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          # Start each publish attempt from the latest main revision. This avoids
          # rebasing newly exported binary PCK files over another preview commit.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            mkdir -p hub-preview
            rsync -a --delete hub-web/ hub-preview/
            touch hub-preview/.nojekyll
            git add hub-preview
            if git diff --cached --quiet; then
              echo "Preview is already up to date"
              exit 0
            fi
            git commit -m "Publish isolated Lamma HUB web preview"
            if git push origin HEAD:main; then
              echo "Published isolated HUB preview"
              exit 0
            fi
            echo "Push raced with another main update; retrying from latest main (attempt $attempt)"
          done
          echo "Could not publish preview after 3 attempts"
          exit 1

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lamma-hub-web-preview
          path: hub-web/
          if-no-files-found: error
