name: Build OMNIX GUARD APK
on:
  push:
    branches: [omnix-guard-android]
    paths:
      - 'OMNIX_GUARD/**'
      - '.github/workflows/omnix-guard-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: OMNIX_GUARD
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OMNIX-GUARD-Android-APK
          path: OMNIX_GUARD/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
