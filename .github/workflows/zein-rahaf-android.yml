name: Build Rahaf Website-Connected Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/zein-rahaf-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rahaf-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish portal-enabled APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rahaf-android-latest
          name: Rahaf Android 1.4.0 - Website Connected
          body: "This Android app opens the live Rahaf website directly. Website updates appear in the app without reinstalling."
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
