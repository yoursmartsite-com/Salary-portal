name: Build and publish Lamma Android update

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-android-apk.yml'
      - 'android-update.json'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'games/**'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package website into Android app
        run: |
          mkdir -p app/src/main/assets/Salary-portal
          rsync -a ./ app/src/main/assets/Salary-portal/ \
            --exclude='.git/' --exclude='.github/' --exclude='app/' \
            --exclude='functions/' --exclude='cloudflare/' \
            --exclude='README*' --exclude='*.zip' \
            --exclude='build.gradle' --exclude='settings.gradle' \
            --exclude='gradle.properties' --exclude='local.properties'
          test -s app/src/main/assets/Salary-portal/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform and Gradle
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          curl -L --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Configure persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Add ANDROID_KEYSTORE_BASE64 in GitHub Actions secrets"; exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Add ANDROID_STORE_PASSWORD in GitHub Actions secrets"; exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Add ANDROID_KEY_ALIAS in GitHub Actions secrets"; exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Add ANDROID_KEY_PASSWORD in GitHub Actions secrets"; exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lamma-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lamma-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon clean assembleRelease

      - name: Name APK for permanent download
        run: cp app/build/outputs/apk/release/app-release.apk lamma.apk

      - name: Publish permanent APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lamma-android-${{ github.run_number }}
          name: Lamma Android ${{ github.run_number }}
          make_latest: true
          files: lamma.apk
