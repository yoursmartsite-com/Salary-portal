name: Build Lamma Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!README*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete Lamma website and Android project
        uses: actions/checkout@v4

      - name: Package the full website inside the Android app
        run: |
          mkdir -p app/src/main/assets/Salary-portal
          rsync -a ./ app/src/main/assets/Salary-portal/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='app/' \
            --exclude='functions/' \
            --exclude='cloudflare/' \
            --exclude='README*' \
            --exclude='*.zip' \
            --exclude='build.gradle' \
            --exclude='settings.gradle' \
            --exclude='gradle.properties' \
            --exclude='local.properties'
          test -s app/src/main/assets/Salary-portal/index.html
          echo "Packaged website files:"
          find app/src/main/assets/Salary-portal -type f | wc -l
          du -sh app/src/main/assets/Salary-portal

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build release-ready debug APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lamma-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
