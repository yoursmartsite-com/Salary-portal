name: Build ZEIN & RAHAF Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "perfumes/**"
      - ".github/workflows/build-perfumes-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: perfumes
        run: npm install

      - name: Prepare app web files
        working-directory: perfumes
        run: |
          mkdir -p www
          cp *.html *.js *.webmanifest *.png *.svg www/

      - name: Generate Android project
        working-directory: perfumes
        run: |
          npx cap add android
          npx cap sync android
          cp google-services.json android/app/google-services.json
          sed -i '/classpath.*com.android.tools.build:gradle/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          printf '\napply plugin: "com.google.gms.google-services"\n' >> android/app/build.gradle

      - name: Apply ZEIN & RAHAF perfume bottle app icon
        working-directory: perfumes
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert app-icon.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            convert -background none app-icon.svg -resize "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
            fg_size=$((size * 9 / 4))
            convert app-icon.png -resize "${fg_size}x${fg_size}" "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
          done

      - name: Build debug APK
        working-directory: perfumes/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zein-rahaf-android-apk
          path: perfumes/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZEIN & RAHAF Android App
          body: "Official Android installer for ZEIN & RAHAF PERFUMES."
          files: perfumes/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
