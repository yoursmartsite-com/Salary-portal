name: Build ZEIN & RAHAF Android Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "perfumes/**"
      - ".github/workflows/build-perfumes-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: perfumes
        run: npm install

      - name: Prepare app web files
        working-directory: perfumes
        run: |
          mkdir -p www
          cp *.html *.js *.webmanifest *.png *.svg www/

      - name: Generate Android project
        working-directory: perfumes
        run: |
          npx cap add android
          npx cap sync android
          cp google-services.json android/app/google-services.json
          sed -i '/classpath.*com.android.tools.build:gradle/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          printf '\napply plugin: "com.google.gms.google-services"\n' >> android/app/build.gradle

      - name: Install ZEIN & RAHAF mandatory-update activity
        working-directory: perfumes
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/zeinrahaf/zeinrahafstore
          cp native-android/MainActivity.java android/app/src/main/java/com/zeinrahaf/zeinrahafstore/MainActivity.java
          sed -i "s/versionCode 1/versionCode 2/" android/app/build.gradle
          sed -i "s/versionName '1.0'/versionName '1.0.1'/" android/app/build.gradle
          grep -q 'versionCode 2' android/app/build.gradle

      - name: Apply ZEIN & RAHAF perfume bottle app icon
        working-directory: perfumes
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert app-icon.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            convert -background none app-icon.svg -resize "${size}x${size}" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
            fg_size=$((size * 9 / 4))
            convert app-icon.png -resize "${fg_size}x${fg_size}" "android/app/src/main/res/mipmap-$density/ic_launcher_foreground.png"
          done

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zein-rahaf-release.jks"
          test -s "$RUNNER_TEMP/zein-rahaf-release.jks"

      - name: Build signed release APK
        working-directory: perfumes/android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/zein-rahaf-release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: zein-rahaf-android-release-apk
          path: perfumes/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZEIN & RAHAF Android App
          body: "Official signed Android release installer for ZEIN & RAHAF PERFUMES."
          files: perfumes/android/app/build/outputs/apk/release/app-release.apk
          overwrite_files: true
          make_latest: true
