name: Build ZEIN & RAHAF Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "perfumes/**"
      - ".github/workflows/build-perfumes-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: perfumes
        run: npm install

      - name: Prepare app web files
        working-directory: perfumes
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Generate Android project
        working-directory: perfumes
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: perfumes/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zein-rahaf-android-apk
          path: perfumes/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZEIN & RAHAF Android App
          body: "Official Android installer for ZEIN & RAHAF PERFUMES."
          files: perfumes/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
