name: Deploy Perfumes Realtime Database Rules

on:
  workflow_dispatch:
  push:
    paths:
      - "perfumes/database.rules.json"
      - "perfumes/firebase.json"
      - ".github/workflows/deploy-perfumes-db-rules.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Authenticate and deploy database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          firebase deploy --only database --project perfumes-12f57 --config perfumes/firebase.json --non-interactive
