<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>فقاعات الألوان | لَمّة</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui;text-align:center}header{padding:12px;background:#0b2034;border-bottom:1px solid #246080;display:flex;justify-content:space-between;align-items:center}h2{font-size:19px;margin:0}button{border:1px solid #46b8e8;background:#07517b;color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;font-size:15px;touch-action:manipulation}main{max-width:900px;margin:auto;padding:10px}canvas{width:100%;height:min(65vh,540px);display:block;background:#0c2235;border:1px solid #2d5976;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}.hint{color:#a6c6da;font-size:13px;padding:4px}button:active{transform:scale(.98)}</style><header><h2>فقاعات الألوان</h2><button onclick="location.href='/'">لَمّة ⌂</button></header><main><div class="hint">اضغط على مكان التصويب. اجمع 3 فقاعات من نفس اللون لتفجيرها.</div><canvas id="c" width="800" height="520"></canvas><div class="controls"><button onclick="reset()">لعبة جديدة</button></div><div id="status" class="hint">ابدأ اللعب!</div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#status');let colors=['#ff5d73','#ffcf5a','#51d7ff','#9b7bff','#64e69a'],balls=[],next=0,score=0;function reset(){balls=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)balls.push({x:80+col*70+(r%2)*25,y:55+r*38,col:colors[(Math.random()*5)|0]});score=0;next=0;draw()}function draw(){x.fillStyle='#102b45';x.fillRect(0,0,800,520);balls.forEach(b=>{x.fillStyle=b.col;x.beginPath();x.arc(b.x,b.y,17,0,7);x.fill();x.strokeStyle='#ffffff66';x.stroke()});x.fillStyle=colors[next%5];x.beginPath();x.arc(400,480,18,0,7);x.fill();s.textContent='النقاط: '+score+' • الفقاعة القادمة: '+(next+1)}c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),tx=(e.clientX-r.left)*800/r.width,ty=(e.clientY-r.top)*520/r.height;let col=colors[next++%5],b={x:400,y:470,col};let dx=tx-400,dy=ty-470,len=Math.hypot(dx,dy)||1;for(let i=0;i<100&&b.y>20;i++){b.x+=dx/len*5;b.y+=dy/len*5;let hit=balls.find(q=>Math.hypot(q.x-b.x,q.y-b.y)<30);if(hit){let group=balls.filter(q=>q.col===col&&Math.hypot(q.x-hit.x,q.y-hit.y)<95);if(hit.col===col&&group.length>=2){balls=balls.filter(q=>!group.includes(q));score+=group.length+1}else balls.push({x:b.x,y:b.y,col});break}}draw()});reset();</script></html>
